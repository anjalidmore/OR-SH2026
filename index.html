{t:"m1t15", stage:"solve", q:"Among the Cⱼ − Zⱼ entries 7 − 5M, 15 − 13M and 20 − 12M in a minimisation, the entering variable is the one with:",
 o:["15 − 13M, the largest M-coefficient subtracted","7 − 5M, the smallest constant","20 − 12M, the largest constant","none — all are positive"], a:0,
 e:"For a minimisation we want the most negative. With M arbitrarily large the M term dominates, so compare M-coefficients first: 13 > 12 > 5, making 15 − 13M the most negative. The constants 7, 15 and 20 only matter as a tie-break between equal M-coefficients."},
{t:"m1t15", stage:"concept", q:"An artificial variable remaining basic at a positive value in the final table means:",
 o:["the original problem has no feasible solution","the solution is unbounded","the solution is degenerate","alternate optima exist"], a:0,
 e:"The artificial is not part of the original problem. Keeping it at a positive value means the original constraints cannot all be satisfied at once — infeasibility. Unbounded is the opposite situation, diagnosed from a key column of non-positive entries."},
{t:"m1t15", stage:"solve", q:"Min Z = 7x₁ + 15x₂ + 20x₃ with 2x₁+4x₂+6x₃ ≥ 24 and 3x₁+9x₂+6x₃ ≥ 30 has optimal value:",
 o:["82","54","100","24"], a:0,
 e:"At x₂ = 6/5 and x₃ = 16/5, Z = 15(6/5) + 20(16/5) = 18 + 64 = 82, and both constraints hold with equality. The alternate optimum (6, 0, 2) gives 7(6) + 20(2) = 42 + 40 = 82 as well — the zero under x₁ in the final index row is what signals this."},
{t:"m1t16", stage:"concept", q:"The revised objective function in Phase 1 of the two-phase method is:",
 o:["Min Z = a₁ + a₂ (the artificial variables only)","the original objective with M penalties","Max Z = a₁ + a₂","the original objective with zero coefficients"], a:0,
 e:"Phase 1 ignores the real costs entirely and minimises only the sum of the artificials. Every other variable is priced at 0. Option B is the Big M method, which achieves the same goal in a single continuous table."},
{t:"m1t16", stage:"concept", q:"If the Phase 1 objective value is NOT zero at the end of Phase 1, you should:",
 o:["conclude the problem does not have an optimal solution and stop","proceed to Phase 2 anyway","restart Phase 1 with a different entering variable","switch to the Big M method"], a:0,
 e:"A non-zero Phase 1 objective means the artificials cannot all be driven out, so no point satisfies the original constraints — the problem is infeasible. Switching methods would not help: Big M would end with a surviving positive artificial, reporting the same thing."},
{t:"m1t16", stage:"concept", q:"Your notes state that the two-phase method is meant only for:",
 o:["minimisation problems","maximisation problems","problems with only ≤ constraints","problems with two variables"], a:0,
 e:"The notes say so directly, and add the remedy: if you are given a maximisation, convert it into a minimisation by changing the sign. Big M has no such restriction, which is one reason to know both."},
{t:"m1t17", stage:"solve", q:"The dual of Max Z = 4x₁ + 5x₂ subject to 3x₁ + x₂ ≤ 15, x₁ + 2x₂ ≤ 10, 5x₁ + 2x₂ ≤ 20 begins:",
 o:["Min W = 15y₁ + 10y₂ + 20y₃","Max W = 15y₁ + 10y₂ + 20y₃","Min W = 4y₁ + 5y₂","Min W = 15y₁ + 10y₂"], a:0,
 e:"Max becomes Min, and the primal's right-hand sides 15, 10 and 20 become the dual's objective coefficients. There are three of them because the primal has three constraints, so the dual has three variables. Option C swaps the roles of the objective coefficients and the right-hand sides."},
{t:"m1t17", stage:"select", q:"Before writing the dual of a maximisation with a mixed set of constraints, you must:",
 o:["convert every constraint to ≤ by multiplying the offenders by −1","convert every constraint to ≥","remove the non-negativity conditions","solve the primal first"], a:0,
 e:"For a maximisation all constraints should be ≤; for a minimisation all should be ≥. Multiplying by −1 reverses the inequality and negates every term including the right-hand side. Transposing straight from mixed directions produces a dual that is not the dual."},
{t:"m1t18", stage:"concept", q:"In the dual's optimal table, the primal's variable values are found:",
 o:["as the magnitudes of Cⱼ − Zⱼ under the slack columns","in the dual's Solution column","in the dual's C_Bi column","by re-solving the primal from scratch"], a:0,
 e:"The final table carries both solutions. The dual's own variables are in its Solution column; the primal's are the magnitudes of the index-row entries under the slack columns — 20 and 30 in your worked example, which is exactly the primal optimum (20, 30)."},
{t:"m1t18", stage:"recognise", q:"A primal with 2 variables and 5 constraints is best solved by:",
 o:["constructing and solving the dual, which has 2 constraints","the primal directly, since it has few variables","the graphical method","the two-phase method"], a:0,
 e:"Rows in a simplex table come from constraints, and the number of pivots is bounded by the number of rows. The dual would have 5 variables and only 2 constraints — a two-row table instead of a five-row one. This is exactly the motivation your notes give for the dual approach."},
{t:"m1t19", stage:"recognise", q:"At optimality, a variable that is NOT in the basis has Cⱼ − Zⱼ = 0. This indicates:",
 o:["alternate optimal solutions","degeneracy","an unbounded solution","an infeasible problem"], a:0,
 e:"A non-basic variable with a zero index entry can enter the basis without changing Z, so a second optimal solution exists — and so does every point on the segment between them. Note the qualifier: basic variables always show zero there and carry no information."},
{t:"m1t19", stage:"recognise", q:"A tie for the smallest ratio in the minimum ratio test leads to:",
 o:["degeneracy — a basic variable at value 0 in the next table","an unbounded solution","infeasibility","alternate optima"], a:0,
 e:"When two rows tie, one leaves and the other's basic variable enters the next table at value 0 — a degenerate basic feasible solution. Break the tie arbitrarily and continue; a degenerate pivot leaves Z unchanged, which is normal and not a sign of error."},
{t:"m1t19", stage:"concept", q:"A row whose key column entry is 0 has its ratio written as ∞. That row:",
 o:["does not compete in the ratio test","is automatically the key row","makes the problem unbounded","must be deleted"], a:0,
 e:"Only strictly positive key column entries generate a competing ratio. Zero gives ∞ and a negative entry gives a negative ratio; neither limits how far the entering variable can increase. Only if <i>every</i> entry in the key column is ≤ 0 is the problem unbounded."},
{t:"m1t20", stage:"recognise", q:"A square cost matrix with people down the side and jobs across, one job per person, signals:",
 o:["an assignment problem","a transportation problem","a game theory problem","a linear programming formulation"], a:0,
 e:"Assignment is strictly one-to-one and its matrix is square. Transportation moves divisible quantities against supplies and demands and its matrix is generally rectangular. A game matrix has two players' strategies, not people and jobs."},

{t:"m5t1", stage:"concept", q:"The value of the game is defined as:",
 o:["the expected winnings if the game is played a large number of times","the largest payoff in the matrix","the payoff of a single play","the sum of all payoffs"], a:0,
 e:"Your notes define it twice as an expectation — 'the expected winnings of the game if the game is played a large number of times' and 'the average or expected game outcome if the game is played an infinite number of times'. In a mixed game the value need not even appear in the matrix: 38/11 is not one of 4, 2, 1, 10."},
{t:"m5t1", stage:"concept", q:"A game is one of pure strategy when:",
 o:["each player can identify one and only one strategy as optimal in each play",
    "each player has exactly one strategy available",
    "the payoff matrix contains only positive numbers",
    "both players randomise their choices"], a:0,
 e:"The notes define pure strategy by one strategy being identifiably optimal each play — not by there being only one strategy available, which is option B's confusion. Option D describes a mixed strategy game."},
{t:"m5t1", stage:"concept", q:"Game theory dates from the 1944 book Theory of Games and Economic Behavior by:",
 o:["von Neumann and Morgenstern","Nash and Selten","Harsanyi and Nash","Morse and Kimball"], a:0,
 e:"Von Neumann and Morgenstern founded the subject in 1944. Harsanyi, Nash and Selten shared the 1994 Nobel Prize for noncooperative game theory, which came later. Morse and Kimball belong to Operations Research generally, not to game theory."},
{t:"m5t2", stage:"concept", q:"'Zero-sum' means that:",
 o:["one player's gain exactly equals the other player's loss in every outcome",
    "the entries of the payoff matrix add up to zero",
    "the value of the game is zero",
    "neither player can win"], a:0,
 e:"Zero-sum is a per-outcome condition: for each cell, X's gain plus Y's loss is zero. The matrix entries need not sum to zero — the advertising matrix's entries sum to 7. A value of zero is a <i>fair</i> game, which is a different property."},
{t:"m5t2", stage:"recognise", q:"Why is the prisoner's dilemma NOT a two-person zero-sum game?",
 o:["both prisoners can be worse off at once, which zero-sum forbids",
    "it has three players",
    "the payoffs are years rather than money",
    "there is no payoff matrix"], a:0,
 e:"In the 'both confess' cell both get 20 years, worse than the 1 year each from 'neither talks'. A jointly bad outcome cannot exist in a zero-sum game, where one player's loss is necessarily the other's gain. The notes use it to introduce Nash equilibrium, not as a solvable example."},
{t:"m5t3", stage:"select", q:"For a 2×2 matrix with maximin = 6 and minimax = 6, the correct next step is:",
 o:["stop — a saddle point exists and V = 6","apply the mixed strategy formulas","apply dominance","compute D = a + d − b − c"], a:0,
 e:"Equal margins mean a saddle point, pure strategies, and the answer is already complete. Running the mixed formulas on a game with a saddle point produces meaningless probabilities. Size alone never decides the method — the saddle-point test does."},
{t:"m5t3", stage:"select", q:"A 3×4 matrix has maximin = 3 and minimax = 4. The route is:",
 o:["dominance to reduce to 2×2, then the mixed strategy formulas","the mixed formulas applied directly","a pure strategy answer","no solution exists"], a:0,
 e:"Unequal margins mean no saddle point, so mixed strategies are needed — but the formulas only apply to a 2×2, so dominance must reduce it first. Your notes stop at 2×2 by hand; anything dominance cannot reduce needs a computer solution."},
{t:"m5t4", stage:"recognise", q:"Which of these is a managerial application of game theory listed in your notes?",
 o:["Evaluation of the location of the facilities","Forecasting seasonal demand","Depreciation of fixed assets","Recruitment interviewing"], a:0,
 e:"The notes' ten applications are market strategy analysis, consumer response to a new product, resolving conflict between two groups, increasing market share, material procurement, transportation decisions, evaluating the distribution system, evaluating facility location, examining new ventures, and the competitive economic environment. The other three options are management topics but appear nowhere in the list."},
{t:"m5t4", stage:"concept", q:"Which application fits the two-person zero-sum structure most cleanly?",
 o:["Deciding techniques to increase market share against one rival","Examining a new business venture","Material procurement scheduling","Training and development planning"], a:0,
 e:"In a market of fixed size, a share point gained by one firm is exactly a share point lost by the other — the zero-sum condition. Your notes' advertising example is built on this. A new venture can grow the total market so both parties gain, which is precisely non-zero-sum."},
{t:"m5t5", stage:"concept", q:"A Nash equilibrium is a state in which:",
 o:["no participant can gain by a unilateral change of strategy if the others' strategies stay unchanged",
    "all participants achieve their best possible outcome",
    "the payoffs to all participants are equal",
    "the value of the game is zero"], a:0,
 e:"The word doing the work is 'unilateral' — no one can improve by changing alone. In the prisoner's dilemma both confessing is a Nash equilibrium even though both would prefer both staying silent, because either prisoner switching alone moves from 20 years to a life sentence. Stable does not mean good, which rules out option B."},
{t:"m5t5", stage:"recognise", q:"In the prisoner's dilemma, the prisoner who receives a life sentence is the one who:",
 o:["did not cooperate with the police while the other confessed","confessed while the other stayed silent","stayed silent while the other also stayed silent","confessed while the other also confessed"], a:0,
 e:"The notes state that if only one confesses and testifies, the one who did not cooperate with the police gets a life sentence and the one who did cooperate gets parole. Both silent gives one year each; both confessing gives twenty years each. Getting these four outcomes the wrong way round is the usual error in this short-note question."},
{t:"m5t6", stage:"solve", q:"For rows with minima −3, −1, 2 and 12, the maximin is:",
 o:["12","−3","2","−1"], a:0,
 e:"Maximin is the maximum of the row minima, so 12. Note the order of operations: minimum of each row first, then the maximum of those. Taking the maximum of each row first is the single commonest error in this topic."},
{t:"m5t6", stage:"solve", q:"For rows with minima −6, −8, −5 and −4, the maximin is:",
 o:["−4","−8","−6","−5"], a:0,
 e:"Among negative numbers, the maximum is the one closest to zero: −4. Reading 'biggest number' and picking −8 is the trap this question is set to catch. This is the game with V = −4, favourable to player B."},
{t:"m5t6", stage:"solve", q:"A game has maximin = 12 and minimax = 12. Therefore:",
 o:["a saddle point exists and the value of the game is 12","the game needs mixed strategies","the game is fair","the game is unbounded"], a:0,
 e:"Equal margins define a saddle point, and the common value is the value of the game. A <i>fair</i> game is one with V = 0, which is a different condition — this one is favourable to player A because 12 > 0."},
{t:"m5t6", stage:"concept", q:"Which is always true of any payoff matrix?",
 o:["maximin ≤ minimax","maximin ≥ minimax","maximin = minimax","maximin and minimax have the same sign"], a:0,
 e:"Let the maximin sit in row i and the minimax in column j, and consider the entry where they cross. It is ≥ the row minimum and ≤ the column maximum, so maximin ≤ a_ij ≤ minimax. Equality gives a saddle point; a strict gap means mixed strategies are needed. If your computation comes out the other way, one margin is wrong."},
{t:"m5t7", stage:"concept", q:"A game with V = 0 is described as:",
 o:["a fair game — no player gains and no player loses","favourable to player A","favourable to player B","having no solution"], a:0,
 e:"V = 0 exactly is the definition of a fair game. Positive V favours A and negative V favours B. Do not call a game fair because the matrix looks balanced — compute V and check it is zero."},
{t:"m5t7", stage:"recognise", q:"A game solves to V = −4. The correct interpretation sentence is:",
 o:["since the value of the game is negative, the game is favourable to player B",
    "the game is favourable to player A",
    "the result is an error, since a value cannot be negative",
    "the game is fair"], a:0,
 e:"A negative value means the row player A loses on average, so the game favours the column player B. Negative values are perfectly normal — your notes have worked examples with V = −4, V = −2 and V = −1."},
{t:"m5t8", stage:"solve", q:"For the game [[12, 4], [3, 7]], the denominator D = a + d − b − c equals:",
 o:["12","6","26","−12"], a:0,
 e:"D = 12 + 7 − 4 − 3 = 12. Every one of p, r and V divides by D, so computing it first and writing it down prevents the same arithmetic being repeated three times. Here p = 4/12 = 1/3, r = 3/12 = 1/4 and V = 72/12 = 6."},
{t:"m5t8", stage:"solve", q:"For [[10, 4], [6, 8]], the value of the game is:",
 o:["7","8","6","14"], a:0,
 e:"D = 10 + 8 − 4 − 6 = 8, and V = (ad − bc)/D = (80 − 24)/8 = 56/8 = 7. Check it lies between the maximin 6 and the minimax 8 ✓ — a value outside that band is always an arithmetic error."},
{t:"m5t8", stage:"solve", q:"For [[5, −4], [−9, 3]], the value of the game is:",
 o:["−1","1","21","−21"], a:0,
 e:"D = 5 + 3 − (−4) − (−9) = 8 + 4 + 9 = 21, and V = (15 − 36)/21 = −21/21 = −1. Both subtractions of negative numbers become additions — dropping one of them is the usual slip. The negative value means the game favours the column player."},
{t:"m5t8", stage:"select", q:"In the 2×2 formulas, the probability p that the ROW player plays row 1 is:",
 o:["(d − c) / D","(d − b) / D","(a − b) / D","(ad − bc) / D"], a:0,
 e:"p uses the column-wise difference d − c; r uses the row-wise difference d − b. Each player's probability is driven by the opponent's spread, which is why they are easy to swap. Option C gives 1 − p, and option D gives V."},
{t:"m5t8", stage:"concept", q:"In the expected gain approach, the probabilities are chosen so that:",
 o:["the expected value of the game does not depend on what the opponent does",
    "the player's own payoff is maximised in every single play",
    "both players get the same payoff",
    "the value of the game is zero"], a:0,
 e:"Your notes state the goal exactly: to play each strategy a particular percentage of the time so that the expected value of the game does not depend upon what the opponent does — which happens only when the expected value of each strategy is the same. That equality is what generates the equations."},
{t:"m5t9", stage:"concept", q:"Column-i is removed by dominance when:",
 o:["all its elements are ≥ the corresponding elements of some other column",
    "all its elements are ≤ the corresponding elements of some other column",
    "it contains the largest single entry in the matrix",
    "it contains a negative entry"], a:0,
 e:"The column player is minimising the payoffs to the row player, so a column that costs more in every position is never chosen. Rows go the other way — delete the row that is ≤ another everywhere. The one-line memory aid: delete the small row and the big column."},
{t:"m5t9", stage:"solve", q:"Row 3 = (2, 1, 4, 0) and Row 4 = (3, 3, 5, 2). Which is deleted?",
 o:["Row 3, since every element is ≤ the corresponding element of Row 4",
    "Row 4, since it has larger elements",
    "neither, since dominance needs strict inequality",
    "both, since they are similar"], a:0,
 e:"2≤3, 1≤3, 4≤5 and 0≤2 — all four positions satisfy the inequality, so Row 3 is dominated by Row 4 and the maximising row player would never use it. Dominance permits equality in a position; it requires only that the inequality holds everywhere."},
{t:"m5t9", stage:"concept", q:"After deleting a dominated row, you should:",
 o:["check the columns again, since a new dominance may now hold",
    "stop, since each row and column can be checked only once",
    "immediately apply the 2×2 formulas",
    "restore the original matrix"], a:0,
 e:"Your notes' Step 3 says to repeat Steps 1 and 2 whenever any row or column is dominated, and stop only when none is. Removing a row changes the column comparisons, so a column that was not dominated before may become so. Stopping after one pass leaves the matrix bigger than it needs to be."},
{t:"m5t10", stage:"recognise", q:"After dominance leaves a 3-strategy player with probabilities 3/4 and 1/4 on strategies 2 and 3, the answer is written:",
 o:["X = (0, 3/4, 1/4)","X = (3/4, 1/4)","X = (3/4, 1/4, 0)","X = (3/4, 1/4, 0, 0)"], a:0,
 e:"One entry per original strategy, zeros for the eliminated ones, in the original order, summing to 1. Strategy 1 was eliminated so it takes the zero. Option B does not say which strategies; option C puts the zero in the wrong place; option D has four entries for a three-strategy player."},
{t:"m5t10", stage:"solve", q:"Dominance reduces a game to [[3, 4], [6, 3]]. The value is:",
 o:["15/4","−15/4","4/15","9/4"], a:0,
 e:"D = 3 + 3 − 4 − 6 = −4, and V = (9 − 24)/(−4) = −15/−4 = 15/4. A negative D is normal — carry it through and the two minus signs cancel. Dropping the sign of D gives −15/4, which is option B and is wrong."},
{t:"m5t10", stage:"select", q:"You are given a 3×4 matrix and asked to 'solve by dominance'. Your first action is:",
 o:["compute the row minima and column maxima to test for a saddle point",
    "delete the row with the smallest entry",
    "compute D for the whole matrix",
    "write the probability vectors"], a:0,
 e:"Always test for a saddle point first, even when dominance is named. One of your notes' dominance exercises — rows (8,10,9,14), (10,11,8,12), (13,12,14,13) — has maximin = minimax = 12, so it is finished in four lines with no dominance at all."},
{t:"m5t10", stage:"concept", q:"After computing a mixed strategy, the fastest check that the vectors are not swapped is:",
 o:["substitute the probabilities back and confirm the expectation is equal against every opponent column",
    "check that both vectors sum to 1",
    "check that V is positive",
    "recompute D"], a:0,
 e:"Summing to 1 is necessary but a swapped pair also sums to 1, so it catches nothing. Substituting back does: an optimal mix makes the player's expectation identical against every opponent strategy, and a swapped vector will not. This ten-second check catches the swapped answer key in your own notes."}
];

var QUIZ2 = [
/* ---------- MODULE 2 · QUEUING (22) ---------- */
{t:"m2t1", stage:"concept", q:"Queuing theory is NOT considered an optimisation technique because:",
 o:["it has no maximisation or minimisation objective function","its answers are probabilistic rather than exact","it applies only to single-server systems","the arrival rate is never known exactly"], a:0,
 e:"Your notes state it directly: the application of queuing theory cannot be viewed as an optimization process because it does not have a maximization or minimization objective function. It computes performance measures; the manager supplies the objective. Being probabilistic (option B) is true but is not the stated reason."},
{t:"m2t1", stage:"concept", q:"A queue forms when:",
 o:["demand for a service facility exceeds the capacity of that facility","the service rate exceeds the arrival rate","the utilisation rate falls below 0.5","customers arrive in a Poisson pattern"], a:0,
 e:"This is the definition in the notes. Option B is the opposite — when μ > λ the system copes. Poisson arrivals (D) describe randomness, not congestion; a queue can form under Poisson arrivals only because demand momentarily exceeds capacity."},
{t:"m2t3", stage:"solve", q:"A customer arrives every 12 minutes and service takes 8 minutes. λ and μ per hour are:",
 o:["λ = 5, μ = 7.5","λ = 12, μ = 8","λ = 7.5, μ = 5","λ = 0.083, μ = 0.125"], a:0,
 e:"Rate = 60 ÷ minutes. λ = 60/12 = 5 per hour and μ = 60/8 = 7.5 per hour. Option C inverts them, which would give ρ = 1.5 and a system that never stabilises. Option D is per-minute rates, which are correct in principle but not what 'per hour' asked for."},
{t:"m2t3", stage:"solve", q:"λ = 5 and μ = 7.5 per hour. The utilisation and idle rates are:",
 o:["ρ = 0.667, idle = 0.333","ρ = 1.5, idle = −0.5","ρ = 0.333, idle = 0.667","ρ = 0.75, idle = 0.25"], a:0,
 e:"ρ = λ/μ = 5/7.5 = 2/3 ≈ 0.667, and idle = 1 − ρ = 0.333. Option B is μ/λ — a utilisation above 1 always means you inverted the ratio, since a negative idle rate is impossible."},
{t:"m2t3", stage:"concept", q:"You compute ρ for the same system per hour, per 15 minutes and per 8 hours. You should get:",
 o:["the same value all three times","three values in the ratio 1 : 0.25 : 8","three values that sum to 1","ρ increasing with the length of the period"], a:0,
 e:"λ and μ both scale by the same factor when you change the period, so their ratio is unchanged. In the deck's Example 1, ρ = 6/10 = 1.5/2.5 = 48/80 = 0.6. This makes ρ a free consistency check on your conversions — if the three values differ, one conversion is wrong."},
{t:"m2t3", stage:"solve", q:"P(0) = 0.4 for a server working an 8-hour day. The average idle time is:",
 o:["3.2 hours","0.4 hours","4.8 hours","0.05 hours"], a:0,
 e:"Average idle time = P(0) × t = 0.4 × 8 = 3.2 hours, exactly as the deck computes it. Option C is the busy time (0.6 × 8 = 4.8). P(0) alone (option B) is a probability, not a duration — it must be multiplied by the period."},
{t:"m2t4", stage:"select", q:"'Average number of customers waiting in the queue' is:",
 o:["Lq = λ²/(μ(μ−λ))","Ls = λ/(μ−λ)","Wq = λ/(μ(μ−λ))","Lq′ = μ/(μ−λ)"], a:0,
 e:"L = a number of customers, W = a time; q = queue only, s = system (queue + in service). 'Number' + 'in the queue' gives Lq. Option B is the number in the system, option C is the waiting time in the queue, and option D is the expected length of a non-empty queue."},
{t:"m2t4", stage:"solve", q:"λ = 48, μ = 80 (per 8-hour day). Ls equals:",
 o:["1.5","0.9","2.5","0.0312"], a:0,
 e:"Ls = λ/(μ−λ) = 48/(80−48) = 48/32 = 1.5 customers. 0.9 is Lq, 2.5 is Lq′, and 0.0312 is Ws. Check with Ls = Lq + ρ: 0.9 + 0.6 = 1.5 ✓."},
{t:"m2t4", stage:"solve", q:"λ = 48, μ = 80. Lq equals:",
 o:["0.9","1.5","1.44","0.6"], a:0,
 e:"Lq = λ²/(μ(μ−λ)) = 2304/(80×32) = 2304/2560 = 0.9. A common slip is forgetting to square λ, which gives 48/2560 = 0.0187 — that is Wq, not Lq. Cross-check: Lq = Ls − ρ = 1.5 − 0.6 = 0.9 ✓."},
{t:"m2t4", stage:"concept", q:"Which relation is always true for a single-server queue?",
 o:["Ls = Lq + ρ","Ls = Lq + 1","Lq = Ls + ρ","Ls = Lq × ρ"], a:0,
 e:"The system holds everyone waiting plus whoever is in service, and the server is busy a fraction ρ of the time, so on average ρ customers are in service. Option B would be true only if the server were always busy (ρ = 1). Option C has the inequality backwards — Lq is always the smaller."},
{t:"m2t4", stage:"concept", q:"Little's law, as your notes express it, states:",
 o:["Wq = Lq/λ and Ws = Ls/λ","Wq = Lq/μ and Ws = Ls/μ","Lq = Ls × ρ","Ws = Wq × μ"], a:0,
 e:"The notes give it as 'Wq = average number of customers in the queue ÷ average arrival rate'. Dividing a count by the arrival rate gives a time. Option B divides by the service rate, which is wrong. It is the fastest cross-check available: compute Ls and Ws independently, then verify Ls = λWs."},
{t:"m2t4", stage:"solve", q:"λ = 10/hr and service takes 4 minutes. Lq equals:",
 o:["4/3","3/4","2/3","10/15"], a:0,
 e:"μ = 60/4 = 15 per hour, so μ−λ = 5 and Lq = 100/(15×5) = 100/75 = 4/3 ≈ 1.33. Cross-check: ρ = 2/3, Ls = 10/5 = 2, and Lq = Ls − ρ = 2 − 2/3 = 4/3 ✓. Note the Queuing deck prints this answer as 3/4, which is the reciprocal — recompute and use 4/3."},
{t:"m2t4", stage:"solve", q:"λ = 12, μ = 20 per hour. The average time a customer spends in the SYSTEM is:",
 o:["7.5 minutes","4.5 minutes","3 minutes","12.5 minutes"], a:0,
 e:"Ws = 1/(μ−λ) = 1/8 hour = 7.5 minutes. Option B (4.5 min) is Wq, the waiting time only; the difference between them is exactly the service time 1/μ = 3 minutes (option C). Ws = Wq + 1/μ → 4.5 + 3 = 7.5 ✓."},
{t:"m2t4", stage:"recognise", q:"Your computed Lq is larger than your Ls. This means:",
 o:["you have swapped the two formulas","the system is overloaded","the arrival rate exceeds the service rate","nothing — it is possible when ρ > 0.5"], a:0,
 e:"The queue is a subset of the system, so Lq < Ls always, for every ρ. Specifically Ls − Lq = ρ > 0. Getting Lq > Ls is always a formula swap, never a property of the system, so it is a reliable self-check."},
{t:"m2t5", stage:"solve", q:"ρ = 0.6. The probability of exactly 5 customers in the system is:",
 o:["0.0311","0.0778","0.216","0.4"], a:0,
 e:"P(n) = ρⁿ(1−ρ) = 0.6⁵ × 0.4 = 0.07776 × 0.4 = 0.0311. Option B is 0.6⁵ alone — forgetting the (1−ρ) factor is the standard error. Option D is P(0)."},
{t:"m2t5", stage:"solve", q:"ρ = 0.6. The probability of MORE THAN 2 customers in the system is:",
 o:["0.216","0.144","0.784","0.0864"], a:0,
 e:"P(more than n) = ρⁿ⁺¹ = 0.6³ = 0.216. Verify the long way: P(0)+P(1)+P(2) = 0.4 + 0.24 + 0.144 = 0.784, so the tail is 1 − 0.784 = 0.216 ✓. Option B is P(2) alone and option D is P(3)."},
{t:"m2t5", stage:"recognise", q:"'The probability that an arrival finds 2 persons waiting for their turn' means:",
 o:["P(3) — two in the queue plus one in service","P(2) — exactly two in the system","P(more than 2)","P(0) × 2"], a:0,
 e:"Two people <i>waiting</i> means two in the queue, and there must also be someone being served, so the system holds three. This one-word distinction between 'waiting' and 'in the system' is exactly what Example 3 of the deck is testing when it asks both versions in consecutive parts."},
{t:"m2t5", stage:"solve", q:"μ = 15/hr, λ = 10/hr. A second counter opens when Wq reaches 10 minutes. The required λ is:",
 o:["10.71 per hour","12.5 per hour","10 per hour","14.3 per hour"], a:0,
 e:"Convert the target: 10 min = 1/6 hour. Set λ/(15(15−λ)) = 1/6 → 6λ = 225 − 15λ → 21λ = 225 → λ = 10.714. The question in the deck then asks by how much arrivals must increase, which is 10.71 − 10 ≈ 0.7 per hour — answer the increase, not the level."},
{t:"m2t5", stage:"select", q:"A design question sets a target on Lq rather than Wq. The equation you must solve is:",
 o:["quadratic in λ, because Lq contains λ²","linear in λ, exactly as for Wq","independent of λ","solvable only by trial and error"], a:0,
 e:"Lq = λ²/(μ(μ−λ)) has λ² in the numerator, so setting it equal to a target gives λ² + (target·μ)λ − (target·μ²) = 0, a quadratic. Wq = λ/(μ(μ−λ)) is linear in λ. Read which measure the target is on before setting up — it changes the algebra."},
{t:"m2t2", stage:"recognise", q:"A customer sees a long queue and leaves WITHOUT joining. This is:",
 o:["balking","reneging","jockeying","collusion"], a:0,
 e:"Balking is refusing to join at all — the customer is discouraged by the number already waiting or by the estimated wait, and decides to return later. Reneging is joining and then abandoning. The test is simply whether they ever entered the queue."},
{t:"m2t2", stage:"recognise", q:"A customer waits six minutes, becomes impatient and leaves the queue. This is:",
 o:["reneging","balking","jockeying","priority service"], a:0,
 e:"Reneging: impatient customers who will not wait beyond a certain time and leave the queue. They joined first, which is what separates it from balking. If they had moved to a different queue instead of leaving, that would be jockeying."},
{t:"m2t2", stage:"concept", q:"Which is a DYNAMIC queue discipline?",
 o:["Service In Random Order (SIRO)","First In First Out","Last In First Out","Arrival order"], a:0,
 e:"Static disciplines are based on the customer's position in the arrival order — FIFO and LIFO. Dynamic disciplines select on something else: SIRO picks at random irrespective of arrival time, priority service groups by urgency or service time, and pre-emptive priority interrupts for emergencies."},
{t:"m2t2", stage:"concept", q:"In a queuing system, the number of arrivals in an interval follows a Poisson distribution. The time BETWEEN two consecutive arrivals follows:",
 o:["an exponential distribution","a Poisson distribution","a normal distribution","an Erlang distribution"], a:0,
 e:"These are two views of the same random process: Poisson counts arrivals in a fixed interval, exponential measures the gap between them. Erlang is the general service-time distribution; completely random service time is the exponential special case."},

/* ---------- MODULE 5 · added, incl. oddments (8) ---------- */
{t:"m5t11", stage:"concept", q:"In the oddments method for [[a,b],[c,d]], the oddment written against ROW 1 is:",
 o:["|c − d|, the difference across row 2","|a − b|, the difference across row 1","|a − c|, the difference down column 1","a + d − b − c"], a:0,
 e:"The oddments cross over: the difference computed from one row is written against the OTHER row. Your notes say it explicitly — the first row's oddment value is written next to the second row. Failing to swap inverts both probabilities, and since they still sum to 1 the error is invisible without a cross-check."},
{t:"m5t11", stage:"solve", q:"By oddments, [[4,2],[0,10]] gives player X's probabilities as:",
 o:["(5/6, 1/6)","(1/6, 5/6)","(2/3, 1/3)","(1/2, 1/2)"], a:0,
 e:"Row oddment against X₁ = |0−10| = 10; against X₂ = |4−2| = 2. So P₁ = 10/12 = 5/6 and P₂ = 2/12 = 1/6. Option B is the un-swapped (wrong) version, and option C is player Y's pair (2/3, 1/3) from the column oddments 8 and 4."},
{t:"m5t11", stage:"solve", q:"For [[4,2],[0,10]] the column oddments are 8 and 4. The value of the game is:",
 o:["10/3","40/8","12/40","5/6"], a:0,
 e:"V = (row entries × column oddments) ÷ sum of column oddments. Taking row 2: (0×8 + 10×4)/12 = 40/12 = 10/3 ≈ 3.33. Check with row 1: (4×8 + 2×4)/12 = 40/12 ✓. Both rows must agree — if they do not, an oddment is on the wrong side."},
{t:"m5t11", stage:"concept", q:"After computing a game by oddments you should verify by:",
 o:["computing V from both rows and checking they agree","confirming the probabilities sum to 1","checking that all oddments are positive","confirming there is no saddle point"], a:0,
 e:"Summing to 1 is automatic even when the oddments are swapped, so it catches nothing. Computing V from both rows is a genuine independent check, and it is free. Checking for a saddle point (option D) matters, but it belongs before you start, not after."},
{t:"m5t8", stage:"solve", q:"For [[3,5],[4,2]] the value of the game is:",
 o:["7/2","3","4","14"], a:0,
 e:"No saddle point: maximin = 3, minimax = 4. D = 3+2−5−4 = −4, and V = (3×2 − 5×4)/(−4) = (6−20)/(−4) = 14/4 = 7/2 = 3.5. It lies between the maximin 3 and the minimax 4 ✓, which is the check that always applies."},
{t:"m5t6", stage:"solve", q:"A game has row minima {−3, −1, 2, 12} and column maxima {15, 14, 18, 12, 20}. The value is:",
 o:["12, and a saddle point exists","−3, the smallest row minimum","20, the largest column maximum","there is no saddle point"], a:0,
 e:"Maximin = max{−3,−1,2,12} = 12; minimax = min{15,14,18,12,20} = 12. They are equal, so a saddle point exists at the cell where they meet and V = 12. This is Problem 1 in Game Theory_1.pptx and it is worked in your notes at B02."},
{t:"m5t9", stage:"solve", q:"Column I = (3, 5, 3) and Column IV = (2, 4, 2). Which is deleted by dominance?",
 o:["Column I, since every element is ≥ the corresponding element of Column IV","Column IV, since its elements are smaller","neither — dominance needs strict inequality","both, since they are proportional"], a:0,
 e:"3≥2, 5≥4, 3≥2 — all three hold, so Column I is dominated by Column IV and the minimising column player discards it. The column player wants small payoffs, so the LARGER column goes. Dominance permits equality in a position; it only requires the inequality to hold everywhere."},
{t:"m5t10", stage:"select", q:"A 3×4 game with no saddle point has been reduced by dominance to rows 2,3 and columns I,II. Player A's answer should be written:",
 o:["a 3-entry vector with 0 in position 1","a 2-entry vector","a 4-entry vector","just the two probabilities, unlabelled"], a:0,
 e:"Player A had three strategies, so the vector needs three entries — one per ORIGINAL strategy — with 0 wherever a strategy was eliminated. A four-entry vector would match B's strategy count, not A's. This mapping-back step is where marks are most often dropped in dominance questions."},

{t:"m1t15", stage:"solve", q:"Min Z = 4x₁+x₂ s.t. 3x₁+x₂=3, 4x₁+3x₂≥6, x₁+2x₂≤4. The optimum is:",

{t:"m1t14", stage:"concept", q:"A MAXIMISATION simplex table shows Cⱼ−Zⱼ = (0, 0, −2, 0, −5). The table is:",

{t:"m1t8", stage:"select", q:"The constraint 3x₁ + x₂ = 3 in a Big M minimisation becomes:",

{t:"m1t10", stage:"solve", q:"A transportation problem has 4 sources and 5 destinations, and a solution with 7 allocated cells. It is:",

 e:"m+n−1 = 4+5−1 = 8 allocations are needed for a non-degenerate basic feasible solution. Only 7 are present, so the solution is degenerate and an ε must be placed in an independent empty cell before MODI can run. This is exactly what Q3(b) of your past IA paper asked."},
{t:"m1t10", stage:"select", q:"In VAM, the penalty for a row is:",
 o:["the difference between the two smallest costs in that row","the largest cost in that row","the difference between the largest and smallest costs","the row's supply divided by its smallest cost"], a:0,
 e:"VAM computes, for each row and column, the difference between its two smallest costs — the 'regret' incurred by not using the cheapest cell. Allocation is then made in the row or column with the LARGEST penalty, at its minimum-cost cell. Your notes record it as 'select any 2 minimum values & subtract them'."},
{t:"m1t7", stage:"concept", q:"The clearest distinction between a feasible and an optimal solution is:",

{t:"m1t20", stage:"select", q:"The Hungarian method requires:",
 o:["a square matrix with only non-negative elements","a square matrix that may contain negatives","any rectangular cost matrix","supplies and demands that balance"], a:0,
 e:"Your notes state both conditions: only non-negative elements, and a square n×n matrix. A non-square problem needs a dummy row or column first, and a maximisation must be converted to a minimisation before the algorithm is applied. Option D describes the transportation problem, not assignment."},
{t:"m1t17", stage:"solve", q:"The primal Max Z = 4x₁+5x₂ has 3 constraints. Its dual has:",
 o:["3 variables and 2 constraints, and is a minimisation","2 variables and 3 constraints, and is a minimisation","3 variables and 2 constraints, and is a maximisation","2 variables and 2 constraints"], a:0,
 e:"n variables and m constraints become m variables and n constraints, so 2 and 3 become 3 and 2. The sense always flips, so a maximisation primal has a minimisation dual. Your notes work exactly this example at B19."},
{t:"m1t11", stage:"solve", q:"Corner points (0,0), (30,0), (20,30), (0,50) with Z = 4x + y. The maximum is:",
 o:["120 at (30, 0)","110 at (20, 30)","50 at (0, 50)","180 at (20, 30)"], a:0,

{t:"m2t6", stage:"concept", q:"In Kendall's notation, M stands for:",

{t:"m2t6", stage:"recognise", q:"(M/D/3):(20/SIRO) describes a system with:",

{t:"m2t6", stage:"concept", q:"A queuing system is in STEADY state when:",

/* ---- the notes' probability set ---- */
{t:"m2t5", stage:"concept", q:"For (M/M/1), the probability that the server is BUSY is:",
 o:["λ/μ","1 − λ/μ","λ/(μ−λ)","(λ/μ)²"], a:0,

{t:"m2t5", stage:"solve", q:"λ = 10, μ = 15. P(at least 3 customers in the system) equals:",

 e:"Your notes give P(n ≥ k) = (λ/μ)^k. With ρ = 10/15 = 2/3, P(n ≥ 3) = (2/3)³ = 8/27 ≈ 0.296. Option B is P(n > 3) = ρ⁴ = 0.198 — note that 'at least' and 'more than' differ by one power of ρ."},
{t:"m2t5", stage:"select", q:"'At least k customers' and 'more than k customers' differ by:",

 e:"P(n ≥ k) = ρᵏ and P(n > k) = ρᵏ⁺¹, so the second is ρ times the first. 'At least k' includes exactly k; 'more than k' excludes it, and the excluded term is what removes one power. Reading the wording carefully is worth a mark here."},
{t:"m2t5", stage:"solve", q:"ρ = 0.5. P(the queue is non-empty), i.e. P(n > 1), is:",

{t:"m2t4", stage:"concept", q:"Your notes derive Lq from Ls as:",

{t:"m2t4", stage:"concept", q:"Your notes derive Wq from Ws as:",

 e:"Time in the system = time waiting + time being served, and the mean service time is 1/μ. So the waiting time is Ws minus the service time. With λ = 10, μ = 15: Ws = 1/5 and Wq = 1/5 − 1/15 = 2/15 hour = 8 minutes, exactly as the notes compute."},
{t:"m2t4", stage:"solve", q:"λ = 10/hr and service takes 4 minutes. Using Lq = Ls − λ/μ, Lq equals:",

{t:"m2t4", stage:"solve", q:"λ = 10, μ = 15. The average length of a NON-EMPTY queue, Ln, is:",
 o:["3","1.33","2","0.67"], a:0,

{t:"m5t9", stage:"concept", q:"Modified (average) dominance lets you delete a row when it is dominated by:",
 o:["the average of two or more other rows","the single largest row","any row with a bigger first element","the column averages"], a:0,

{t:"m1t21", stage:"concept", q:"In the question bank, 'Analyze if the following game is strictly determinable' is asking you to:",

 e:"'Strictly determinable' means the game has a saddle point, so both players have pure optimal strategies. The past paper's model answer reads: 'The game is not strictly determinable. Since there is no saddle point, the value of the game cannot be found by pure strategies alone; mixed strategies are required.' The rubric is +1 for the check, +1 for the value."},
{t:"m1t21", stage:"select", q:"A question worth 2 marks says 'support your answer with a suitable example'. You should:",
 o:["give two labelled points plus one short example line","write a full page to be safe","give the example only","give four points to maximise the chance of two being right"], a:0,
 e:"Two marks means two scoring points; the example supports them rather than replacing them. The IA paper's rubric notes the example is 'helpful for illustration but not mandatory for full marks if the definitions are perfectly clear' — so the definitions carry the marks and the example insures them. Writing a page costs time you need for Q2 and Q3."},

/* ---- Transportation (low) ---- */
{t:"m1t22", stage:"concept", q:"Which method generally gives the BEST initial basic feasible solution?",
 o:["Vogel's Approximation Method","North West Corner Method","Least Cost Method","They are always identical"], a:0,
 e:"Your notes rank them explicitly: VAM generally produces the best initial solution and NWCM the worst, but NWCM involves the least computation. A better start means fewer MODI iterations afterwards."},
{t:"m1t22", stage:"solve", q:"In VAM, a row's penalty is:",
 o:["second smallest cost − smallest cost","largest cost − smallest cost","the smallest cost in the row","the row's supply ÷ its smallest cost"], a:0,
 e:"The penalty is the difference between the two smallest unit costs in that row or column. It measures the regret of being unable to use the cheapest route. Allocation goes to the row or column with the LARGEST penalty, at its minimum-cost cell."},
{t:"m1t22", stage:"solve", q:"A 4×5 transportation solution has 7 allocations. It is:",
 o:["degenerate, since m + n − 1 = 8","non-degenerate","unbalanced","optimal"], a:0,
 e:"m + n − 1 = 4 + 5 − 1 = 8 allocations are needed for a non-degenerate basic feasible solution. With only 7 it is degenerate, and an ε must be placed in an independent empty cell before MODI can run."},
{t:"m1t22", stage:"recognise", q:"Total supply is 300 and total demand is 250. Before applying any method you must:",
 o:["add a dummy destination with demand 50 and zero costs","scale the demands up to 300","discard 50 units of supply","proceed unchanged"], a:0,
 e:"The problem is unbalanced, and every solution method assumes supply equals demand. A dummy column with demand 50 and zero costs absorbs the surplus; those allocations represent goods that are simply not shipped. If demand exceeded supply you would add a dummy row instead."},

/* ---- MODI / stepping stone (low) ---- */
{t:"m1t23", stage:"concept", q:"In MODI, the dual variables u_i and v_j are found from:",
 o:["u_i + v_j = c_ij at every OCCUPIED cell","u_i + v_j = c_ij at every unoccupied cell","u_i − v_j = c_ij everywhere","the row and column penalties"], a:0,
 e:"Occupied cells give the equations; unoccupied cells then get d_ij = c_ij − (u_i + v_j) for the optimality test. There are m + n unknowns but only m + n − 1 equations, so one dual is fixed arbitrarily — conventionally u₁ = 0."},
{t:"m1t23", stage:"concept", q:"A transportation solution is optimal when:",
 o:["all d_ij ≥ 0 for the unoccupied cells","all d_ij ≤ 0","all allocations are equal","the number of allocations is m + n"], a:0,
 e:"A negative d_ij means routing a unit through that cell would reduce total cost, so the solution is not optimal. Your notes attribute the stopping rule to the theorem of complementary slackness. A d_ij of exactly zero signals an alternate optimal solution."},
{t:"m1t23", stage:"select", q:"In the stepping stone method, right-angle turns in a closed path are allowed only at:",
 o:["occupied cells and the original unoccupied cell","any cell","unoccupied cells only","the corners of the matrix"], a:0,
 e:"Your notes state it directly. The loop starts at the unoccupied cell being tested, and every other turn must be at an occupied cell — otherwise the reallocation would not preserve the supply and demand totals."},

/* ---- Hungarian (low) ---- */
{t:"m1t24", stage:"concept", q:"The Hungarian method stops when the number of lines needed to cover all zeros equals:",
 o:["n, the order of the matrix","the number of zeros","m + n − 1","half the matrix size"], a:0,
 e:"If n lines are required for an n×n matrix, an optimal assignment exists among the zeros. If fewer than n lines suffice, you go to step 4: subtract the smallest uncovered element from all uncovered elements and add it to all elements covered twice."},
{t:"m1t24", stage:"select", q:"In step 4 of the Hungarian method, the smallest uncovered element k is:",
 o:["subtracted from uncovered elements and ADDED to doubly-covered ones",
    "subtracted from every element",
    "added to every element",
    "subtracted only from the covered elements"], a:0,
 e:"Both halves matter. Subtracting from uncovered cells creates new zeros; adding k back to cells covered by two lines keeps the matrix consistent so the optimal assignment is preserved. Forgetting the addition is the standard error and breaks the method."},
{t:"m1t24", stage:"recognise", q:"You are given a 4×5 cost matrix for an assignment problem. First move:",
 o:["add a dummy row to make it square","apply row reduction immediately","transpose it","balance supply and demand"], a:0,
 e:"The Hungarian method requires a square matrix of order n×n with non-negative elements. A 4×5 matrix needs a dummy fifth row of zero costs; the job assigned to the dummy is simply left undone. Supply and demand (option D) belong to transportation, not assignment."},
{t:"m1t24", stage:"concept", q:"To solve a MAXIMISATION assignment problem by the Hungarian method you must first:",
 o:["convert it to a minimisation, e.g. subtract every element from the largest",
    "apply the method unchanged","negate the objective only","use VAM instead"], a:0,
 e:"Your notes state that the Hungarian method is only for minimisation problems, so a maximisation must be converted first. After solving, read the final value from the ORIGINAL profit matrix, not the converted one."},

/* ---- Sequencing (low) ---- */
{t:"m1t25", stage:"select", q:"In Johnson's rule, the smallest processing time lies on machine B. That job is scheduled:",
 o:["as late as possible","as early as possible","in the middle","first, then reversed"], a:0,
 e:"Machine A minimum → earliest free slot; machine B minimum → latest free slot. Scheduling a short B-time job last minimises the time machine B sits waiting at the end of the run. Getting this direction backwards produces a valid but non-optimal sequence."},
{t:"m1t25", stage:"concept", q:"n jobs on three machines can be reduced to a two-machine problem if:",
 o:["min time on A ≥ max time on B, OR min time on C ≥ max time on B",
    "both conditions must hold simultaneously",
    "machine B is the fastest",
    "all processing times are equal"], a:0,
 e:"At least ONE of the two conditions suffices. In words, machine B must never be the bottleneck. If neither holds, the G/H reduction is not valid and Johnson's rule cannot simply be applied."},
{t:"m1t25", stage:"solve", q:"In the three-machine reduction, the fictitious machines are defined as:",
 o:["G = A + B and H = B + C","G = A + C and H = B","G = A and H = B + C","G = A + B + C and H = B"], a:0,
 e:"G_i = A_i + B_i and H_i = B_i + C_i, so machine B appears in BOTH fictitious machines. Johnson's rule is then applied to G and H, but the elapsed-time table is built on the original A, B and C times."},

/* ---- TSP (low) ---- */
{t:"m1t26", stage:"concept", q:"In a TSP distance matrix, the diagonal is set to ∞ because:",
 o:["a salesman cannot travel from a city to itself","the distances are unknown","it forces a single circuit","∞ is the largest penalty"], a:0,
 e:"The diagonal entry c_ii would represent staying put, which is not a legal move. Setting it to ∞ guarantees the assignment algorithm never selects it. Note it does NOT by itself force a single circuit — that is checked separately in Phase II."},
{t:"m1t26", stage:"recognise", q:"An assignment solution gives 1→2, 2→1, 3→4, 4→3. For a TSP this is:",
 o:["invalid — two disjoint sub-tours, so Phase II is needed","the optimal tour","infeasible as an assignment","a single valid circuit"], a:0,
 e:"It is a perfectly valid assignment — each city appears once as origin and once as destination — but it forms two separate 2-city loops rather than one circuit through all four. The TSP condition requires visiting every city once and returning to the start, so the solution must be adjusted by inspection."},
{t:"m1t26", stage:"solve", q:"With 5 cities, the number of possible tours is:",
 o:["4! = 24","5! = 120","5² = 25","2⁵ = 32"], a:0,
 e:"With n cities there are (n − 1)! tours, because the starting city can be fixed (a tour is a closed loop) and the remaining n − 1 are permuted. For n = 5 that is 4! = 24, exactly as your notes state."},

/* ---- IPP (low) ---- */
{t:"m1t27", stage:"concept", q:"A 0–1 integer programming problem is used when:",
 o:["decision variables are of the yes/no type","all variables must be positive","the objective is a ratio","there is exactly one constraint"], a:0,
 e:"Your notes define it as requiring integer variables to take the value 0 or 1, for situations where the decision variables are of the yes-or-no type — opening a facility, selecting a project, assigning a contract. The other two types are pure integer (all variables integer) and mixed integer (some but not all)."},
{t:"m1t27", stage:"select", q:"After adding a Gomory cut, the table is re-optimised using:",
 o:["the dual simplex method","ordinary simplex","the Hungarian method","VAM"], a:0,
 e:"Your notes say so explicitly: add the fractional cut as the last row of the latest optimal table and proceed using the DUAL simplex method. The cut makes the current solution infeasible while it remains optimal in the dual sense, which is exactly the situation dual simplex handles — pick the row with the least negative solution value and compute θ."},
{t:"m1t27", stage:"select", q:"Branch and bound on a fractional x = 3.33 creates the sub-problems:",
 o:["x ≤ 3 and x ≥ 4","x ≤ 3 and x ≥ 3","x = 3 and x = 4","x ≤ 3.33 and x ≥ 3.33"], a:0,
 e:"The two branches must together contain every integer point but exclude the fractional strip between 3 and 4. x ≤ 3 and x ≥ 3 (option B) overlap at 3 and leave the fractional region in play; option D excludes no integer point at all and makes no progress."},
{t:"m1t27", stage:"concept", q:"Why is rounding the LP relaxation not a valid way to solve an IPP?",
 o:["the rounded point may be infeasible, or feasible but suboptimal","rounding is always infeasible","rounding always gives the optimum","LP relaxations have no solution"], a:0,
 e:"Both failures are real. Rounding up can violate a constraint the fractional solution satisfied; rounding down can land inside the region but at a worse objective than some other integer point. With many variables there are too many rounding candidates to check, which is precisely why cutting plane and branch and bound exist."}
];

/* ===== 15 · progress model ===== */
var KEY = "or_mse_study_v1";
var THEME_KEY = "or_mse_theme_v1";
var storageOK = true;

function blankProgress(){
  return { examples:{}, practice:{}, quizTopic:{}, quizStage:{}, quizSets:{},
           lastStudied:null, streak:0, lastVisit:null, firstVisit:null };
}
var P = blankProgress();

function loadProgress(){
  try {
    var raw = window.localStorage.getItem(KEY);
    if (!raw) return blankProgress();
    var v = validateProgress(JSON.parse(raw));
    return v.ok ? v.data : blankProgress();
  } catch(e){ storageOK = false; return blankProgress(); }
}
function saveProgress(){
  try { window.localStorage.setItem(KEY, JSON.stringify(P)); return true; }
  catch(e){ storageOK = false; return false; }
}
function loadTheme(){
  try { return window.localStorage.getItem(THEME_KEY) || "system"; }
  catch(e){ storageOK = false; return "system"; }
}
function saveTheme(t){
  try { window.localStorage.setItem(THEME_KEY, t); } catch(e){ storageOK = false; }
}

/* --- import validation --- */
function isObj(o){ return o !== null && typeof o === "object" && !Array.isArray(o); }

function validateProgress(o){
  if (!isObj(o)) return {ok:false};
  var hasMarker = o._app === "or_mse_study";
  var hasShape = ["examples","practice","quizTopic","quizStage","quizSets"].some(function(k){ return isObj(o[k]); });
  if (!hasMarker && !hasShape) return {ok:false};

  var d = blankProgress();
  var exIds = {}, prIds = {}, tIds = {};
  TOPICS.forEach(function(t){
    tIds[t.id] = 1;
    (t.examples||[]).forEach(function(e){ exIds[e.id] = 1; });
    (t.practice||[]).forEach(function(p){ prIds[p.id] = 1; });
  });

  if (isObj(o.examples)) Object.keys(o.examples).forEach(function(k){
    if (exIds[k] && o.examples[k] === true) d.examples[k] = true;
  });
  if (isObj(o.practice)) Object.keys(o.practice).forEach(function(k){
    if (prIds[k] && o.practice[k] === true) d.practice[k] = true;
  });
  if (isObj(o.quizTopic)) Object.keys(o.quizTopic).forEach(function(k){
    var s = o.quizTopic[k];
    if (!tIds[k] || !isObj(s)) return;
    var n = s.n, c = s.c;
    if (typeof n !== "number" || typeof c !== "number") return;
    if (!isFinite(n) || !isFinite(c)) return;
    if (n <= 0 || c < 0 || c > n) return;
    d.quizTopic[k] = {n: Math.floor(n), c: Math.floor(c)};
  });
  if (isObj(o.quizStage)) Object.keys(o.quizStage).forEach(function(k){
    var s = o.quizStage[k];
    if (STAGES.indexOf(k) < 0 || !isObj(s)) return;
    var n = s.n, c = s.c;
    if (typeof n !== "number" || typeof c !== "number") return;
    if (!isFinite(n) || !isFinite(c)) return;
    if (n <= 0 || c < 0 || c > n) return;
    d.quizStage[k] = {n: Math.floor(n), c: Math.floor(c)};
  });
  if (isObj(o.quizSets)) Object.keys(o.quizSets).forEach(function(k){
    var v = o.quizSets[k];
    if (!/^set\d{1,3}$/.test(k) || !isObj(v)) return;
    var n = v.n, c = v.c;
    if (typeof n !== "number" || typeof c !== "number") return;
    if (!isFinite(n) || !isFinite(c) || n <= 0 || c < 0 || c > n) return;
    var e = {n: Math.floor(n), c: Math.floor(c)};
    if (typeof v.at === "string" && v.at.length && v.at.length < 40) e.at = v.at;
    d.quizSets[k] = e;
  });
  ["lastStudied","lastVisit","firstVisit"].forEach(function(k){
    if (typeof o[k] === "string" && o[k].length && o[k].length < 40) d[k] = o[k];
  });
  if (typeof o.streak === "number" && isFinite(o.streak))
    d.streak = Math.max(0, Math.min(3650, Math.floor(o.streak)));
  return {ok:true, data:d};
}

var STAGES = ["recognise","select","solve","concept"];

function today(){ return new Date().toISOString().slice(0,10); }
function touchVisit(){
  var t = today();
  if (!P.firstVisit) P.firstVisit = t;
  if (P.lastVisit !== t){
    var y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    P.streak = (P.lastVisit === y) ? (P.streak || 0) + 1 : 1;
    P.lastVisit = t;
    saveProgress();
  }
}
/* ===== 16 · derived progress — nothing here is stored ===== */
function qIdsOf(t){
  var ids = [];
  (t.examples||[]).forEach(function(e){ ids.push(["e", e.id]); });
  (t.practice||[]).forEach(function(p){ ids.push(["p", p.id]); });
  return ids;
}
function isDone(kind, id){
  return (kind === "e" ? P.examples : P.practice)[id] === true;
}
function topicProgress(t){
  var ids = qIdsOf(t), done = 0;
  ids.forEach(function(x){ if (isDone(x[0], x[1])) done++; });
  return { done:done, total:ids.length, pct: ids.length ? Math.round(done*100/ids.length) : 0 };
}
function topicStatus(id){
  var t = TBYID[id]; if (!t) return "none";
  var p = topicProgress(t);
  if (!p.total) return "none";
  if (p.done === 0) return "none";
  return p.done === p.total ? "done" : "progress";
}
function progressOf(list){
  var done = 0, total = 0;
  list.forEach(function(t){ var p = topicProgress(t); done += p.done; total += p.total; });
  return { done:done, total:total, pct: total ? Math.round(done*100/total) : 0 };
}
/* Readiness is measured over EXAM-PRIORITY topics only — the high-priority set.
   Low-priority topics (the Module 1 numerical track) keep full pages and can still be
   marked done; they simply do not dilute the readiness figures. */
function examTopics(){
  return TOPICS.filter(function(t){ return t.priority === "high"; });
}
function excludedCount(m){
  return TOPICS.filter(function(t){ return t.priority === "low" && (!m || t.m === m); }).length;
}
function overallProgress(){ return progressOf(examTopics()); }
function allProgress(){ return progressOf(TOPICS); }
function moduleProgress(m){
  return progressOf(topicsOf(m).filter(function(t){ return t.priority === "high"; }));
}
function moduleProgressAll(m){ return progressOf(topicsOf(m)); }
function trackProgress(track){
  return progressOf(examTopics().filter(function(t){ return t.type === track; }));
}
function moduleTrackProgress(m, track){
  return progressOf(TOPICS.filter(function(t){ return t.m === m && t.type === track; }));
}
function topicsFinished(m){
  var ts = topicsOf(m).filter(function(t){ return t.priority === "high"; }), n = 0;
  ts.forEach(function(t){ if (topicStatus(t.id) === "done") n++; });
  return { done:n, total:ts.length };
}
function quizAccuracy(){
  var n = 0, c = 0;
  Object.keys(P.quizTopic).forEach(function(k){ n += P.quizTopic[k].n; c += P.quizTopic[k].c; });
  return { n:n, c:c, pct: n ? Math.round(c*100/n) : 0 };
}
function weakTopics(){
  var out = [];
  Object.keys(P.quizTopic).forEach(function(k){
    var s = P.quizTopic[k];
    if (!TBYID[k] || s.n < 2) return;
    var pct = Math.round(s.c*100/s.n);
    if (pct < 60) out.push({ id:k, pct:pct, n:s.n });
  });
  out.sort(function(a,b){ return a.pct - b.pct; });
  return out;
}
function band(pct){ return pct < 34 ? "b-bad" : (pct < 67 ? "b-warn" : ""); }
/* ===== 17 · helpers and shared components ===== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
var app = document.getElementById("app");
var toastEl = document.getElementById("toast");
var toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("on"); }, 2200);
}
function bar(pct){
  return '<div class="bar"><i class="'+band(pct)+'" style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div>';
}
function statCard(num, label, sub, pct){
  return '<div class="stat"><div class="num">'+num+'%</div><p class="lab">'+esc(label)+'</p>'+
         '<p class="sub">'+esc(sub)+'</p>'+bar(pct)+'</div>';
}
function prioPill(p){
  return '<span class="pill'+(p === "high" ? " p-high" : "")+'">'+esc(p)+'</span>';
}
function moduleName(m){
  var mo = MODULES.filter(function(x){ return x.id === m; })[0];
  return mo ? mo.n : m;
}
function moduleTitle(m){
  var mo = MODULES.filter(function(x){ return x.id === m; })[0];
  return mo ? mo.title : m;
}
function topicCard(t){
  var p = topicProgress(t), st = topicStatus(t.id);
  var lab = st === "done" ? "finished" : (st === "progress" ? "in progress" : "not started");
  return '<div class="tcard'+(t.priority === "high" ? " hi" : "")+'">'+
    '<div class="trow"><span class="dot s-'+st+'" role="img" aria-label="'+lab+'"></span>'+
      '<h3>'+esc(t.title)+'</h3>'+prioPill(t.priority)+'</div>'+
    '<p class="small muted" style="margin:0">'+esc(t.summary)+'</p>'+
    '<div class="qmeter">'+bar(p.pct)+
      '<span class="qn">'+p.done+' / '+p.total+' questions</span>'+
      '<button class="btn" data-go="topic" data-id="'+esc(t.id)+'">Open</button></div></div>';
}
function backBtn(m){
  return '<button class="back" data-go="mod" data-m="'+esc(m)+'">&larr; '+esc(moduleName(m))+'</button>';
}
function scrollKeep(fn){
  var y = window.scrollY || window.pageYOffset || 0;
  fn();
  try { window.scrollTo(0, y); } catch(e){}
}
function markCount(){
  var n = 0;
  TOPICS.forEach(function(t){ n += qIdsOf(t).length; });
  return n;
}
/* ===== 18 · Dashboard — readiness over exam-priority topics only ===== */
function viewDash(){
  var o = overallProgress();
  var pn = trackProgress("problem-solving");
  var th = trackProgress("theory");
  var ex = excludedCount(null);

  var h = '<h1>'+esc(META.course)+'</h1>'+
    '<p class="lead">Readiness counts only the topics on this paper. Progress comes from questions you mark done, '+
    'and is stored in this browser alone.</p>'+
    '<div class="grid3">'+
      statCard(o.pct, "Overall readiness", o.done+" of "+o.total+" questions", o.pct)+
      statCard(pn.pct, "Numericals readiness", pn.done+" of "+pn.total+" questions", pn.pct)+
      statCard(th.pct, "Theory readiness", th.done+" of "+th.total+" questions", th.pct)+
    '</div>';

  MODULES.forEach(function(m){
    var mp = moduleProgress(m.id), tf = topicsFinished(m.id), lo = excludedCount(m.id);
    var sub = mp.total
      ? mp.done+" of "+mp.total+" questions &middot; "+tf.done+" of "+tf.total+" topics finished"
      : "no exam-priority topics";
    if (lo) sub += ' <span class="muted">&middot; '+lo+' low-priority not counted</span>';
    h += '<div class="card"><div class="qmeter" style="margin-top:0">'+

      '<br><span class="muted">'+sub+'</span></span>'+
      '<span class="num" style="font-size:1.05rem;font-weight:800;color:var(--accent)">'+mp.pct+'%</span>'+
      '<button class="btn" data-go="mod" data-m="'+esc(m.id)+'">Open</button></div>'+
      bar(mp.pct)+'</div>';
  });

  if (ex) h += '<p class="small muted">'+ex+' low-priority topics are excluded from every figure above. '+
    'They are still on the module tabs and can still be marked done. See the Plan tab for why.</p>';

  app.innerHTML = h;
}
/* ===== 19 · Module tab ===== */
var subTab = {};   /* session-lifetime only, never persisted */

function viewModule(m){
  var mp = moduleProgress(m), tf = topicsFinished(m);
  var h = '<h1>'+esc(moduleName(m))+' &middot; '+esc(moduleTitle(m))+'</h1>';

  if (m === "m2"){
    h += '<div class="box tip"><h5>Read this before you start</h5>'+

      'marks-per-minute topic on the paper: almost every question is pure substitution once you have &lambda; and &mu;. '+

      '<p><b>Module 2 is now backed by your class notes.</b> <span class="mono">OR_Notes.pdf</span> pp. 14&ndash;21 cover it '+
      'properly &mdash; the six elements, the four server arrangements, <b>Kendall&rsquo;s notation</b>, transient vs steady '+
      'state, the full probability set and two worked problems. Several of those appear <b>only</b> in the notes and not in '+
      '<span class="mono">Queuing PPT.pdf</span>, which makes them prime exam material.</p></div>';
  }


  var lo = excludedCount(m);
  h += '<div class="card"><div class="qmeter" style="margin-top:0">'+

       tf.done+' / '+tf.total+' topics finished</span></div>'+
       (lo ? '<p class="small muted" style="margin:9px 0 0">Exam-priority topics only. '+lo+
             ' low-priority topics in this module are listed below but excluded from the figure.</p>' : '')+
       '</div>';

  var cur = subTab[m] || TRACKS[0].id;
  h += '<div class="subtabs" role="tablist">';
  TRACKS.forEach(function(tr){
    var n = TOPICS.filter(function(t){ return t.m === m && t.type === tr.id; }).length;
    h += '<button class="tab" role="tab" aria-selected="'+(cur === tr.id)+'" '+
         'data-sub="'+esc(tr.id)+'" data-m="'+esc(m)+'">'+esc(tr.label)+' ('+n+')</button>';
  });
  h += '<button class="tab" role="tab" aria-selected="'+(cur === "review")+'" '+
       'data-sub="review" data-m="'+esc(m)+'">Quick Review</button></div>';

var QSIZE = 20;
var quizSet = null;        /* {setIdx, items:[{q, order, sel}], submitted, score} */

/* Deterministic split into sets of 20, so "Set 3" is always the same 20 questions. */
function quizSets(){
  var out = [], i;
  for (i = 0; i < QUIZ.length; i += QSIZE) out.push(QUIZ.slice(i, i + QSIZE));
  return out;
}
function setKey(i){ return "set" + i; }

function openSet(idx){
  var sets = quizSets();
  if (idx < 0 || idx >= sets.length) return;
  quizSet = {
    setIdx: idx,
    items: sets[idx].map(function(q){
      var order = q.o.map(function(_, k){ return k; });
      for (var i = order.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var t = order[i]; order[i] = order[j]; order[j] = t;
      }
      return { q:q, order:order, sel:null };
    }),
    submitted:false, score:0
  };
}

function submitSet(){
  var st = quizSet, n = 0;
  st.items.forEach(function(it){
    var ok = it.sel === it.q.a;
    if (ok) n++;
    recordQuiz(it.q, ok);          /* only marked on submit, never on selection */
  });
  st.score = n;
  st.submitted = true;
  var r = P.quizSets || (P.quizSets = {});
  r[setKey(st.setIdx)] = { n:st.items.length, c:n, at:today() };
  if (!saveProgress()) toast("Progress could not be saved in this browser");
}

function recordQuiz(q, ok){
  var a = P.quizTopic[q.t] || {n:0, c:0};
  a.n++; if (ok) a.c++;
  P.quizTopic[q.t] = a;
  var b = P.quizStage[q.stage] || {n:0, c:0};
  b.n++; if (ok) b.c++;
  P.quizStage[q.stage] = b;
  P.lastStudied = today();
}

function resetQuizData(){
  var acc = quizAccuracy();
  if (!window.confirm("This erases all quiz data in this browser: "+acc.n+" answered question"+
      (acc.n === 1 ? "" : "s")+", your per-topic and per-stage record, your set scores and the weak-areas "+
      "list on the Dashboard.\n\nQuestions you have marked done on topic pages are NOT affected.\n\nThis cannot be undone.")) return;
  P.quizTopic = {}; P.quizStage = {}; P.quizSets = {};
  quizSet = null;
  saveProgress();
  go({name:"quiz"});
  toast("Quiz data erased");
}

  Object.keys(REVIEW).forEach(function(m){

function stripTags(s){ return String(s == null ? "" : s).replace(/<[^>]*>/g, ""); }

function hl(text, q){
  var s = esc(text), i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return s;   /* normalised-only match: show the text unhighlighted */
  return s.slice(0, i)+"<b>"+s.slice(i, i + q.length)+"</b>"+s.slice(i + q.length);
}
function runSearch(qs){
  var q = qs.trim();
  if (q.length < 2){ app.innerHTML = '<h1>Search</h1><p class="lead">Type at least two characters.</p>'; return; }
  var lq = q.toLowerCase();
  var nq = norm(q);
  var hits = buildIndex().filter(function(r){
    var hay = r.title+" "+r.snip+" "+r.crumb;
    return hay.toLowerCase().indexOf(lq) >= 0 || norm(hay).indexOf(nq) >= 0;
  }).slice(0, 60);
  var h = '<h1>Search</h1><p class="lead">'+hits.length+' result'+(hits.length === 1 ? "" : "s")+' for &ldquo;'+esc(q)+'&rdquo;.</p>';
  if (!hits.length) h += '<div class="card"><p style="margin:0">Nothing matched. Try a method name, a formula symbol, or a phrase from a question.</p></div>';
  hits.forEach(function(r, i){
    h += '<button class="sres" data-sr="'+i+'"><span class="crumb">'+esc(r.kind)+' &middot; '+esc(r.crumb)+'</span>'+
         '<b style="color:var(--text)">'+hl(r.title, q)+'</b><br><span class="muted">'+hl(r.snip.slice(0,160), q)+'</span></button>';
  });
  app.innerHTML = h;
  app._hits = hits;
}

function doExport(){
  var data = JSON.parse(JSON.stringify(P));
  data._app = "or_mse_study";
  data._course = META.code+" "+META.course;
  data._exportedAt = new Date().toISOString();
  try {
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "or-mse-progress.json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("Progress exported");
  } catch(e){ toast("Export is not available in this browser"); }
}
function doImport(file){
  var r = new FileReader();
  r.onload = function(){
    var parsed;
    try { parsed = JSON.parse(r.result); }
    catch(e){ toast("That file is not valid JSON"); return; }
    var v = validateProgress(parsed);
    if (!v.ok){ toast("That is not a progress file — nothing was changed"); return; }
    P = v.data;
    saveProgress();
    render();
    toast("Progress imported");
  };
  r.onerror = function(){ toast("Could not read that file"); };
  r.readAsText(file);
}
function doReset(){
  var o = allProgress();
  var msg = "This clears all progress in this browser: "+o.done+" marked question"+(o.done === 1 ? "" : "s")+
            ", your quiz record and your streak. Other devices are not affected. This cannot be undone.";
  if (!window.confirm(msg)) return;
  P = blankProgress();
  try { window.localStorage.removeItem(KEY); } catch(e){ storageOK = false; }
  view = {name:"dash"};
  render();
  toast("You are back at 0%");
}

function applyTheme(t){
  var root = document.documentElement;
  if (t === "light" || t === "dark") root.setAttribute("data-theme", t);
  else root.removeAttribute("data-theme");
}
function render(){
  renderTabs();
  switch (view.name){
    case "mod":      viewModule(view.m); break;
    case "topic":    viewTopic(view.id); break;

    case "quiz":     viewQuiz(); break;
    case "formulae": viewFormulae(); break;
    case "exam":     viewExam(); break;

function go(v, keepScroll){
  view = v;
  if (keepScroll) scrollKeep(render);

document.addEventListener("click", function(ev){
  var el = ev.target;
  while (el && el !== document && !(el.dataset && Object.keys(el.dataset).length)) el = el.parentNode;
  if (!el || el === document) return;
  var d = el.dataset;

  if (d.go){
    /* leaving the quiz by the nav tab or "All sets" must drop the open set */
    if (d.go === "quiz") quizSet = null;
    if (d.go === "topic") go({name:"topic", id:d.id});
    else if (d.go === "mod"){
      if (d.sub) subTab[d.m] = d.sub;
      go({name:"mod", m:d.m});
    }
    else go({name:d.go});
    return;
  }
  if (d.sub){ subTab[d.m] = d.sub; go({name:"mod", m:d.m}, true); return; }
  if (d.rev){ revealed[d.rev] = !revealed[d.rev]; scrollKeep(render); return; }
  if (d.hint){ revealed[d.hint+"_h"] = !revealed[d.hint+"_h"]; scrollKeep(render); return; }
  if (d.mark){
    var map = d.mark === "e" ? P.examples : P.practice;
    if (map[d.id]) delete map[d.id]; else map[d.id] = true;
    P.lastStudied = today();
    if (!saveProgress()) toast("Progress could not be saved in this browser");
    scrollKeep(render);
    return;
  }
  if (d.act === "search"){
    searchWrap.classList.toggle("on");
    if (searchWrap.classList.contains("on")) qEl.focus();
    return;
  }
  if (d.act === "theme"){
    var cur = loadTheme();
    var next = cur === "system" ? "light" : (cur === "light" ? "dark" : "system");
    saveTheme(next); applyTheme(next);
    toast("Theme: "+(next === "system" ? "match system" : next));
    if (view.name === "settings") scrollKeep(render);
    return;
  }
  if (d.theme){ saveTheme(d.theme); applyTheme(d.theme); scrollKeep(render); return; }
  if (d.act === "export"){ doExport(); return; }
  if (d.act === "import"){ var f = document.getElementById("impfile"); if (f) f.click(); return; }
  if (d.act === "reset"){ doReset(); return; }

  if (d.qset !== undefined){ openSet(parseInt(d.qset, 10)); go({name:"quiz"}); return; }
  if (d.act === "qsubmit"){
    if (!quizSet || quizSet.submitted) return;
    var un = quizSet.items.filter(function(i){ return i.sel === null; }).length;
    if (un && !window.confirm(un+" question"+(un === 1 ? " is" : "s are")+" still unanswered and will be marked wrong.\n\nSubmit anyway?")) return;
    submitSet();
    go({name:"quiz"});
    return;
  }
  if (d.act === "qreset"){ resetQuizData(); return; }
  if (d.qa !== undefined && quizSet && !quizSet.submitted){
    var it = quizSet.items[parseInt(d.qa, 10)];
    if (it) { it.sel = it.order[parseInt(d.qo, 10)]; scrollKeep(render); }
    return;
  }
  if (d.sr !== undefined){
    var r = (app._hits || [])[parseInt(d.sr, 10)];
    if (!r) return;
    if (r.go === "topic"){
      go({name:"topic", id:r.id});
      if (r.anchor) setTimeout(function(){
        var n = document.getElementById(r.anchor);
        if (n && n.scrollIntoView) n.scrollIntoView();
      }, 0);
    } else if (r.go === "mod"){
      if (r.sub) subTab[r.m] = r.sub;
      go({name:"mod", m:r.m});
    } else go({name:r.go});
    return;
  }
}, false);
