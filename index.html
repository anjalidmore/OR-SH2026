<title>OR MSE Study Guide</title>
<style>
:root{
  --bg:#f7f7f6; --surface:#ffffff; --text:#1b1b1a; --muted:#5f6360;
  --border:#e0e0dd; --border-2:#ececeb;
  --accent:#2f5bd0; --good:#2f7d55; --warn:#9a6a12; --bad:#a83f36;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131414; --surface:#1b1c1c; --text:#e8e8e6; --muted:#a0a4a1;
    --border:#2e3030; --border-2:#262828;
    --accent:#7fa2ee; --good:#68b489; --warn:#d0a352; --bad:#e08379;
  }
}
:root[data-theme="dark"]{
  --bg:#131414; --surface:#1b1c1c; --text:#e8e8e6; --muted:#a0a4a1;
  --border:#2e3030; --border-2:#262828;
  --accent:#7fa2ee; --good:#68b489; --warn:#d0a352; --bad:#e08379;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:.875rem; line-height:1.6; overflow-x:hidden;
}
img{max-width:100%}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---- nav ---- */
#nav{
  position:-webkit-sticky; position:sticky; top:0; z-index:100;
  background:var(--surface); border-bottom:1px solid var(--border);
  box-shadow:0 1px 8px rgba(0,0,0,.06);
}
.navin{max-width:880px; margin:0 auto; padding:0 18px; display:flex; align-items:center; gap:14px}
#brand{
  background:none; border:0; color:var(--text); font:700 .92rem/1 inherit;
  padding:9px 0; cursor:pointer; white-space:nowrap; font-family:inherit;
}
#tabs{display:flex; gap:4px; overflow-x:auto; flex:1; scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{
  background:none; border:0; border-bottom:2px solid transparent; color:var(--muted);
  font:400 .78rem/1 inherit; font-family:inherit; padding:9px 7px; cursor:pointer;
  white-space:nowrap; min-height:32px;
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"],.tab.on{color:var(--accent); border-bottom-color:var(--accent); font-weight:700}
.iconbtn{
  background:none; border:1px solid var(--border); border-radius:7px; color:var(--muted);
  font:400 .7rem/1 inherit; font-family:inherit; padding:0; cursor:pointer;
  min-width:32px; min-height:32px; display:inline-flex; align-items:center; justify-content:center;
}
.iconbtn:hover{color:var(--text); border-color:var(--muted)}
.navtools{display:flex; gap:4px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---- layout ---- */
main{max-width:880px; margin:0 auto; padding:22px 18px 80px}
h1{font-size:1.5rem; font-weight:700; line-height:1.25; margin:0 0 4px}
h2{
  font-size:1.05rem; font-weight:700; margin:1.6rem 0 9px;
  padding-top:14px; border-top:1px solid var(--border);
}
h3{font-size:.92rem; font-weight:700; margin:14px 0 4px}
h4{font-size:.86rem; font-weight:700; margin:9px 0 4px}
h5{font-size:.78rem; font-weight:700; margin:0 0 4px}
p{margin:0 0 9px}
ul,ol{margin:0 0 9px; padding-left:22px}
li{margin:0 0 4px}
a{color:var(--accent)}
.lead{color:var(--muted); margin:0 0 14px}
.small{font-size:.78rem}
.muted{color:var(--muted)}
.back{
  background:none; border:0; color:var(--accent); font:400 .78rem/1 inherit; font-family:inherit;
  padding:7px 0; cursor:pointer; min-height:32px; display:inline-block;
}

/* ---- components ---- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px; margin:0 0 9px;
}
.card.hi{border-left:3px solid var(--accent)}
.box{
  border-left:4px solid var(--muted); border-radius:0 7px 7px 0;
  padding:9px 14px; margin:0 0 9px; background:var(--surface);
  background:color-mix(in srgb, var(--muted) 6%, var(--surface));
}
.box.mistake{border-left-color:var(--bad); background:var(--surface); background:color-mix(in srgb, var(--bad) 6%, var(--surface))}
.box.warning{border-left-color:var(--warn); background:var(--surface); background:color-mix(in srgb, var(--warn) 6%, var(--surface))}
.box.tip{border-left-color:var(--good); background:var(--surface); background:color-mix(in srgb, var(--good) 6%, var(--surface))}
.box p:last-child,.box ul:last-child,.box ol:last-child{margin-bottom:0}
.pill{
  display:inline-block; font-size:.7rem; line-height:1.5; padding:2px 8px;
  border:1px solid var(--border); border-radius:999px; color:var(--muted);
  white-space:nowrap; margin:0 4px 0 0;
}
.pill.p-high{border-color:var(--accent); color:var(--accent)}
.bar{height:6px; border-radius:999px; background:var(--border-2); overflow:hidden}
.bar>i{display:block; height:100%; border-radius:999px; background:var(--good)}
.bar>i.b-bad{background:var(--bad)}
.bar>i.b-warn{background:var(--warn)}
.dot{
  display:inline-block; width:9px; height:9px; border-radius:999px;
  background:var(--border-2); border:1px solid var(--border); flex:none;
}
.dot.s-progress{background:var(--warn); border-color:var(--warn)}
.dot.s-done{background:var(--good); border-color:var(--good)}
.tcard{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px; margin:0 0 9px;
}
.tcard.hi{border-left:3px solid var(--accent)}
.trow{display:flex; align-items:center; gap:7px; margin:0 0 4px}
.trow h3{margin:0; flex:1}
.qmeter{display:flex; align-items:center; gap:9px; margin-top:9px}
.qmeter .bar{flex:1; min-width:60px}
.qmeter .qn{font-size:.78rem; color:var(--muted); white-space:nowrap}
.btn{
  background:var(--surface); border:1px solid var(--border); border-radius:7px;
  color:var(--text); font:400 .78rem/1 inherit; font-family:inherit;
  padding:7px 9px; cursor:pointer; min-height:32px;
}
.btn:hover{border-color:var(--muted)}
.btn.on{border-color:var(--accent); color:var(--accent); font-weight:700}
.btn.pri{border-color:var(--accent); color:var(--accent); font-weight:700}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px;
}
.stat .num{font-size:1.5rem; font-weight:800; color:var(--accent); line-height:1.1}
.stat .lab{font-size:.78rem; font-weight:700; margin:4px 0 0}
.stat .sub{font-size:.78rem; color:var(--muted); margin:0 0 9px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:0 0 14px}
.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin:0 0 9px}
@media (max-width:620px){.grid3,.grid2{grid-template-columns:1fr}}
.subtabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin:0 0 14px}
.btnrow{display:flex; gap:7px; flex-wrap:wrap; margin:9px 0 0}
.reveal{margin-top:9px; padding-top:9px; border-top:1px solid var(--border-2)}
.tw{overflow-x:auto; margin:0 0 9px}
table{border-collapse:collapse; font-size:.78rem; min-width:100%}
th,td{border:1px solid var(--border); padding:4px 7px; text-align:left; vertical-align:top}
th{font-weight:700; background:var(--border-2)}
.mono.blk{
  display:block; white-space:pre; overflow-x:auto; background:var(--border-2);
  border-radius:7px; padding:9px; font-size:.78rem; margin:0 0 9px;
}
#toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:7px 14px; border-radius:7px;
  font-size:.78rem; z-index:200; opacity:0; transition:opacity 120ms; pointer-events:none;
  max-width:90vw; text-align:center;
}
#toast.on{opacity:1}
#searchwrap{display:none; padding:9px 0 0}
#searchwrap.on{display:block}
#q{
  width:100%; padding:9px; border:1px solid var(--border); border-radius:7px;
  background:var(--surface); color:var(--text); font:400 .875rem/1.4 inherit; font-family:inherit;
}
.sres{
  display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--border); border-radius:7px; padding:9px; margin:0 0 4px;
  cursor:pointer; color:var(--text); font:400 .78rem/1.5 inherit; font-family:inherit;
}
.sres:hover{border-color:var(--accent)}
.sres b{color:var(--accent)}
.crumb{font-size:.7rem; color:var(--muted); display:block}
.qrow{
  display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--border-2);
}
.qrow:last-child{border-bottom:0}
.qrow .t{flex:1; min-width:0}
.exrow{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid var(--border-2); flex-wrap:wrap}
.exrow:last-child{border-bottom:0}
.exrow .t{flex:1; min-width:140px}
.opt{
  display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--border); border-radius:7px; padding:9px; margin:0 0 4px;
  cursor:pointer; color:var(--text); font:400 .82rem/1.5 inherit; font-family:inherit; min-height:32px;
}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--accent)}
.opt.ok{border-color:var(--good); background:var(--surface); background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.opt.no{border-color:var(--bad); background:var(--surface); background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.opt[disabled]{cursor:default}
[hidden]{display:none !important}
</style>
</head>

  whatIs:"<p>A mathematical model in OR expresses a decision problem as a value to be optimised, a set of things you are allowed to change, and the restrictions on them.</p>",
  concept:"<h4>The components</h4><ul>"+
    "<li><b>Decision variables</b> (also called design variables) — the values the optimizer can change. In your notes' square example, the length of the square.</li>"+
    "<li><b>Objective function</b> — the value you are trying to optimize. For a square of sides a and b, Area = a &times; b.</li>"+
    "<li><b>Constraints</b> — the restrictions on the variables, expressed as linear inequalities or equations.</li>"+
    "<li><b>Non-negativity condition</b> — the variables cannot go below zero.</li></ul>"+
    "<p>The goal of optimization, as stated in your notes, is <i>to improve the value of the objective function</i>. The act of obtaining best results under any given circumstances is what your notes call <b>optimizing</b>.</p>"+
    "<h4>Why a model at all</h4><p>Your notes make the case with a contrast. In simple situations — buying a microwave or a washing machine — common sense and judgement suffice; you compare price, quality and durability and decide. In complex situations — finding a product mix among competitors' products, or planning a public transportation network for a city — a decision backed by mathematical calculation reduces the risk factor and increases the probability of success.</p>",

  whatIs:"<p>Every linear programme has a partner problem built from the same numbers, read the other way round. The original is the <b>primal</b>; the partner is the <b>dual</b>.</p>",
  concept:"<h4>The four rules in your notes</h4><ol>"+

    "<li><b>Build a data table</b> with one row per activity and one column per resource. Your notes do this explicitly for the diet problem. The table <i>is</i> the constraint set, transposed.</li>"+
    "<li><b>Write the objective function.</b> Profit or revenue → Maximize; cost → Minimize.</li>"+
    "<li><b>Write one constraint per limited resource or per requirement.</b> Resource available → &le;. Requirement to be met → &ge;.</li>"+
    "<li><b>Write the non-negativity condition.</b> x &ge; 0, y &ge; 0.</li>"+
    "<li><b>Simplify.</b> Divide a constraint through by a common factor: 2500x + 500y &le; 50000 becomes 5x + y &le; 100.</li></ol>"+
    "<h4>The direction rule</h4>"+
    "<div class='tw'><table><tr><th>Words in the question</th><th>Sign</th></tr>"+
    "<tr><td>has, available, at most, capacity, storage of, budget of, maximum labour hours</td><td>&le;</td></tr>"+
    "<tr><td>at least, must contain, minimum, requirement, no less than</td><td>&ge;</td></tr>"+
    "<tr><td>exactly, all of, the whole of</td><td>=</td></tr></table></div>"+
    "<h4>Units are the check</h4><p>Every term in one constraint must be in the same unit. In the manufacturing problem, 9x + 12y &le; 180 is labour-hours per week on both sides; x + 3y &le; 30 is finishing hours. If a term does not carry the unit of its constraint, the coefficient is in the wrong constraint.</p>",

    "Define variables in a sentence with units before writing any algebra.",
    "Choose Max or Min from the words profit/revenue vs cost.",
    "Choose &le; or &ge; from the resource-vs-requirement wording.",
    "Simplify coefficients by a common factor.",
    "Check each constraint for unit consistency."

     a:"<p>Let x and y be the units of A and B produced. <b>Milk:</b> x + y &le; 5. <b>Choco:</b> 3x + 2y &le; 12. <b>Objective:</b> Maximize Z = 6x + 5y. <b>Non-negativity:</b> x, y &ge; 0.</p><p>Corners: O(0,0) → Z = 0. On the x-axis, 3x &le; 12 and x &le; 5 give x = 4 → (4,0), Z = 24. On the y-axis, y &le; 5 and 2y &le; 12 give y = 5 → (0,5), Z = 25. Intersection of x + y = 5 and 3x + 2y = 12: from the first y = 5 &minus; x, substitute → 3x + 10 &minus; 2x = 12 → x = 2, y = 3 → Z = 12 + 15 = 27.</p><p><b>Maximum Z = 27 at (2, 3)</b> — 2 units of A and 3 units of B.</p>"},

  title:"Graphical method — the corner point method",
  summary:"Plot the constraints, find the vertices, evaluate Z at each. The whole method is four steps.",
  whatIs:"<p>For a two-variable LPP the feasible region is a polygon. The optimum always sits at a corner, so evaluating Z at every corner is enough.</p>",
  concept:"<h4>The corner point method, as your notes state it</h4><ol>"+
    "<li>Find the feasible region of the LPP and determine its corner points (vertices), either by inspection or by solving the two equations of the lines intersecting at that point.</li>"+
    "<li>Evaluate the objective function Z = ax + by at each corner point. Let M and m denote the largest and smallest of these values.</li>"+
    "<li>When the feasible region is <b>bounded</b>, M and m are the maximum and minimum values of Z.</li>"+
    "<li>When the feasible region is <b>unbounded</b>, an extra check is needed — see the separate topic on unbounded regions.</li></ol>"+
    "<h4>Plotting a constraint in three moves</h4><p>For ax + by &le; c: set x = 0 to get the y-intercept c/b; set y = 0 to get the x-intercept c/a; join them and shade the side containing the origin (test (0,0) in the inequality — if it satisfies, shade towards it).</p>"+
    "<h4>Finding the interior corner</h4><p>The corner where two constraint lines cross is found by solving those two equations simultaneously. This is the corner that is almost always optimal, and it is the one that cannot be read off by inspection.</p>"+
    "<div class='box tip'><h5>Always tabulate</h5><p>Write a two-column table — corner point | value of Z — and fill it in. Your notes present every worked example this way, and a table makes an arithmetic slip visible.</p></div>",
  needToKnow:[
    "Plot a constraint from its two intercepts and shade the correct side.",
    "Identify every vertex of the feasible region, solving simultaneously for the interior one.",
    "Tabulate Z at each vertex and pick the extreme value.",
    "State whether the region is bounded before concluding."
  ],

  examples:[
    {id:"m1t11e1", title:"Example 1 — Maximise Z = 4x + y",
     q:"Maximise Z = 4x + y subject to x + y ≤ 50, 3x + y ≤ 90, x ≥ 0, y ≥ 0.",
     steps:[
      "Intercepts of x + y = 50: (50, 0) and (0, 50). Intercepts of 3x + y = 90: (30, 0) and (0, 90).",
      "Test (0,0) in both: 0 ≤ 50 ✓ and 0 ≤ 90 ✓, so the feasible region contains the origin and is bounded.",
      "Corner points: O(0,0), A(30,0) — the tighter of the two x-intercepts — B, the intersection, and C(0,50) — the tighter of the two y-intercepts.",
      "Find B by solving x + y = 50 and 3x + y = 90 simultaneously: subtracting gives 2x = 40, so x = 20 and y = 30. B is (20, 30).",
      "Evaluate: Z(0,0) = 0; Z(30,0) = 120; Z(20,30) = 80 + 30 = 110; Z(0,50) = 50.",
      "The largest value is 120."],
     answer:"Maximum value of Z is <b>120 at the point (30, 0)</b>.",
     trap:"The optimum here is <i>not</i> the interior corner. Do not assume the intersection point always wins — with Z = 4x + y the objective is steeply weighted towards x, and the x-axis corner beats it."},
    {id:"m1t11e2", title:"Example 3 — a maximum attained at two corners",
     q:"Minimise and maximise Z = 3x + 9y subject to x + 3y ≤ 60, x + y ≥ 10, x ≤ y, x ≥ 0, y ≥ 0.",
     steps:[

  practice:[
    {id:"m1t11p1", d:"easy", q:"Solve graphically: Minimise Z = 200x + 500y subject to x + 2y ≥ 10, 3x + 4y ≤ 24, x ≥ 0, y ≥ 0.",

     a:"<p>The feasible region ABC is bounded. Corner points: A(0, 5) — from x + 2y = 10 at x = 0; B(4, 3) — solving x + 2y = 10 with 3x + 4y = 24: multiply the first by 2 to get 2x + 4y = 20, subtract from the second to get x = 4, then y = 3; C(0, 6) — from 3x + 4y = 24 at x = 0.</p><p>Evaluate: Z(0,5) = 2500; Z(4,3) = 800 + 1500 = 2300; Z(0,6) = 3000.</p><p><b>Minimum Z = 2300 at the point (4, 3).</b> Because the region is bounded, this is final — no open-half-plane check is needed.</p>"},
    {id:"m1t11p2", d:"moderate", q:"Solve graphically: Maximise Z = 10500x + 9000y subject to x + y ≤ 50, 2x + y ≤ 80, x ≥ 0, y ≥ 0. State the answer as a land-allocation decision.",

     a:"<p>Corners: O(0,0), A(20,0) from 5x = 100, B the intersection, C(0,60) from x + y = 60 (note 0 + 60 = 60 &le; 60 and 5(0) + 60 = 60 &le; 100, so C is feasible).</p><p>B: solve 5x + y = 100 and x + y = 60. Subtracting gives 4x = 40, so x = 10 and y = 50.</p><p>Evaluate: Z(0,0) = 0; Z(20,0) = 5000; Z(10,50) = 2500 + 3750 = 6250; Z(0,60) = 4500.</p><p><b>Maximum Z = Rs 6250 at (10, 50)</b> — buy 10 tables and 50 chairs.</p><p><b>Why the pure strategies lose:</b> buying only tables spends the whole Rs 50,000 on 20 tables for Rs 5000 profit, using only 20 of the 60 storage slots. Buying only chairs could afford 100 chairs but storage caps it at 60, giving Rs 4500 and leaving money idle. The mix at (10, 50) is the only point that exhausts <i>both</i> the money and the storage simultaneously, which is why it wins.</p>"}

{
  id:"m1t12", m:"m1", type:"problem-solving", priority:"low", los:[],
  title:"Graphical method — unbounded feasible regions",
  summary:"When the region is open, the best corner value may not be the optimum. One half-plane test settles it.",
  whatIs:"<p>An unbounded feasible region stretches to infinity in some direction. The corner values are then only <i>candidates</i>, and one further check decides whether a candidate really is the optimum.</p>",
  concept:"<h4>The rule your notes state</h4><p>When the feasible region is unbounded:</p><ul>"+
    "<li><b>M is the maximum</b> value of Z if the open half plane determined by ax + by &gt; M has <b>no point in common</b> with the feasible region. Otherwise Z has no maximum value.</li>"+
    "<li><b>m is the minimum</b> value of Z if the open half plane determined by ax + by &lt; m has <b>no point in common</b> with the feasible region. Otherwise Z has no minimum value.</li></ul>"+
    "<h4>How to run the check</h4><ol>"+
    "<li>Find the best corner value, call it m (for a minimisation).</li>"+
    "<li>Write the strict inequality ax + by &lt; m and simplify it.</li>"+
    "<li>Graph that open half plane and look at the feasible region.</li>"+
    "<li>No common points → m is the minimum. Common points exist → Z has no minimum.</li></ol>"+
    "<h4>The two outcomes in your notes, side by side</h4>"+
    "<div class='tw'><table><tr><th></th><th>Diet problem</th><th>Example 4</th></tr>"+
    "<tr><td>Problem</td><td>Min Z = 50x + 70y, 2x + y &ge; 8, x + 2y &ge; 10</td><td>Min Z = &minus;50x + 20y, 2x &minus; y &ge; &minus;5, 3x + y &ge; 3, 2x &minus; 3y &le; 12</td></tr>"+
    "<tr><td>Best corner</td><td>380 at (2, 4)</td><td>&minus;300 at (6, 0)</td></tr>"+
    "<tr><td>Half plane tested</td><td>50x + 70y &lt; 380, i.e. 5x + 7y &lt; 38</td><td>&minus;50x + 20y &lt; &minus;300, i.e. &minus;5x + 2y &lt; &minus;30</td></tr>"+
    "<tr><td>Common points?</td><td>None</td><td>Yes</td></tr>"+
    "<tr><td>Conclusion</td><td>Minimum Z = 380 at (2, 4)</td><td>Z has <b>no minimum value</b></td></tr></table></div>"+
    "<div class='box warning'><h5>Why this is worth marks</h5><p>Both problems look identical up to the corner table. The candidate who writes &lsquo;minimum = &minus;300&rsquo; for Example 4 has done all the arithmetic correctly and still has the wrong answer. Stating &lsquo;the region is unbounded, so I must check&rsquo; is the step being examined.</p></div>",

    {id:"m1t12e1", title:"The diet problem — the check that succeeds",
     q:"Minimise Z = 50x + 70y subject to 2x + y ≥ 8, x + 2y ≥ 10, x ≥ 0, y ≥ 0.",
     steps:[

  practice:[
    {id:"m1t17p1", d:"moderate", q:"Standardise and write the dual of: Min Z = 25x₁ + 10x₂ subject to x₁ + x₂ = 50, x₁ ≥ 20, x₂ ≤ 40, x₁, x₂ ≥ 0.",
     hint:"A minimisation needs every constraint as ≥. Two of these do not comply.",
     a:"<p><b>Standardise.</b> A minimisation requires all constraints as &ge;. The equality is written as x₁ + x₂ &ge; 50 for this purpose. The second is already x₁ + 0x₂ &ge; 20. The third, x₂ &le; 40, is multiplied by &minus;1 to give 0x₁ &minus; x₂ &ge; &minus;40.</p><p><b>Standardised primal:</b> Min Z = 25x₁ + 10x₂ subject to x₁ + x₂ &ge; 50, x₁ + 0x₂ &ge; 20, 0x₁ &minus; x₂ &ge; &minus;40.</p><p><b>Size:</b> n = 2, m = 3, so the dual has 3 variables and 2 constraints, and is a maximisation.</p><p><b>Dual:</b> Max W = 50y₁ + 20y₂ &minus; 40y₃ subject to y₁ + y₂ + 0y₃ &le; 25 (from the x₁ column 1, 1, 0), y₁ + 0y₂ &minus; y₃ &le; 10 (from the x₂ column 1, 0, &minus;1), y₁, y₂, y₃ &ge; 0.</p><p>The &minus;40 in the dual objective comes straight from the standardised right-hand side &minus;40 — a negative objective coefficient is perfectly legal.</p>"},

     hint:"Two rules do all the work here.",
     a:"<p>By the sense rule, the dual is a <b>maximisation</b>. By the size rule (n variables and m constraints become m variables and n constraints), the dual has <b>2 variables and 6 constraints</b>.</p><p>The primal's minimisation would have all &ge; constraints after standardisation, so the dual's 6 constraints are all &le;, with non-negative dual variables. The dual's 2 objective coefficients are the primal's 2 right-hand sides, and the dual's 6 right-hand sides are the primal's 6 objective coefficients.</p><p>This is exactly the situation your notes describe as the practical motivation for duality: a 6-variable, 2-constraint primal is awkward, while a 2-variable, 6-constraint dual can be solved graphically.</p>"}

  whatIs:"<p>Because primal and dual share an optimal value, you may solve whichever is smaller. The final table then carries <i>both</i> answers — one in the Solution column and one in the index row.</p>",
  concept:"<h4>Why bother</h4><p>Your notes give the motivation: the dual simplex approach is useful for solving complex problems with more than two constraints. Converting a primal with many constraints and few variables into a dual with few constraints and many variables shrinks the table dramatically, because the number of <i>rows</i> is set by the number of constraints.</p>"+
    "<h4>The recovery rule</h4><p>In the optimal table of one problem, the <b>magnitudes of the C&#8341; &minus; Z&#8341; entries under the slack columns</b> give the optimal values of the <i>other</i> problem's variables, in order.</p>"+
    "<div class='box tip'><h5>Seen in your own example</h5><p>The dual's final table has C&#8341; &minus; Z&#8341; = (0, 0, &minus;10, <b>&minus;20</b>, <b>&minus;30</b>), where the last two entries sit under s&#8321; and s&#8322;. Their magnitudes, 20 and 30, are exactly the primal optimum x&#8321; = 20 and x&#8322; = 30. And both problems close at <b>800</b>.</p></div>"+
    "<h4>Which value belongs to which</h4><p>The Solution column of the table you actually solved gives that problem's variables. The slack-column index entries give the partner problem's variables. Confusing the two is the single biggest risk in this question type.</p>",

    "Decide which of the pair is cheaper to solve, by counting constraints.",

     hint:"One entry per primal variable, plus one theorem.",
     a:"<p><b>Primal variable values:</b> the magnitudes of the slack-column index entries give x₁ = 20 and x₂ = 30, in the order the slacks appear.</p><p><b>Primal optimal value:</b> by strong duality the primal's optimum equals the dual's, so Z = 800. This can be verified directly: 25(20) + 10(30) = 800.</p><p><b>Which constraints bind:</b> both dual slacks are non-basic (their index entries are non-zero), which means both dual constraints are tight, which by complementary slackness corresponds to both primal variables being strictly positive — consistent with x₁ = 20 and x₂ = 30 both being non-zero.</p><p>What you cannot conclude: nothing about the dual's own variable values from these entries. Those come from the dual's Solution column.</p>"},

     hint:"Rows in a simplex table come from constraints.",
     a:"<p>Solve the <b>dual</b>. The primal has m = 5 constraints, so its simplex table would have 5 constraint rows plus 5 slack/surplus columns on top of its 2 decision variables — a table at least 5 rows by 8 columns.</p><p>By the size rule the dual has 2 constraints and 5 variables, so its table has only <b>2 constraint rows</b>, with 5 decision variables and 2 slacks — roughly 2 rows by 8 columns. The number of pivots is bounded by the number of rows, so the dual takes at most two iterations where the primal could take five.</p><p>This is precisely the reason your notes give: the dual approach is useful for solving complex problems with more than two constraints. Having solved the dual, recover the primal's two variables from the index entries under the dual's two slack columns.</p>"}

  title:"Special cases in the simplex table",
  summary:"Alternate optima, degeneracy and an unbounded ratio — how each one shows up in the table.",
  whatIs:"<p>Three situations look like errors but are not. Recognising them in the table, and saying so, is what the mark is for.</p>",
  concept:"<div class='tw'><table><tr><th>Situation</th><th>What you see in the table</th><th>What to write</th></tr>"+
    "<tr><td><b>Alternate optima</b></td><td>At optimality, a <b>non-basic</b> variable has C&#8341; &minus; Z&#8341; = 0</td><td>More than one optimal solution exists with the same value of Z; every point on the segment joining them is optimal</td></tr>"+
    "<tr><td><b>Degeneracy</b></td><td>A tie in the minimum ratio test, producing a <b>basic variable at value 0</b> in the next table</td><td>The basic feasible solution is degenerate; break the tie arbitrarily and continue</td></tr>"+
    "<tr><td><b>Unbounded ratio</b></td><td>A key-column entry is 0 or negative, so that row's ratio is written &infin; (your notes write &lsquo;Infy&rsquo;) or is negative</td><td>That row does not compete in the ratio test. If <i>every</i> entry in the key column is &le; 0, the solution is unbounded</td></tr></table></div>"+
    "<h4>Where each one appears in your folder</h4><ul>"+
    "<li><b>Alternate optima:</b> the Big M example closes with C&#8341; &minus; Z&#8341; = (0, 0, 0, 3, 1/3) — a zero under the non-basic x&#8321;. And graphically, Example 3 attains its maximum of 180 at <i>both</i> (15, 15) and (0, 20).</li>"+
    "<li><b>Degeneracy:</b> in the three-variable example, the first ratio test ties at 5 and 5; after the pivot S&#8323; sits in the basis at value 0, and its row's ratio in the next test is 0/2 = 0.</li>"+
    "<li><b>Unbounded ratio:</b> the same example writes &lsquo;Infy&rsquo; against the x&#8321; row, whose key-column entry is 0, and has a negative ratio 15/(&minus;2) that also does not compete.</li></ul>"+
    "<div class='box warning'><h5>The rule to remember</h5><p>Only <b>strictly positive</b> key-column entries generate a competing ratio. Zero gives &infin;, negative gives a negative ratio, and neither can limit how far the entering variable may increase.</p></div>",

  examples:[
    {id:"m1t19e1", title:"Alternate optima, spotted two ways",
     q:"The Big M example ends with Cⱼ − Zⱼ = (0, 0, 0, 3, 1/3) over (x₁, x₂, x₃, s₁, s₂), with basis x₃ = 16/5, x₂ = 6/5 and Z = 82. What does the zero under x₁ tell you?",
     steps:[
      "Identify which variables are basic: x₂ and x₃. So x₁, s₁ and s₂ are non-basic.",

  practice:[
    {id:"m1t19p1", d:"moderate", q:"How would you recognise an unbounded solution from a simplex table, and how does that differ from an infeasible problem?",
     hint:"One is diagnosed from a column, the other from the basis.",
     a:"<p><b>Unbounded:</b> a variable qualifies to enter (its index entry says it improves Z), but <i>every</i> entry in its key column is zero or negative. No row can limit how far it increases, so there is no leaving variable and Z can be improved without bound. Conclude: the LPP has an <b>unbounded solution</b>. Note that feasible solutions exist in abundance — it is the optimum that does not.</p><p><b>Infeasible:</b> diagnosed only in problems that used artificial variables. The method runs to optimality by the index-row rule, but an <b>artificial variable remains basic at a positive value</b> (or, in two-phase, the Phase 1 objective does not reach zero). Conclude: the problem has <b>no feasible solution</b> — no point satisfies all the constraints at once.</p><p>They are opposites: unbounded means too much freedom, infeasible means none.</p>"},
    {id:"m1t19p2", d:"easy", q:"Graphically, Example 3 attains its maximum of 180 at both (15, 15) and (0, 20). What is the full set of optimal solutions?",
     hint:"The objective is constant along a line here.",
     a:"<p>Every point on the <b>line segment joining (15, 15) and (0, 20)</b> is optimal. That segment is an edge of the feasible region, and along it the objective Z = 3x + 9y is constant at 180 — check the midpoint (7.5, 17.5): Z = 22.5 + 157.5 = 180 ✓.</p><p>This happens when the objective function line is <b>parallel to a constraint edge</b>. Here the objective 3x + 9y is a multiple of the constraint x + 3y ≤ 60, so the objective contour and that edge have the same slope, and sliding the contour outwards makes it land on the whole edge at once rather than on a single corner.</p><p>This is the graphical face of the same phenomenon that shows in the simplex table as a zero Cⱼ − Zⱼ under a non-basic variable.</p>"}

     hint:"Classify by the direction of the inequality, and say what each kind represents.",
     a:"<p>Constraints in an LPP are the linear inequalities or equations restricting the decision variables. They come in three types:</p><p><b>1. Less-than-or-equal (&le;) — resource or capacity constraints.</b> They cap something available: money, machine hours, storage, raw material. Example: 5x + y &le; 100 for a budget.</p><p><b>2. Greater-than-or-equal (&ge;) — requirement or minimum constraints.</b> They set a floor that must be met: minimum nutrients in a diet, minimum production quota. Example: 2x + y &ge; 8 for at least 8 units of vitamin A.</p><p><b>3. Equality (=) — exact constraints.</b> Something must be used or produced exactly. Example: x&#8321; + x&#8322; = 50 when the whole of a 50-hectare field must be planted.</p><p>Plus the <b>non-negativity restriction</b> x, y &ge; 0, which the notes count separately as a component of the model rather than as an ordinary constraint.</p>"},

     a:"<p><b>The situation (+1).</b> A company has three factories with known supplies and four warehouses with known demands, and a known cost of shipping one unit along each factory&ndash;warehouse route. The transportation problem finds the schedule — how many units to send along each route — that meets every demand from the available supplies.</p><p><b>How it minimises cost (+1).</b> It is a special class of linear programming problem whose objective is to minimise the total distribution cost, subject to satisfying both the supply limits and the demand requirements. Because cost on a route is directly proportional to the units shipped, the model evaluates every feasible schedule and selects the cheapest, rather than relying on an intuitive allocation that typically over-uses convenient routes.</p><p><b>Do not</b> run NWCM, LCM or VAM here — the question asks for the concept and the benefit. Naming those methods in one clause ('an initial solution is found by NWCM, LCM or VAM and improved by MODI') is enough to show you know the machinery exists.</p>"},

  whatIs:"<p>Both methods take an initial basic feasible solution and test whether it is optimal, improving it if not. MODI is the algebraic route; stepping stone is the graphical one.</p>",
  concept:"<div class='box warning'><h5>Low priority on this paper</h5><p>Module 1 is theory only for this MSE. Included for completeness.</p></div>"+
    "<h4>MODI (Modified Distribution / u-v method)</h4><ol>"+
    "<li>Start from an initial basic feasible solution.</li>"+
    "<li>Introduce dual variables u<sub>i</sub> for the m rows and v<sub>j</sub> for the n columns &mdash; <b>m + n</b> of them in total.</li>"+
    "<li>For every <b>occupied</b> cell, u<sub>i</sub> + v<sub>j</sub> = c<sub>ij</sub>. There are only m + n &minus; 1 such equations for m + n unknowns, so <b>one dual variable is chosen arbitrarily</b> (usually u&#8321; = 0). Because the primal constraints are equations, the duals are unrestricted in sign.</li>"+
    "<li>For every <b>unoccupied</b> cell compute d<sub>ij</sub> = c<sub>ij</sub> &minus; (u<sub>i</sub> + v<sub>j</sub>). If all d<sub>ij</sub> &ge; 0 the solution is <b>optimal</b> &mdash; your notes attribute this to the theorem of complementary slackness.</li>"+
    "<li>If any d<sub>ij</sub> &lt; 0, choose the <b>most negative</b>, draw a closed loop from that cell, reallocate, and recompute a fresh set of dual variables. Repeat.</li></ol>"+
    "<h4>Stepping stone</h4><ol>"+
    "<li>Start from an initial basic feasible solution by NWCM, LCM or VAM.</li>"+
    "<li>Draw a <b>closed path</b> from an unoccupied cell. Right-angle turns are allowed only at occupied cells and at the original unoccupied cell. Mark + and &minus; alternately at each corner, starting with + at the unoccupied cell.</li>"+
    "<li>Add the transportation costs around the path with those signs &mdash; this is the <b>net cost change</b>. Repeat for every unoccupied cell.</li>"+
    "<li>If all net cost changes are &ge; 0, the solution is optimal. Otherwise take the cell with the <b>most negative</b> net cost change.</li>"+
    "<li>Find the <b>minimum allocation among the (&minus;) positions</b> on that path. Add it to every (+) cell and subtract it from every (&minus;) cell.</li>"+
    "<li>Repeat until every net cost change is &ge; 0.</li></ol>"+
    "<div class='box tip'><h5>Same answer, different bookkeeping</h5><p>MODI computes one number per unoccupied cell from the dual variables; stepping stone traces a loop for each. MODI is faster on a large table, stepping stone is easier to see. Both stop on the same condition &mdash; all d<sub>ij</sub> (or net cost changes) non-negative.</p></div>",
  needToKnow:[
    "Set up u_i + v_j = c_ij on occupied cells and fix one dual arbitrarily.",
    "Compute d_ij = c_ij − (u_i + v_j) and apply the optimality test.",
    "Trace a closed loop with alternating + and − signs.",
    "Reallocate by the minimum allocation on the negative positions."
  ],

    wording:["Find the optimal solution using the MODI method.","Test the given solution for optimality using the stepping stone method."],
    firstMove:"Check m + n &minus; 1 first. A degenerate solution must be repaired with an &epsilon; before either method will run.",
    trap:"Forgetting that only <b>occupied</b> cells generate the u + v equations, and only <b>unoccupied</b> cells get a d<sub>ij</sub>."

  examples:[
    {id:"m1t23e1", title:"The optimality condition in both languages",
     q:"State when a transportation solution is optimal, in MODI terms and in stepping stone terms.",
     steps:[
      "MODI: compute d_ij = c_ij − (u_i + v_j) for every unoccupied cell. The solution is optimal when all d_ij ≥ 0.",
      "Stepping stone: trace a closed loop from each unoccupied cell and sum the costs with alternating signs. The solution is optimal when all net cost changes are ≥ 0.",

  practice:[
    {id:"m1t23p1", d:"moderate", q:"Why is one dual variable set arbitrarily in MODI, and does the choice affect the answer?",
     hint:"Count the equations and the unknowns.",
     a:"<p>With m origins and n destinations there are <b>m + n</b> dual variables, but a basic feasible solution has only <b>m + n &minus; 1</b> occupied cells, and each occupied cell gives one equation u<sub>i</sub> + v<sub>j</sub> = c<sub>ij</sub>. So there are m + n &minus; 1 equations for m + n unknowns &mdash; one degree of freedom short.</p><p>Fixing one variable (conventionally u&#8321; = 0) removes that freedom and makes the system solvable. <b>The choice does not affect the answer.</b> Adding a constant k to every u<sub>i</sub> and subtracting k from every v<sub>j</sub> leaves every sum u<sub>i</sub> + v<sub>j</sub> unchanged, so every d<sub>ij</sub> = c<sub>ij</sub> &minus; (u<sub>i</sub> + v<sub>j</sub>) is unchanged too &mdash; and the d<sub>ij</sub> are all that the optimality test uses.</p>"}

{
  id:"m1t24", m:"m1", type:"problem-solving", priority:"low", los:[3],
  title:"Assignment problem — the Hungarian method",
  summary:"Row reduce, column reduce, cover zeros, create more. Not on this paper.",
  whatIs:"<p>The assignment problem allocates n jobs to n persons, one each, to minimise total cost. The Hungarian method solves it in four steps.</p>",
  concept:"<div class='box warning'><h5>Low priority on this paper</h5><p>Module 1 is theory only for this MSE. Included for completeness.</p></div>"+
    "<h4>Requirements</h4><p>Your notes state two: <b>only non-negative elements</b>, and a <b>square matrix of n&times;n</b>. A non-square problem needs a dummy row or column first, and a <b>maximisation must be converted to a minimisation</b> before the algorithm is applied &mdash; typically by subtracting every element from the largest element in the matrix.</p>"+
    "<h4>The four steps</h4><ol>"+
    "<li><b>Subtract row minima.</b> For each row, find the lowest element and subtract it from every element in that row.</li>"+
    "<li><b>Subtract column minima.</b> Likewise, for each column, find the lowest element and subtract it from every element in that column.</li>"+
    "<li><b>Cover all zeros with a minimum number of lines.</b> If <b>n</b> lines are required, an optimal assignment exists among the zeros and the algorithm stops. If fewer than n lines are required, continue to step 4.</li>"+
    "<li><b>Create additional zeros.</b> Find the smallest element k not covered by a line. Subtract k from all uncovered elements and <b>add k to all elements covered twice</b>. Return to step 3.</li></ol>"+
    "<div class='box tip'><h5>Making the assignment</h5><p>Once n lines are needed, assign by selecting a zero in a row (or column) that has <b>exactly one</b> zero, strike out the rest of that row and column, and repeat. Your notes add the optimality check: the <b>order of the matrix must equal the number of assignments</b> &mdash; if a 4&times;4 matrix yields only 3 assignments, you are not finished.</p>"+
    "<p>Read the <b>total cost from the original matrix</b>, never from the reduced one.</p></div>",
  needToKnow:[
    "State the two requirements: square and non-negative.",
    "Execute the four steps in order.",
    "Know the stopping rule: n lines for an n×n matrix.",
    "Convert a maximisation to a minimisation before starting.",
    "Read the cost from the original matrix."
  ],
  recognition:{
    clues:["A <b>square</b> cost matrix with people or machines against jobs.","One job per person, one person per job.","&lsquo;Optimum assignment schedule&rsquo;."],
    wording:["Solve the assignment problem using the Hungarian method.","Determine the optimum assignment schedule and the total cost."],
    firstMove:"Check the matrix is square and all entries non-negative. Fix either problem before step 1.",
    trap:"In step 4, forgetting to <b>add</b> k to the doubly-covered elements. Subtracting from the uncovered ones alone breaks the method."

  examAnswer:{
    short:"For 2 marks: the two requirements and the four step headings.",

  mistakes:[
    "Applying it to a non-square matrix without adding a dummy.",
    "Running it on a maximisation without converting to a minimisation.",
    "In step 4, subtracting k everywhere instead of only from uncovered cells, and forgetting the += k on doubly-covered cells.",
    "Totalling the cost from the reduced matrix — the reduced values are not costs.",

  examples:[
    {id:"m1t24e1", title:"Why the reduction preserves the optimal assignment",
     q:"Subtracting a constant from a whole row changes every cost in it. Why does the optimal assignment stay the same?",
     steps:[
      "Every valid assignment uses exactly one cell from each row, and exactly one from each column.",
      "So if you subtract k from every element of row i, every possible complete assignment loses exactly k from its total — because each of them uses precisely one cell in row i.",
      "Subtracting the same amount from every candidate does not change which one is smallest.",
      "The same argument applies to columns, and to the step-4 adjustment.",
      "This is why the reduced matrix can be used to FIND the assignment, while the total cost must still be read from the original matrix — the reduced numbers are shifted by all those constants."],
     answer:"Every complete assignment uses one cell per row, so a row-wise subtraction shifts all totals equally and leaves the ranking — and therefore the optimum — unchanged.",
     trap:"This is a good 2-mark 'justify' answer if it is ever asked, and it is also the reason for the most common error: reading the cost off the reduced table."}
  ],
  practice:[
    {id:"m1t24p1", d:"easy", q:"State the Hungarian method's requirements and what to do when they are not met.",
     hint:"Two requirements, two remedies.",
     a:"<p><b>Requirement 1: a square n&times;n matrix.</b> If the matrix is rectangular the problem is unbalanced &mdash; add a <b>dummy row or column</b> with all costs zero to square it up. The dummy assignment represents a job left undone or a person left idle.</p><p><b>Requirement 2: only non-negative elements.</b> The reductions assume costs, not profits.</p><p><b>If it is a maximisation problem</b>, the Hungarian method cannot be applied directly &mdash; your notes say so explicitly. Convert it to a minimisation first, usually by subtracting every element from the largest element in the matrix, then solve as normal and read the final value from the original profit table.</p>"}
  ],

  ]

{
  id:"m1t25", m:"m1", type:"problem-solving", priority:"low", los:[3],
  title:"Sequencing — Johnson's algorithm and n jobs on m machines",
  summary:"Optimal job order for 2 machines, and the G/H reduction for 3. Not on this paper.",
  whatIs:"<p>Sequencing problems arise whenever there is a choice of the order in which a number of jobs can be performed, and the aim is to minimise the total elapsed time.</p>",
  concept:"<div class='box warning'><h5>Low priority on this paper</h5><p>Module 1 is theory only for this MSE. Included for completeness.</p></div>"+
    "<h4>n jobs through TWO machines &mdash; Johnson's rule</h4><ol>"+
    "<li>Find the <b>smallest processing time</b> anywhere in the table.</li>"+
    "<li>If it lies on <b>machine A</b>, schedule that job <b>as early as possible</b> (leftmost free slot). If it lies on <b>machine B</b>, schedule it <b>as late as possible</b> (rightmost free slot).</li>"+
    "<li>Delete that job and repeat until every job is placed. Ties may be broken arbitrarily.</li></ol>"+
    "<p>Then draw the elapsed-time table with in and out times on each machine to obtain the <b>total elapsed time</b> and the <b>idle time</b> of each machine.</p>"+
    "<h4>n jobs through THREE machines</h4>"+
    "<p>The three-machine problem can be reduced to a two-machine one <b>only if at least one</b> of these conditions holds:</p>"+
    "<div class='box'><p><b>(a)</b> the minimum processing time on machine A &ge; the maximum processing time on machine B, <b>or</b><br>"+
    "<b>(b)</b> the minimum processing time on machine C &ge; the maximum processing time on machine B.</p></div>"+
    "<p>If either holds, replace the problem with an equivalent two-machine problem on fictitious machines <b>G</b> and <b>H</b> where</p>"+
    "<p class='mono blk'>G_i = A_i + B_i        H_i = B_i + C_i</p>"+
    "<p>and apply Johnson's rule to G and H. The resulting sequence is optimal for the original three-machine problem.</p>"+
    "<div class='box tip'><h5>Idle time</h5><p>The idle time of a machine is the total time it spends waiting during the elapsed period. In your notes' worked example the total elapsed time is 35 hours and machine B's idle time is 3 + 0 + 0 + 0 + 0 + 2 = 5 hours &mdash; summed from the gaps between its successive in and out times.</p></div>",

    wording:["Determine the optimal sequence and the total elapsed time.","Find the idle time for each machine.","Processing of n jobs through two / three machines."],
    firstMove:"For three machines, test the two conditions <i>before</i> anything else &mdash; if neither holds, the G/H reduction is not valid.",

  examples:[
    {id:"m1t25e1", title:"Johnson's rule, worked",
     q:"Six jobs on machines A and B. A times: 4, 8, 3, 6, 7, 5. B times: 6, 3, 7, 2, 8, 4. Find the optimal sequence.",
     steps:[
      "Smallest time anywhere is 2, on machine B for job 4. B means LAST, so job 4 takes the final slot: _ _ _ _ _ 4.",
      "Next smallest among the remaining is 3, twice: job 3 on A (3) and job 2 on B (3). Take job 3 on A — A means EARLIEST, so job 3 takes the first slot: 3 _ _ _ _ 4.",
      "Job 2 on B is 3, so job 2 takes the latest free slot, which is fifth: 3 _ _ _ 2 4.",
      "Next smallest remaining is 4, twice: job 1 on A (4) and job 6 on B (4). Job 1 on A goes as early as possible, second: 3 1 _ _ 2 4.",
      "Job 6 on B goes as late as possible, fourth: 3 1 _ 6 2 4.",
      "Only job 5 remains, taking the third slot: 3 1 5 6 2 4.",
      "Then build the in/out table across A and B to get the total elapsed time and each machine's idle time."],
     answer:"Optimal sequence <b>3 &rarr; 1 &rarr; 5 &rarr; 6 &rarr; 2 &rarr; 4</b>.",
     trap:"The rule is about WHERE in the sequence, not which job is 'best'. A small time on B pushes a job to the END, which feels backwards until you see that it minimises B's waiting at the finish."}
  ],
  practice:[
    {id:"m1t25p1", d:"moderate", q:"When can a three-machine sequencing problem be reduced to two machines, and how?",
     hint:"Two conditions, either one suffices; then two fictitious machines.",
     a:"<p><b>The conditions.</b> The reduction is valid if <b>at least one</b> holds: (a) the minimum processing time on machine A is &ge; the maximum processing time on machine B; or (b) the minimum processing time on machine C is &ge; the maximum processing time on machine B.</p><p>In words: machine B must be the 'small' machine, never the bottleneck. If it can dominate either of the others, the reduction is not valid and Johnson's rule cannot simply be applied.</p><p><b>The reduction.</b> Define two fictitious machines G and H with G<sub>i</sub> = A<sub>i</sub> + B<sub>i</sub> and H<sub>i</sub> = B<sub>i</sub> + C<sub>i</sub> for each job i. Apply Johnson's two-machine rule to the G and H times. The sequence that results is optimal for the original three-machine problem, and the elapsed-time table is then built on the <b>original</b> A, B and C times.</p>"}

  id:"m1t26", m:"m1", type:"problem-solving", priority:"low", los:[3],
  title:"Travelling salesman problem",
  summary:"Solve as an assignment problem, then fix the sub-tours. Not on this paper.",
  whatIs:"<p>A salesman must visit each of n cities <b>once and only once</b> and return to the city he started from, at minimum total distance. With n cities there are (n &minus; 1)! possible tours.</p>",
  concept:"<div class='box warning'><h5>Low priority on this paper</h5><p>Module 1 is theory only for this MSE. Included for completeness.</p></div>"+
    "<h4>Set-up</h4><p>Let c<sub>ij</sub> be the distance, cost or time from city i to city j. The <b>diagonal is set to &infin;</b>, because a salesman cannot travel from a city to itself. Your notes state the condition explicitly: visit each city once and only once, arriving back at the city where he started.</p>"+
    "<h4>The two phases</h4><ol>"+
    "<li><b>Phase I.</b> Solve it first as an <b>assignment problem</b> using the Hungarian method. Then check the TSP condition &mdash; does the assignment form a <b>single closed circuit</b> through all n cities? If yes, the assignment solution is optimal for the TSP too and you are done.</li>"+
    "<li><b>Phase II.</b> If not &mdash; the assignment has broken into two or more disjoint sub-tours &mdash; the solution must be adjusted <b>by inspection</b> to form a single circuit. Your notes also name the iterative procedure and the <b>branch and bound method</b> as alternatives.</li></ol>"+
    "<div class='box tip'><h5>The adjustment in Phase II</h5><p>To merge sub-tours you must bring in a cell that is not zero in the reduced matrix, and you choose the one that adds the <b>least extra cost</b>. In your notes' worked example the cheapest repair adds 4 + 1 = 5 to the reduced total.</p></div>"+
    "<p>The counting fact worth quoting: for 5 cities there are 4! = 24 possible tours, which is why an enumeration approach becomes impossible quickly and the assignment route is used instead.</p>",
  needToKnow:[
    "State the TSP condition — each city once and only once, returning to the start.",
    "Set the diagonal to ∞ and solve as an assignment problem.",
    "Check whether the assignment forms one circuit or several sub-tours.",
    "Repair sub-tours by the cheapest inspection swap."
  ],

    clues:["A square distance matrix with <b>&infin;</b> on the diagonal.","&lsquo;Visit each city once&rsquo; and return to the start.","Cities rather than jobs and workers."],
    wording:["Solve the travelling salesman problem for the given distance matrix.","Find the shortest route visiting each city once and returning to the start."],
    firstMove:"Write &infin; down the diagonal before doing anything else, then run the Hungarian method.",
    trap:"Accepting the assignment solution without checking it forms a <b>single</b> circuit. An assignment of 1&rarr;2, 2&rarr;1, 3&rarr;4, 4&rarr;3 is a perfectly valid assignment and a completely invalid tour."
  },
  examAnswer:{

  mistakes:[

  examples:[
    {id:"m1t26e1", title:"Why an assignment solution can fail the TSP condition",
     q:"A 5-city assignment gives 1→2, 2→1, 3→4, 4→5, 5→3. Is this a valid tour?",
     steps:[
      "Check the assignment is valid: each city appears exactly once as an origin and once as a destination. It does.",

     answer:"No. It is a valid assignment but two disjoint sub-tours, so Phase II must merge them into a single circuit.",

  ],
  practice:[
    {id:"m1t26p1", d:"easy", q:"For 5 cities, how many possible tours are there, and why does that matter?",
     hint:"Fix the starting city; the rest can be permuted.",
     a:"<p>With n cities there are <b>(n &minus; 1)!</b> possible tours, because the starting city can be fixed (a tour is a closed loop, so where you start does not change it) and the remaining n &minus; 1 cities can be visited in any order.</p><p>For n = 5 that is <b>4! = 24</b> different combinations, which your notes state directly.</p><p><b>Why it matters:</b> 24 is small enough to enumerate, but the factorial grows explosively &mdash; 10 cities give 9! = 362,880 tours and 15 cities give over 87 billion. Enumeration is therefore hopeless in general, which is why the problem is attacked as an assignment problem with a sub-tour repair, or by branch and bound.</p>"}

{
  id:"m1t27", m:"m1", type:"problem-solving", priority:"low", los:[5],
  title:"Integer programming — Gomory's cutting plane and branch & bound",
  summary:"Three IPP types, the fractional cut, and the branching tree. Not on this paper.",
  whatIs:"<p>An integer programming problem is an LPP in which some or all of the decision variables must take whole-number values.</p>",
  concept:"<div class='box warning'><h5>Low priority on this paper</h5><p>Module 1 is theory only for this MSE. Included for completeness.</p></div>"+
    "<h4>The three types</h4>"+
    "<div class='tw'><table><tr><th>Type</th><th>Requirement</th></tr>"+
    "<tr><td><b>Pure integer</b></td><td>All decision variables must have integer solutions.</td></tr>"+
    "<tr><td><b>Mixed integer</b></td><td>Some, but not all, of the decision variables must take integer values; the others need not.</td></tr>"+
    "<tr><td><b>0&ndash;1 integer</b></td><td>Variables may take only the value 0 or 1 &mdash; used where decisions are of the yes/no type.</td></tr></table></div>"+
    "<h4>Gomory's cutting plane method</h4><ol>"+
    "<li>Solve the problem as an ordinary LPP by simplex, ignoring the integer requirement.</li>"+
    "<li>If the solution is already all-integer, stop.</li>"+
    "<li>Otherwise take the basic variable with the <b>largest fractional part</b> and use its row as the <b>source row</b>.</li>"+
    "<li>Split every coefficient into an integer part and a fractional part, b<sub>i</sub> = [b<sub>i</sub>] + f<sub>i</sub>, and form the <b>Gomory constraint</b> (the fractional cut) from the fractional parts.</li>"+
    "<li>Add the cut as a new row with a Gomory slack variable, and re-optimise using the <b>dual simplex method</b> &mdash; choose the row with the <b>least negative</b> solution value, compute &theta;, and pivot.</li>"+
    "<li>If the new solution is integer, stop; otherwise repeat from step 3.</li></ol>"+
    "<h4>Branch and bound</h4><ol>"+
    "<li>Solve the LP relaxation. If the answer is integer, stop.</li>"+
    "<li>Pick a variable with a fractional value, say x = 3.33, and <b>branch</b> into two sub-problems: one with x &le; 3 (the <b>lower</b> branch) and one with x &ge; 4 (the <b>upper</b> branch).</li>"+
    "<li>Solve each sub-problem. Each gives a bound on the achievable objective.</li>"+
    "<li>Keep branching on any sub-problem whose solution is still fractional; discard (<b>fathom</b>) any branch whose bound is worse than the best integer solution already found.</li>"+
    "<li>Stop when every branch has been solved or discarded. The best integer solution found is optimal.</li></ol>"+

    {id:"m5t3p1", d:"easy", q:"Set out the full decision procedure for solving any game in your syllabus, as a numbered routine.",

     a:"<p><b>1.</b> Write the row minima to the right of the matrix and the column maxima below it.</p><p><b>2.</b> Compute maximin = max{row minima} and minimax = min{column maxima}.</p><p><b>3.</b> If <b>maximin = minimax</b>, a saddle point exists. The common value is the value of the game V, and both players have pure strategies — name the row and column at which the saddle point occurs. Stop.</p><p><b>4.</b> If <b>maximin &ne; minimax</b>, there is no saddle point and the game is a mixed game. Then:</p><p>&nbsp;&nbsp;<b>4a.</b> If the matrix is 2&times;2, apply the mixed strategy formulas for p, r and V.</p><p>&nbsp;&nbsp;<b>4b.</b> If it is larger, apply the principle of dominance repeatedly until it reduces to 2&times;2, then apply the formulas and write the probability vectors with zeros in the eliminated positions.</p><p><b>5.</b> Interpret: state each player's optimal strategy and say whether the game favours A (V &gt; 0), favours B (V &lt; 0) or is fair (V = 0).</p>"},

    "<h4>&lsquo;In the long run&rsquo; is doing real work</h4><p>The value is defined as the expected winnings if the game is played a large number of times, or as the average or expected game outcome if the game is played an infinite number of times. A single play can go either way; the value is what the average settles to.</p>"+

  practice:[
    {id:"m5t7p1", d:"easy", q:"Define the value of the game in two different ways, both from your notes, and explain why both mention repetition.",

     a:"<p><b>Glossary:</b> the value of the game is the expected winnings of the game if the game is played a large number of times.</p><p><b>Minimax section:</b> the value of the game is the average or expected game outcome if the game is played an infinite number of times.</p><p>Both mention repetition because the value is an <b>expectation</b>, not a guaranteed single-play result. In a pure strategy game every play does deliver the saddle-point payoff, so the distinction is invisible. In a mixed strategy game each player randomises, so any individual play may deliver any entry of the matrix — the value 38/11 in the notes' mixed example is not even one of the four payoffs 4, 2, 1 and 10. It is only the long-run average that equals the value.</p>"},

{
  id:"m5t8", m:"m5", type:"problem-solving", priority:"high", los:[8],
  title:"Mixed strategy for 2×2 games",
  summary:"No saddle point in a 2×2 — set the two expected gains equal and solve for the probabilities.",
  whatIs:"<p>When there is no saddle point, each player plays each strategy a certain percentage of the time. The goal is for a player to randomise so that the expected value of the game does not depend on what the opponent does.</p>",
  concept:"<h4>The idea, in your notes' words</h4><p>The most common way to solve a mixed strategy game is the <b>expected gain or loss approach</b>. The goal is for a player to play each strategy a particular percentage of the time so that the expected value of the game does not depend upon what the opponent does. This will only occur if the expected value of each strategy is the same.</p>"+
    "<h4>Setting it up</h4><p>For the matrix with rows X&#8321;, X&#8322; and columns Y&#8321;, Y&#8322;, let <b>P</b> be the fraction of the time Y plays Y&#8321; and <b>Q</b> the fraction of the time X plays X&#8321;. Write the expected gain for each row and each column, then set each pair equal.</p>"+
    "<div class='box'><h5>The closed formulas</h5><p>For the matrix <span class='mono'>[[a, b], [c, d]]</span> with denominator <span class='mono'>D = a + d &minus; b &minus; c</span>:</p>"+
    "<p class='mono blk'>p  (A plays row 1)   = (d − c) / D\n1 − p (A plays row 2)   = (a − b) / D\nr  (B plays col 1)   = (d − b) / D\n1 − r (B plays col 2)   = (a − c) / D\nV  (value of game)   = (ad − bc) / D</p>"+
    "<p>These are the algebraic result of the equal-expected-value equations, and they agree with every answer key in your folder.</p></div>"+
    "<h4>Checks that catch errors</h4><ul>"+
    "<li>p and 1 &minus; p must both be between 0 and 1, and must sum to 1.</li>"+
    "<li>V must lie strictly between the maximin and the minimax.</li>"+
    "<li>Compute V twice, once from each player's side. They must agree.</li></ul>",
  needToKnow:[
    "Confirm there is no saddle point before using any of this.",
    "Set up and solve the equal-expected-gain equations, or apply the formulas.",
    "Compute V and verify it from both players' sides.",
    "Check the probabilities are legal and lie between the two margins."
  ],
  recognition:{
    clues:["A <b>2&times;2</b> matrix where maximin &ne; minimax.","The words &lsquo;mixed strategy&rsquo; or &lsquo;games with no saddle point&rsquo;.","The answer is expected to include fractions."],
    wording:["Solve the following game.","Solve the game with no saddle point using mixed strategy.","Find p, r and the value of the game."],

  examples:[
    {id:"m5t8e1", title:"The full expected-gain method — the textbook example",
     q:"Solve the mixed strategy game with X₁ = (4, 2) and X₂ = (1, 10).",
     steps:[
      "Saddle-point check first. Row minima: 2 and 1, so maximin = 2. Column maxima: 4 and 10, so minimax = 4. They differ, so there is no saddle point and this is a mixed game.",
      "Let P be the fraction of the time player Y plays Y₁, so 1 − P is the fraction for Y₂. Write X's expected gain under each of X's own strategies. If X plays X₁: 4P + 2(1 − P). If X plays X₂: 1P + 10(1 − P).",
      "Set them equal so that X's expectation does not depend on which row X uses: 4P + 2(1 − P) = 1P + 10(1 − P).",
      "Expand: 4P + 2 − 2P = P + 10 − 10P, so 2P + 2 = −9P + 10, giving 11P = 8 and P = 8/11, with 1 − P = 3/11.",
      "Now let Q be the fraction of the time X plays X₁. Y's expected loss under Y₁ is 4Q + 1(1 − Q) and under Y₂ is 2Q + 10(1 − Q). Setting these equal: 4Q + 1 − Q = 2Q + 10 − 10Q, so 3Q + 1 = −8Q + 10, giving 11Q = 9 and Q = 9/11, with 1 − Q = 2/11.",
      "Compute the value using P: 1P + 10(1 − P) = 1(8/11) + 10(3/11) = 8/11 + 30/11 = 38/11.",
      "Verify from the other side using Q: 4Q + 1(1 − Q) = 4(9/11) + 1(2/11) = 36/11 + 2/11 = 38/11 ✓. The two agree.",
      "Sanity check: 38/11 ≈ 3.45 lies between the maximin 2 and the minimax 4 ✓."],
     answer:"<b>Y plays Y₁ 8/11 of the time and Y₂ 3/11; X plays X₁ 9/11 of the time and X₂ 2/11. V = 38/11 ≈ 3.45.</b>",
     trap:"Your notes round 38/11 to 3.46; the exact value is 38/11 = 3.4545…, so 3.45 to two decimals. Leave the answer as the fraction 38/11 and no rounding question arises."},
    {id:"m5t8e2", title:"The same method on [[4, 2], [0, 10]]",
     q:"Using the solution procedure for a mixed strategy game, solve the game with X₁ = (4, 2) and X₂ = (0, 10).",
     steps:[
      "Saddle-point check: row minima 2 and 0 give maximin = 2; column maxima 4 and 10 give minimax = 4. No saddle point.",
      "The equations for Q, from the two columns: 4Q + 0(1 − Q) = 2Q + 10(1 − Q).",
      "Expand: 4Q = 2Q + 10 − 10Q, so 4Q = −8Q + 10 and 12Q = 10, giving Q = 10/12 = 5/6 and 1 − Q = 2/12 = 1/6.",
      "The equations for P, from the two rows: 4P + 2(1 − P) = 0P + 10(1 − P).",
      "Expand: 4P + 2 − 2P = 10 − 10P, so 2P + 2 = −10P + 10 and 12P = 8, giving P = 8/12 = 2/3 and 1 − P = 4/12 = 1/3.",
      "Value: using Q, V = 4(10/12) + 0(2/12) = 40/12 = 10/3 ≈ 3.33. Check with the other column: 2(10/12) + 10(2/12) = 20/12 + 20/12 = 40/12 ✓.",
      "Cross-check against the formulas: D = 4 + 10 − 2 − 0 = 12; p = (10 − 0)/12 = 10/12 ✓; r = (10 − 2)/12 = 8/12 ✓; V = (40 − 0)/12 = 10/3 ✓."],
     answer:"<b>X plays X₁ 10/12 = 5/6 of the time; Y plays Y₁ 8/12 = 2/3 of the time; V = 10/3.</b>",
     trap:"Your notes present this problem twice, once headed 'Using the solution procedure for a mixed strategy game' and once headed 'By Using Oddments', but both slides show the same matrix and the deck does not set out a separate oddments procedure. Solve it by the expected-gain method above."}
  ],
  practice:[
    {id:"m5t8p1", d:"easy", q:"Solve the game [[12, 4], [3, 7]].",
     hint:"D = a + d − b − c. Check for a saddle point first.",
     a:"<p><b>Saddle-point check:</b> row minima 4 and 3, so maximin = 4. Column maxima 12 and 7, so minimax = 7. Not equal, so no saddle point.</p><p><b>D</b> = 12 + 7 &minus; 4 &minus; 3 = 12.</p><p><b>p</b> = (d &minus; c)/D = (7 &minus; 3)/12 = 4/12 = <b>1/3</b>, so 1 &minus; p = 2/3.<br><b>r</b> = (d &minus; b)/D = (7 &minus; 4)/12 = 3/12 = <b>1/4</b>, so 1 &minus; r = 3/4.<br><b>V</b> = (ad &minus; bc)/D = (84 &minus; 12)/12 = 72/12 = <b>6</b>.</p><p>Check: V = 6 lies between the maximin 4 and the minimax 7 ✓.</p>"},
    {id:"m5t8p2", d:"moderate", q:"Solve the game [[5, −4], [−9, 3]].",
     hint:"Two negative entries. Watch the signs when computing D.",
     a:"<p><b>Saddle-point check:</b> row minima &minus;4 and &minus;9, so maximin = &minus;4. Column maxima 5 and 3, so minimax = 3. Not equal, so no saddle point.</p><p><b>D</b> = 5 + 3 &minus; (&minus;4) &minus; (&minus;9) = 8 + 4 + 9 = 21.</p><p><b>p</b> = (3 &minus; (&minus;9))/21 = 12/21 = <b>4/7</b>, so 1 &minus; p = 3/7.<br><b>r</b> = (3 &minus; (&minus;4))/21 = 7/21 = <b>1/3</b>, so 1 &minus; r = 2/3.<br><b>V</b> = (5&times;3 &minus; (&minus;4)&times;(&minus;9))/21 = (15 &minus; 36)/21 = &minus;21/21 = <b>&minus;1</b>.</p><p>Check: &minus;1 lies between &minus;4 and 3 ✓. Since V is negative the game is favourable to player Y.</p>"},
    {id:"m5t8p3", d:"easy", q:"Solve the game [[10, 4], [6, 8]].",
     hint:"All positive; D is small.",
     a:"<p><b>Saddle-point check:</b> row minima 4 and 6, maximin = 6. Column maxima 10 and 8, minimax = 8. Not equal, no saddle point.</p><p><b>D</b> = 10 + 8 &minus; 4 &minus; 6 = 8.</p><p><b>p</b> = (8 &minus; 6)/8 = 2/8 = <b>1/4</b>, 1 &minus; p = 3/4.<br><b>r</b> = (8 &minus; 4)/8 = 4/8 = <b>1/2</b>, 1 &minus; r = 1/2.<br><b>V</b> = (80 &minus; 24)/8 = 56/8 = <b>7</b>.</p><p>Check: 7 lies between 6 and 8 ✓.</p>"},
    {id:"m5t8p4", d:"moderate", q:"Solve the game [[20, 8], [−2, 10]].",
     hint:"One negative entry in the second row.",
     a:"<p><b>Saddle-point check:</b> row minima 8 and &minus;2, maximin = 8. Column maxima 20 and 10, minimax = 10. Not equal, no saddle point.</p><p><b>D</b> = 20 + 10 &minus; 8 &minus; (&minus;2) = 30 &minus; 8 + 2 = 24.</p><p><b>p</b> = (10 &minus; (&minus;2))/24 = 12/24 = <b>1/2</b>, 1 &minus; p = 1/2.<br><b>r</b> = (10 &minus; 8)/24 = 2/24 = <b>1/12</b>, 1 &minus; r = 11/12.<br><b>V</b> = (200 &minus; (8)(&minus;2))/24 = (200 + 16)/24 = 216/24 = <b>9</b>.</p><p>Check: 9 lies between 8 and 10 ✓. The game strongly favours player X.</p>"},
    {id:"m5t8p5", d:"moderate", q:"Set up the equal-expected-gain equations for [[3, 5], [4, 2]] from first principles, without using the formulas.",
     hint:"Let Q be the probability that A plays row 1, and equate A's expectation under each of B's columns.",
     a:"<p><b>No saddle point:</b> row minima 3 and 2 give maximin = 3; column maxima 4 and 5 give minimax = 4. Not equal.</p><p><b>For A.</b> Let Q be the probability A plays row 1. If B plays column 1, A's expected gain is 3Q + 4(1 &minus; Q). If B plays column 2, it is 5Q + 2(1 &minus; Q). Setting these equal so A's expectation is independent of B's choice: 3Q + 4 &minus; 4Q = 5Q + 2 &minus; 2Q &rArr; &minus;Q + 4 = 3Q + 2 &rArr; 4Q = 2 &rArr; <b>Q = 1/2</b>.</p><p><b>For B.</b> Let P be the probability B plays column 1. Against row 1, B's expected loss is 3P + 5(1 &minus; P); against row 2 it is 4P + 2(1 &minus; P). Equating: 3P + 5 &minus; 5P = 4P + 2 &minus; 2P &rArr; &minus;2P + 5 = 2P + 2 &rArr; 4P = 3 &rArr; <b>P = 3/4</b>.</p><p><b>Value:</b> V = 3(1/2) + 4(1/2) = 3.5 from B's first column; check with the second: 5(1/2) + 2(1/2) = 3.5 ✓. So <b>V = 7/2</b>, which lies between 3 and 4 ✓.</p>"}
  ],

{
  id:"m5t9", m:"m5", type:"problem-solving", priority:"high", los:[7],
  title:"The principle of dominance",
  summary:"Delete rows and columns a player would never use. Rows compare one way, columns the other.",
  whatIs:"<p>A strategy is dominated if the player can always do as well or better by playing another one. Dominated strategies can be deleted without changing the solution.</p>",
  concept:"<h4>The two rules, exactly as your notes state them</h4>"+
    "<div class='box'><p><b>Step 1 (columns).</b> If all the elements of Column&#8209;i are <b>greater than or equal to</b> the corresponding elements of any other Column&#8209;j, then Column&#8209;i is dominated by Column&#8209;j and it is removed from the matrix. <i>Example: if Column&#8209;2 &ge; Column&#8209;4, remove Column&#8209;2.</i></p>"+
    "<p><b>Step 2 (rows).</b> If all the elements of a Row&#8209;i are <b>less than or equal to</b> the corresponding elements of any other Row&#8209;j, then Row&#8209;i is dominated by Row&#8209;j and it is removed from the matrix. <i>Example: if Row&#8209;3 &le; Row&#8209;4, remove Row&#8209;3.</i></p>"+
    "<p><b>Step 3.</b> Repeat steps 1 and 2 if any row or column is dominated; otherwise stop.</p></div>"+
    "<h4>Why the directions differ</h4><p>The matrix holds payoffs to the row player. The row player <b>maximises</b>, so a row that is smaller everywhere is never worth playing — delete the <i>smaller</i> row. The column player <b>minimises</b> the same numbers, so a column that is larger everywhere costs more — delete the <i>larger</i> column.</p>"+
    "<div class='box tip'><h5>One sentence that fixes it forever</h5><p><b>Delete the small row and the big column.</b></p></div>"+
    "<h4>Comparison must be elementwise</h4><p>Every single position must satisfy the inequality. Row 3 = (2, 1, 4, 0) is dominated by Row 4 = (3, 3, 5, 2) because 2&le;3, 1&le;3, 4&le;5 and 0&le;2 — all four. If even one position fails, there is no dominance.</p>"+
    "<h4>What dominance is for</h4><p>Your notes state it plainly: the principle of dominance can be used to <b>reduce the size of games</b> by eliminating strategies that would never be played. It is the bridge from an m&times;n game to a 2&times;2 one you can solve.</p>"+"<div class='box tip'><h5>A third rule your slides do not have &mdash; from OR_Notes.pdf p.4</h5><p><b>3. Modified / average dominance.</b> A row or column can also be eliminated if it is dominated by the <b>average (or weighted average) of two or more other rows or columns</b> &mdash; even though no single row or column dominates it.</p><p>So when plain dominance stalls and the matrix is still bigger than 2&times;2, average the two most promising rows (or columns) and compare the result against the remaining one. This is the standard next move in a game that looks irreducible.</p></div>"+"<p>Your notes also state the two basic rules in the cleanest form available: <b>Row dominance (player A)</b> &mdash; if every entry in Row&nbsp;i is greater than or equal to the corresponding entry in Row&nbsp;k, then Row&nbsp;k is dominated and can be deleted. <b>Column dominance (player B)</b> &mdash; if every entry in column&nbsp;j is less than or equal to the corresponding entry in column&nbsp;m, then column&nbsp;m is dominated and can be deleted, since B wants to minimise loss.</p>",
  needToKnow:[
    "State all three rules — row, column, and average/modified dominance.",
    "Apply the comparison elementwise across every position.",
    "Alternate between rows and columns until no further reduction is possible.",
    "Explain why rows and columns compare in opposite directions."
  ],

  examples:[
    {id:"m5t9e1", title:"Two clean reductions from your notes",
     q:"Reduce (a) [[4, 3], [2, 20], [1, 1]] and (b) [[−5, 4, 6, −3], [−2, 6, 2, −20]].",
     steps:[
      "(a) Compare the rows. X₃ = (1, 1). Against X₁ = (4, 3): 1 ≤ 4 and 1 ≤ 3, so X₃ ≤ X₁ elementwise and X₃ is dominated.",

  practice:[
    {id:"m5t9p1", d:"easy", q:"State both dominance rules with their inequality directions, and explain in one line why they point opposite ways.",
     hint:"Whose payoffs are in the matrix?",
     a:"<p><b>Column rule:</b> if all the elements of Column-i are greater than or equal to the corresponding elements of any other Column-j, then Column-i is dominated by Column-j and is removed.</p><p><b>Row rule:</b> if all the elements of Row-i are less than or equal to the corresponding elements of any other Row-j, then Row-i is dominated by Row-j and is removed.</p><p><b>Why they differ:</b> the matrix records payoffs <i>to the row player</i>. The row player maximises those numbers, so a row that is everywhere smaller can never be worth playing and is deleted. The column player is paying those same numbers and therefore minimises them, so a column that is everywhere larger is more expensive and is deleted. In short: <b>delete the small row and the big column</b>.</p>"},
    {id:"m5t9p3", d:"hard", q:"In the game [[6,7,8],[9,4,5],[2,9,10]] no single row dominates another. Show that row 1 is dominated by the average of rows 2 and 3.",
     hint:"Average rows 2 and 3 entry by entry, then compare that average against row 1.",
     a:"<p><b>Check plain dominance first.</b> Row 1 = (6,7,8), Row 2 = (9,4,5), Row 3 = (2,9,10). Row 1 vs Row 2: 6&lt;9 but 7&gt;4 — no dominance. Row 1 vs Row 3: 6&gt;2 but 7&lt;9 — no dominance. Row 2 vs Row 3: 9&gt;2 but 4&lt;9 — no dominance. Plain dominance is exhausted.</p><p><b>Now apply modified/average dominance.</b> Average rows 2 and 3 entry by entry:</p><p class='mono blk'>(9+2)/2 = 5.5   (4+9)/2 = 6.5   (5+10)/2 = 7.5</p><p>Compare row 1 = (6, 7, 8) against that average (5.5, 6.5, 7.5): 6 &ge; 5.5 ✓, 7 &ge; 6.5 ✓, 8 &ge; 7.5 ✓.</p><p>Row 1 is greater than or equal to the average in <b>every</b> position, so by row dominance it is the average that is dominated — meaning player A can do at least as well by mixing rows 2 and 3 as by playing row 1&hellip; but the rule as your notes state it deletes the <i>dominated</i> one. Here row 1 <b>dominates</b> the mixture, so rows 2 and 3 cannot both be discarded; instead this tells you row 1 is worth keeping.</p><p><b>The reverse case is the useful one:</b> if row 1 had been (5, 6, 7), it would be &le; the average (5.5, 6.5, 7.5) everywhere, so row 1 would be dominated by the 50-50 mixture of rows 2 and 3 and could be deleted — even though neither row 2 nor row 3 dominates it on its own. That is exactly what modified dominance buys you.</p>"},
    {id:"m5t9p2", d:"moderate", q:"In the matrix [[4, 2, 3, 6], [3, 4, 7, 5], [6, 3, 5, 4]], show why column III is deleted and column II is not.",
     hint:"Compare column III against column II position by position.",
     a:"<p><b>Column III = (3, 7, 5) and Column II = (2, 4, 3).</b> Compare elementwise: 3&ge;2 ✓, 7&ge;4 ✓, 5&ge;3 ✓. Every element of Column III is greater than or equal to the corresponding element of Column II, so <b>Column III is dominated by Column II</b> and player B discards strategy 3 — B would always rather pay the smaller amounts in Column II.</p><p><b>Column II is not deleted</b> because nothing dominates it. Against Column I = (4, 3, 6): 2&le;4, 4&ge;3 — the comparison fails at the second position, so neither dominates the other. Against Column IV = (6, 5, 4): 2&le;6, 4&le;5, 3&le;4 — here Column II is smaller everywhere, which means Column II <i>dominates</i> Column IV, so IV goes next, not II.</p><p>Dominance is a one-way relation, and the smaller column is the survivor.</p>"}

  whatIs:"<p>Given &lambda; and &mu; for a single-server model, five formulas give every performance measure the exam can ask for. There is no method to choose and no algorithm to run &mdash; only substitution.</p>",
  concept:"<div class='box tip'><h5>The whole module, in one block</h5>"+
    "<p class='mono blk'>rho = lambda / mu                          utilisation\nP(0) = 1 - rho                             idle / system empty\nP(n) = rho^n * (1 - rho)                   exactly n in system\n\nLs  = lambda / (mu - lambda)               customers IN SYSTEM\nLq  = lambda^2 / (mu (mu - lambda))        customers IN QUEUE\nWs  = 1 / (mu - lambda)                    waiting time IN SYSTEM\nWq  = lambda / (mu (mu - lambda))          waiting time IN QUEUE\nLq' = mu / (mu - lambda)                   expected length of NON-EMPTY queue</p></div>"+

  id:"m5t11", m:"m5", type:"problem-solving", priority:"high", los:[8],
  title:"Oddments method for 2×2 mixed games",
  summary:"The notes' second method: cross-differences give the probabilities directly, with no equations to solve.",
  whatIs:"<p>The oddments method gets the same answer as the expected-gain method with no algebra at all &mdash; just four subtractions. Your class notes teach it as &ldquo;2nd Method&rdquo; on 18-7-26.</p>",
  concept:"<div class='box tip'><h5>Why this topic matters more than its size suggests</h5>"+
    "<p>The slide deck has a slide headed <b>&ldquo;By Using Oddments&rdquo;</b> but never shows the procedure. Your <b>handwritten notes do</b>. That combination &mdash; named in the slides, worked in the notes &mdash; is the strongest signal in the whole folder that a topic is examinable.</p></div>"+
    "<h4>The rule, as the notes state it</h4>"+
    "<p><i>&ldquo;Calculate oddments: take the higher value in that row and subtract it from the min value.&rdquo;</i> and crucially <i>&ldquo;the 1st row oddment ki value hum 2nd row ke aage likhenge&rdquo;</i> &mdash; <b>the oddment computed from one row is written against the other row</b>. That cross-over is the whole method.</p>"+
    "<h4>The procedure &mdash; four steps</h4>"+
    "<p>For the matrix <span class='mono'>[[a, b], [c, d]]</span> with rows X&#8321;, X&#8322; and columns Y&#8321;, Y&#8322;:</p><ol>"+
    "<li><b>Row oddments.</b> Take the absolute difference across each row, then <b>swap</b> them.<br>"+
    "<span class='mono'>oddment written against X&#8321; = |c &minus; d| &nbsp;&nbsp; oddment against X&#8322; = |a &minus; b|</span></li>"+
    "<li><b>Column oddments.</b> Take the absolute difference down each column, then swap.<br>"+
    "<span class='mono'>oddment against Y&#8321; = |b &minus; d| &nbsp;&nbsp; oddment against Y&#8322; = |a &minus; c|</span></li>"+
    "<li><b>Probabilities.</b> Each oddment over the sum of its pair.<br>"+
    "<span class='mono'>P&#8321; = odd(X&#8321;)/[odd(X&#8321;)+odd(X&#8322;)] &nbsp; and so on</span></li>"+
    "<li><b>Value of the game.</b> Take any row or column and weight it by the <i>other</i> player's oddments:<br>"+
    "<span class='mono'>V = (row entries &times; column oddments) / (sum of column oddments)</span></li></ol>"+
    "<h4>The notes' worked example</h4>"+
    "<p>Matrix <span class='mono'>[[4, 2], [0, 10]]</span>:</p>"+
    "<div class='tw'><table><tr><th></th><th>Y&#8321;</th><th>Y&#8322;</th><th>Row oddment</th><th>Probability</th></tr>"+
    "<tr><td><b>X&#8321;</b></td><td>4</td><td>2</td><td>|0&minus;10| = <b>10</b></td><td>P&#8321; = 10/12 = <b>5/6</b></td></tr>"+
    "<tr><td><b>X&#8322;</b></td><td>0</td><td>10</td><td>|4&minus;2| = <b>2</b></td><td>P&#8322; = 2/12 = <b>1/6</b></td></tr>"+
    "<tr><td><b>Col oddment</b></td><td>|2&minus;10| = <b>8</b></td><td>|4&minus;0| = <b>4</b></td><td></td><td></td></tr>"+
    "<tr><td><b>Probability</b></td><td>8/12 = <b>2/3</b></td><td>4/12 = <b>1/3</b></td><td></td><td></td></tr></table></div>"+
    "<p>Value, from the second row weighted by the column oddments: V = (0&times;8 + 10&times;4)/(8+4) = 40/12 = <b>10/3</b>.</p>"+
    "<p>The notes give the answer as X = (5/6, 1/6) and Y = (2/3, 1/3), with V = 10/3 &asymp; 3.3.</p>"+
    "<div class='box'><h5>Cross-check against the formula method</h5><p>D = 4 + 10 &minus; 2 &minus; 0 = 12; p = (10&minus;0)/12 = 10/12 ✓; r = (10&minus;2)/12 = 8/12 ✓; V = (40&minus;0)/12 = 10/3 ✓. The two methods are algebraically identical &mdash; oddments is just the formula with the arithmetic done in a different order.</p></div>",
