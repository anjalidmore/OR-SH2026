<title>OR MSE Study Guide</title>
<style>

}

}
:root[data-theme="dark"]{
  --bg:#131414; --surface:#1b1c1c; --text:#e8e8e6; --muted:#a0a4a1;
  --border:#2e3030; --border-2:#262828;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:.875rem; line-height:1.6; overflow-x:hidden;
}
img{max-width:100%}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---- nav ---- */
#nav{
  position:-webkit-sticky; position:sticky; top:0; z-index:100;
  background:var(--surface); border-bottom:1px solid var(--border);
  box-shadow:0 1px 8px rgba(0,0,0,.06);
}
.navin{max-width:880px; margin:0 auto; padding:0 18px; display:flex; align-items:center; gap:14px}
#brand{
  background:none; border:0; color:var(--text); font:700 .92rem/1 inherit;
  padding:9px 0; cursor:pointer; white-space:nowrap; font-family:inherit;
}
#tabs{display:flex; gap:4px; overflow-x:auto; flex:1; scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{
  background:none; border:0; border-bottom:2px solid transparent; color:var(--muted);
  font:400 .78rem/1 inherit; font-family:inherit; padding:9px 7px; cursor:pointer;
  white-space:nowrap; min-height:32px;
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"],.tab.on{color:var(--accent); border-bottom-color:var(--accent); font-weight:700}
.iconbtn{
  background:none; border:1px solid var(--border); border-radius:7px; color:var(--muted);
  font:400 .7rem/1 inherit; font-family:inherit; padding:7px 7px; cursor:pointer;
  min-width:32px; min-height:32px;
}
.iconbtn:hover{color:var(--text); border-color:var(--muted)}
.navtools{display:flex; gap:4px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---- layout ---- */
main{max-width:880px; margin:0 auto; padding:22px 18px 80px}
h1{font-size:1.5rem; font-weight:700; line-height:1.25; margin:0 0 4px}
h2{
  font-size:1.05rem; font-weight:700; margin:1.6rem 0 9px;
  padding-top:14px; border-top:1px solid var(--border);
}
h3{font-size:.92rem; font-weight:700; margin:14px 0 4px}
h4{font-size:.86rem; font-weight:700; margin:9px 0 4px}
h5{font-size:.78rem; font-weight:700; margin:0 0 4px}
p{margin:0 0 9px}
ul,ol{margin:0 0 9px; padding-left:22px}
li{margin:0 0 4px}
a{color:var(--accent)}
.lead{color:var(--muted); margin:0 0 14px}
.small{font-size:.78rem}
.muted{color:var(--muted)}
.back{
  background:none; border:0; color:var(--accent); font:400 .78rem/1 inherit; font-family:inherit;
  padding:7px 0; cursor:pointer; min-height:32px; display:inline-block;
}

/* ---- components ---- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px; margin:0 0 9px;
}
.card.hi{border-left:3px solid var(--accent)}
.box{
  border-left:4px solid var(--muted); border-radius:0 7px 7px 0;
  padding:9px 14px; margin:0 0 9px; background:var(--surface);
  background:color-mix(in srgb, var(--muted) 6%, var(--surface));
}
.box.mistake{border-left-color:var(--bad); background:var(--surface); background:color-mix(in srgb, var(--bad) 6%, var(--surface))}
.box.warning{border-left-color:var(--warn); background:var(--surface); background:color-mix(in srgb, var(--warn) 6%, var(--surface))}
.box.tip{border-left-color:var(--good); background:var(--surface); background:color-mix(in srgb, var(--good) 6%, var(--surface))}
.box p:last-child,.box ul:last-child,.box ol:last-child{margin-bottom:0}
.pill{
  display:inline-block; font-size:.7rem; line-height:1.5; padding:2px 8px;
  border:1px solid var(--border); border-radius:999px; color:var(--muted);
  white-space:nowrap; margin:0 4px 0 0;
}
.pill.p-high{border-color:var(--accent); color:var(--accent)}
.bar{height:6px; border-radius:999px; background:var(--border-2); overflow:hidden}
.bar>i{display:block; height:100%; border-radius:999px; background:var(--good)}
.bar>i.b-bad{background:var(--bad)}
.bar>i.b-warn{background:var(--warn)}
.dot{
  display:inline-block; width:9px; height:9px; border-radius:999px;
  background:var(--border-2); border:1px solid var(--border); flex:none;
}
.dot.s-progress{background:var(--warn); border-color:var(--warn)}
.dot.s-done{background:var(--good); border-color:var(--good)}
.tcard{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px; margin:0 0 9px;
}
.tcard.hi{border-left:3px solid var(--accent)}
.trow{display:flex; align-items:center; gap:7px; margin:0 0 4px}
.trow h3{margin:0; flex:1}
.qmeter{display:flex; align-items:center; gap:9px; margin-top:9px}
.qmeter .bar{flex:1; min-width:60px}
.qmeter .qn{font-size:.78rem; color:var(--muted); white-space:nowrap}
.btn{
  background:var(--surface); border:1px solid var(--border); border-radius:7px;
  color:var(--text); font:400 .78rem/1 inherit; font-family:inherit;
  padding:7px 9px; cursor:pointer; min-height:32px;
}
.btn:hover{border-color:var(--muted)}
.btn.on{border-color:var(--accent); color:var(--accent); font-weight:700}
.btn.pri{border-color:var(--accent); color:var(--accent); font-weight:700}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px;
}
.stat .num{font-size:1.5rem; font-weight:800; color:var(--accent); line-height:1.1}
.stat .lab{font-size:.78rem; font-weight:700; margin:4px 0 0}
.stat .sub{font-size:.78rem; color:var(--muted); margin:0 0 9px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:0 0 14px}
.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin:0 0 9px}
@media (max-width:620px){.grid3,.grid2{grid-template-columns:1fr}}
.subtabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin:0 0 14px}
.btnrow{display:flex; gap:7px; flex-wrap:wrap; margin:9px 0 0}
.reveal{margin-top:9px; padding-top:9px; border-top:1px solid var(--border-2)}
.tw{overflow-x:auto; margin:0 0 9px}
table{border-collapse:collapse; font-size:.78rem; min-width:100%}
th,td{border:1px solid var(--border); padding:4px 7px; text-align:left; vertical-align:top}
th{font-weight:700; background:var(--border-2)}
.mono.blk{
  display:block; white-space:pre; overflow-x:auto; background:var(--border-2);
  border-radius:7px; padding:9px; font-size:.78rem; margin:0 0 9px;
}
#toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:7px 14px; border-radius:7px;
  font-size:.78rem; z-index:200; opacity:0; transition:opacity 120ms; pointer-events:none;
  max-width:90vw; text-align:center;
}
#toast.on{opacity:1}
#searchwrap{display:none; padding:9px 0 0}
#searchwrap.on{display:block}
#q{
  width:100%; padding:9px; border:1px solid var(--border); border-radius:7px;
  background:var(--surface); color:var(--text); font:400 .875rem/1.4 inherit; font-family:inherit;
}
.sres{
  display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--border); border-radius:7px; padding:9px; margin:0 0 4px;
  cursor:pointer; color:var(--text); font:400 .78rem/1.5 inherit; font-family:inherit;
}
.sres:hover{border-color:var(--accent)}
.sres b{color:var(--accent)}
.crumb{font-size:.7rem; color:var(--muted); display:block}
.qrow{
  display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--border-2);
}
.qrow:last-child{border-bottom:0}
.qrow .t{flex:1; min-width:0}
.exrow{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid var(--border-2); flex-wrap:wrap}
.exrow:last-child{border-bottom:0}
.exrow .t{flex:1; min-width:140px}
.opt{
  display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--border); border-radius:7px; padding:9px; margin:0 0 4px;
  cursor:pointer; color:var(--text); font:400 .82rem/1.5 inherit; font-family:inherit; min-height:32px;
}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--accent)}
.opt.ok{border-color:var(--good); background:var(--surface); background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.opt.no{border-color:var(--bad); background:var(--surface); background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.opt[disabled]{cursor:default}
[hidden]{display:none !important}
</style>
</head>

    "<div class='tw'><table><tr><th>Term</th><th>Definition</th></tr>"+
    "<tr><td><b>Objective function</b></td><td>A linear function Z = ax + by, where a and b are constants, which has to be maximized or minimized.</td></tr>"+
    "<tr><td><b>Decision variables</b></td><td>The variables x and y in the objective function.</td></tr>"+
    "<tr><td><b>Constraints</b></td><td>The linear inequalities or equations or restrictions on the variables of an LPP.</td></tr>"+
    "<tr><td><b>Non-negative restrictions</b></td><td>The conditions x &ge; 0, y &ge; 0.</td></tr>"+
    "<tr><td><b>Optimization problem</b></td><td>A problem which seeks to maximize or minimize a linear function subject to certain constraints determined by a set of linear inequalities.</td></tr>"+
    "<tr><td><b>Feasible region</b></td><td>The common region determined by all the constraints including the non-negative constraints. Also called the solution region.</td></tr>"+
    "<tr><td><b>Infeasible region</b></td><td>The region other than the feasible region.</td></tr>"+
    "<tr><td><b>Feasible solution</b></td><td>Points within <i>and on the boundary of</i> the feasible region.</td></tr>"+
    "<tr><td><b>Infeasible solution</b></td><td>Any point outside the feasible region.</td></tr>"+
    "<tr><td><b>Optimal (feasible) solution</b></td><td>Any point in the feasible region that gives the optimal value of the objective function.</td></tr></table></div>"+
    "<p><b>What the words mean:</b> <i>linear</i> implies that all the mathematical relations used in the problem are linear relations; <i>programming</i> refers to the method of determining a particular programme or plan of action.</p>"+
    "<h4>The three named types of LPP</h4><ul>"+
    "<li><b>Manufacturing problems</b> — determine the number of units of different products a firm should produce and sell, when each product requires fixed manpower, machine hours, labour hours per unit, warehouse space per unit, in order to make maximum profit.</li>"+

  title:"Slack, surplus and artificial variables",
  summary:"Which variable each constraint direction needs, what it means physically, and its cost in the objective.",
  whatIs:"<p>Simplex only works on equations. Slack, surplus and artificial variables are what convert inequality constraints into equalities so the table can be built.</p>",
  concept:"<div class='tw'><table><tr><th>Constraint</th><th>Do this</th><th>Meaning</th><th>Coefficient in Z</th></tr>"+
    "<tr><td>&le;</td><td><b>Add</b> a slack variable s</td><td>Unused resource</td><td>0</td></tr>"+
    "<tr><td>&ge;</td><td><b>Subtract</b> a surplus variable s, then <b>add</b> an artificial variable a</td><td>Surplus = the excess above the constraint requirement level</td><td>Surplus 0; artificial &plusmn;M</td></tr>"+
    "<tr><td>=</td><td><b>Add</b> an artificial variable a</td><td>No physical meaning — a starting basis only</td><td>&plusmn;M</td></tr></table></div>"+
    "<p>Your notes state it directly: a slack variable is a variable added to a &le; constraint to convert it to an equation, and it indicates unused resources; a surplus variable is subtracted from a &ge; constraint, and it represents an excess above a constraint requirement level. Both contribute nothing to the calculated value of the objective function.</p>"+
    "<h4>The sign of M</h4><p>The artificial variable is priced so badly that the optimizer is forced to drive it to zero. Your notes put it as: the value for slack variables should be zero, and the value for artificial variables should be maximum, i.e. M. In a <b>minimisation</b> written as Min Z = &hellip; + Ma₁ + Ma₂, the +M penalises the artificial. In a <b>maximisation</b> the same penalty is written as &minus;MA₁, as your handwritten notes do: Max Z = 3x₁ &minus; x₂ + 0S₁ + 0S₂ + 0S₃ &minus; MA₁.</p>"+
    "<h4>How many of each</h4><p>One slack per &le; constraint, one surplus <i>and</i> one artificial per &ge; constraint, one artificial per = constraint. Count them before you draw the table — the number of columns is fixed by this count.</p>"+
    "<div class='box warning'><h5>A wording caution in your notes</h5><p>One slide heads the section &lsquo;Surplus/Artificial Variables&rsquo; and another writes &lsquo;For Constraints &ge;: Subtract Surplus/ Slack Variables&rsquo;. The two words are used loosely there. The operation is what matters and it is unambiguous: <b>&le; adds, &ge; subtracts and then adds an artificial</b>.</p></div>",

{
  id:"m1t9", m:"m1", type:"theory", priority:"high", los:[1],
  title:"Duality — the primal–dual relationship",
  summary:"What the dual is, the four correspondences between primal and dual, and why the two optima are equal.",
  whatIs:"<p>Every linear programme has a partner problem built from the same numbers, read the other way round. The original is the <b>primal</b>; the partner is the <b>dual</b>.</p>",
  concept:"<h4>The four rules in your notes</h4><ol>"+
    "<li>The original objective function problem is called the <b>primal</b>. The transposed objective function problem is called the <b>dual</b>.</li>"+
    "<li>A <b>maximization</b> problem in the primal becomes a <b>minimization</b> problem in the dual, and vice versa.</li>"+
    "<li>The <b>coefficients</b> of the objective function of the primal become the <b>constants</b> B₁, B₂ … in the objective function of the dual. The <b>constants</b> B₁, B₂ … in the constraints of the primal become the <b>coefficients</b> C₁, C₂ … in the dual.</li>"+
    "<li>If the primal has <b>n variables and m constraints</b>, the dual will have <b>m variables and n constraints</b>.</li></ol>"+
    "<h4>The general pair</h4>"+
    "<div class='grid2'><div class='card'><h5>Primal</h5><p class='mono blk'>Max Z = C₁x₁ + C₂x₂ + …\ns.t.  A₁₁x₁ + A₁₂x₂ ≤ B₁\n      A₂₁x₁ + A₂₂x₂ ≤ B₂\n      x₁, x₂ ≥ 0</p></div>"+
    "<div class='card'><h5>Dual</h5><p class='mono blk'>Min W = B₁y₁ + B₂y₂ + …\ns.t.  A₁₁y₁ + A₁₂y₂ ≥ C₁\n      A₂₁y₁ + A₂₂y₂ ≥ C₂\n      y₁, y₂ ≥ 0</p></div></div>"+
    "<p>Notice what happens to the inequality signs along with the objective: <b>Max with &le;</b> pairs with <b>Min with &ge;</b>. That is why the standardisation step matters — see the note below.</p>"+
    "<h4>Why it is worth doing</h4><p>Your notes give the practical reason: the dual simplex approach is useful for solving complex problems with more than two constraints. A primal with five constraints and two variables becomes a dual with two constraints and five variables — a much shorter table to iterate.</p>"+
    "<div class='box tip'><h5>Strong duality, seen in your own worked example</h5><p>In the duality example in your notes the primal minimum and the dual maximum are both <b>800</b>. That equality of optimal objective values is what learning outcome 1 calls <i>strong duality</i>. The two problems do not have the same solution vector — only the same optimal value.</p></div>",

  examples:[
    {id:"m1t9e1", title:"Predicting the dual's shape before writing it",
     q:"A primal is Max Z = 4x₁ + 5x₂ subject to 3x₁ + x₂ &le; 15, x₁ + 2x₂ &le; 10, 5x₁ + 2x₂ &le; 20, x₁, x₂ &ge; 0. Without writing the dual out, state its sense, size and objective coefficients.",
     steps:[
      "Count the primal: n = 2 variables, m = 3 constraints.",
      "Sense: the primal is a maximisation, so the dual is a minimisation.",
      "Size: the dual has m = 3 variables (y₁, y₂, y₃) and n = 2 constraints.",
      "Objective coefficients of the dual: the primal's constraint constants, in order — 15, 10 and 20. So Min W = 15y₁ + 10y₂ + 20y₃.",

      "Check against the written answer: Min W = 15y₁ + 10y₂ + 20y₃ subject to 3y₁ + y₂ + 5y₃ &ge; 4, y₁ + 2y₂ + 2y₃ &ge; 5, y₁, y₂, y₃ &ge; 0."],

  practice:[
    {id:"m1t9p1", d:"easy", q:"State the four rules relating a primal to its dual, and use them to say what the dual of a minimisation with 4 variables and 2 constraints looks like.",
     hint:"Rule 4 gives the shape; rule 2 gives the sense.",
     a:"<p><b>The rules:</b> (1) the original objective function problem is the primal, the transposed one is the dual; (2) a maximisation in the primal becomes a minimisation in the dual and vice versa; (3) the objective coefficients of the primal become the constants in the dual objective, and the constraint constants of the primal become the coefficients in the dual constraints; (4) if the primal has n variables and m constraints, the dual has m variables and n constraints.</p><p><b>Applied:</b> a minimisation with n = 4 variables and m = 2 constraints has a dual that is a <b>maximisation with 2 variables and 4 constraints</b>. The primal's minimisation with &ge; constraints becomes a maximisation with &le; constraints.</p>"},
    {id:"m1t9p2", d:"moderate", q:"Your notes solve a primal and its dual and get 800 both times. What is that result called, and what does it not tell you?",
     hint:"Look carefully at whether the x-values matched the y-values.",
     a:"<p>The equality of the two optimal objective values is <b>strong duality</b> — named explicitly in course outcome 1. In the worked example the primal Min Z = 25x₁ + 10x₂ (with x₁ + x₂ = 50, x₁ &ge; 20, x₂ &le; 40) has optimum Z = 800 at x₁ = 20, x₂ = 30, while the dual Max W = 50y₁ + 20y₂ &minus; 40y₃ has optimum W = 800 at y₁ = 10, y₂ = 15, y₃ = 0.</p><p>What it does <b>not</b> tell you is the primal's solution vector: (20, 30) and (10, 15, 0) are different points in different spaces. Strong duality equates the two optimal <i>values</i> only. To recover the primal variables from the dual's final table you read the magnitudes of Cⱼ &minus; Zⱼ under the slack columns — which in that example are 20 and 30, exactly the primal answer.</p>"}

{
  id:"m1t10", m:"m1", type:"problem-solving", priority:"high", los:[],
  title:"Mathematical formulation of an LPP",
  summary:"Turning a word problem into variables, an objective function and constraints. Everything else depends on it.",
  whatIs:"<p>Formulation is the translation step: read a paragraph about tables, chairs, vitamins or hectares and produce four lines of algebra. Your folder contains seven formulation problems, which makes this the most heavily exemplified skill in Module 1.</p>",
  concept:"<h4>The routine</h4><ol>"+
    "<li><b>Name the decision variables.</b> Write &lsquo;Let x = &hellip;&rsquo; and &lsquo;Let y = &hellip;&rsquo; with units. This sentence earns marks on its own.</li>"+
    "<li><b>Build a data table</b> with one row per activity and one column per resource. Your notes do this explicitly for the diet problem. The table <i>is</i> the constraint set, transposed.</li>"+
    "<li><b>Write the objective function.</b> Profit or revenue → Maximize; cost → Minimize.</li>"+
    "<li><b>Write one constraint per limited resource or per requirement.</b> Resource available → &le;. Requirement to be met → &ge;.</li>"+
    "<li><b>Write the non-negativity condition.</b> x &ge; 0, y &ge; 0.</li>"+
    "<li><b>Simplify.</b> Divide a constraint through by a common factor: 2500x + 500y &le; 50000 becomes 5x + y &le; 100.</li></ol>"+
    "<h4>The direction rule</h4>"+
    "<div class='tw'><table><tr><th>Words in the question</th><th>Sign</th></tr>"+
    "<tr><td>has, available, at most, capacity, storage of, budget of, maximum labour hours</td><td>&le;</td></tr>"+
    "<tr><td>at least, must contain, minimum, requirement, no less than</td><td>&ge;</td></tr>"+
    "<tr><td>exactly, all of, the whole of</td><td>=</td></tr></table></div>"+
    "<h4>Units are the check</h4><p>Every term in one constraint must be in the same unit. In the manufacturing problem, 9x + 12y &le; 180 is labour-hours per week on both sides; x + 3y &le; 30 is finishing hours. If a term does not carry the unit of its constraint, the coefficient is in the wrong constraint.</p>",

    "Choose Max or Min from the words profit/revenue vs cost.",
    "Choose &le; or &ge; from the resource-vs-requirement wording.",

  title:"Graphical method — the corner point method",
  summary:"Plot the constraints, find the vertices, evaluate Z at each. The whole method is four steps.",
  whatIs:"<p>For a two-variable LPP the feasible region is a polygon. The optimum always sits at a corner, so evaluating Z at every corner is enough.</p>",
  concept:"<h4>The corner point method, as your notes state it</h4><ol>"+
    "<li>Find the feasible region of the LPP and determine its corner points (vertices), either by inspection or by solving the two equations of the lines intersecting at that point.</li>"+
    "<li>Evaluate the objective function Z = ax + by at each corner point. Let M and m denote the largest and smallest of these values.</li>"+
    "<li>When the feasible region is <b>bounded</b>, M and m are the maximum and minimum values of Z.</li>"+
    "<li>When the feasible region is <b>unbounded</b>, an extra check is needed — see the separate topic on unbounded regions.</li></ol>"+
    "<h4>Plotting a constraint in three moves</h4><p>For ax + by &le; c: set x = 0 to get the y-intercept c/b; set y = 0 to get the x-intercept c/a; join them and shade the side containing the origin (test (0,0) in the inequality — if it satisfies, shade towards it).</p>"+
    "<h4>Finding the interior corner</h4><p>The corner where two constraint lines cross is found by solving those two equations simultaneously. This is the corner that is almost always optimal, and it is the one that cannot be read off by inspection.</p>"+
    "<div class='box tip'><h5>Always tabulate</h5><p>Write a two-column table — corner point | value of Z — and fill it in. Your notes present every worked example this way, and a table makes an arithmetic slip visible.</p></div>",
  needToKnow:[
    "Plot a constraint from its two intercepts and shade the correct side.",
    "Identify every vertex of the feasible region, solving simultaneously for the interior one.",
    "Tabulate Z at each vertex and pick the extreme value.",
    "State whether the region is bounded before concluding."
  ],

  examples:[
    {id:"m1t11e1", title:"Example 1 — Maximise Z = 4x + y",

      "Test (0,0) in both: 0 ≤ 50 ✓ and 0 ≤ 90 ✓, so the feasible region contains the origin and is bounded.",
      "Corner points: O(0,0), A(30,0) — the tighter of the two x-intercepts — B, the intersection, and C(0,50) — the tighter of the two y-intercepts.",

      "The largest value is 120."],

    {id:"m1t11e2", title:"Example 3 — a maximum attained at two corners",
     q:"Minimise and maximise Z = 3x + 9y subject to x + 3y ≤ 60, x + y ≥ 10, x ≤ y, x ≥ 0, y ≥ 0.",

      "The feasible region ABCD is bounded. Its corner points are A(0, 10), B(5, 5), C(15, 15) and D(0, 20).",

  practice:[
    {id:"m1t11p1", d:"easy", q:"Solve graphically: Minimise Z = 200x + 500y subject to x + 2y ≥ 10, 3x + 4y ≤ 24, x ≥ 0, y ≥ 0.",

     a:"<p>The feasible region ABC is bounded. Corner points: A(0, 5) — from x + 2y = 10 at x = 0; B(4, 3) — solving x + 2y = 10 with 3x + 4y = 24: multiply the first by 2 to get 2x + 4y = 20, subtract from the second to get x = 4, then y = 3; C(0, 6) — from 3x + 4y = 24 at x = 0.</p><p>Evaluate: Z(0,5) = 2500; Z(4,3) = 800 + 1500 = 2300; Z(0,6) = 3000.</p><p><b>Minimum Z = 2300 at the point (4, 3).</b> Because the region is bounded, this is final — no open-half-plane check is needed.</p>"},
    {id:"m1t11p2", d:"moderate", q:"Solve graphically: Maximise Z = 10500x + 9000y subject to x + y ≤ 50, 2x + y ≤ 80, x ≥ 0, y ≥ 0. State the answer as a land-allocation decision.",

    {id:"m1t11p3", d:"moderate", q:"Solve graphically: Maximise Z = 250x + 75y subject to 5x + y ≤ 100, x + y ≤ 60, x ≥ 0, y ≥ 0. Then say why buying only tables, or only chairs, is worse.",
     hint:"Compute Z at the two axis corners as well as at the intersection.",
     a:"<p>Corners: O(0,0), A(20,0) from 5x = 100, B the intersection, C(0,60) from x + y = 60 (note 0 + 60 = 60 &le; 60 and 5(0) + 60 = 60 &le; 100, so C is feasible).</p><p>B: solve 5x + y = 100 and x + y = 60. Subtracting gives 4x = 40, so x = 10 and y = 50.</p><p>Evaluate: Z(0,0) = 0; Z(20,0) = 5000; Z(10,50) = 2500 + 3750 = 6250; Z(0,60) = 4500.</p><p><b>Maximum Z = Rs 6250 at (10, 50)</b> — buy 10 tables and 50 chairs.</p><p><b>Why the pure strategies lose:</b> buying only tables spends the whole Rs 50,000 on 20 tables for Rs 5000 profit, using only 20 of the 60 storage slots. Buying only chairs could afford 100 chairs but storage caps it at 60, giving Rs 4500 and leaving money idle. The mix at (10, 50) is the only point that exhausts <i>both</i> the money and the storage simultaneously, which is why it wins.</p>"}

{
  id:"m1t12", m:"m1", type:"problem-solving", priority:"medium", los:[],
  title:"Graphical method — unbounded feasible regions",
  summary:"When the region is open, the best corner value may not be the optimum. One half-plane test settles it.",
  whatIs:"<p>An unbounded feasible region stretches to infinity in some direction. The corner values are then only <i>candidates</i>, and one further check decides whether a candidate really is the optimum.</p>",
  concept:"<h4>The rule your notes state</h4><p>When the feasible region is unbounded:</p><ul>"+
    "<li><b>M is the maximum</b> value of Z if the open half plane determined by ax + by &gt; M has <b>no point in common</b> with the feasible region. Otherwise Z has no maximum value.</li>"+
    "<li><b>m is the minimum</b> value of Z if the open half plane determined by ax + by &lt; m has <b>no point in common</b> with the feasible region. Otherwise Z has no minimum value.</li></ul>"+
    "<h4>How to run the check</h4><ol>"+
    "<li>Find the best corner value, call it m (for a minimisation).</li>"+
    "<li>Write the strict inequality ax + by &lt; m and simplify it.</li>"+
    "<li>Graph that open half plane and look at the feasible region.</li>"+
    "<li>No common points → m is the minimum. Common points exist → Z has no minimum.</li></ol>"+
    "<h4>The two outcomes in your notes, side by side</h4>"+
    "<div class='tw'><table><tr><th></th><th>Diet problem</th><th>Example 4</th></tr>"+
    "<tr><td>Problem</td><td>Min Z = 50x + 70y, 2x + y &ge; 8, x + 2y &ge; 10</td><td>Min Z = &minus;50x + 20y, 2x &minus; y &ge; &minus;5, 3x + y &ge; 3, 2x &minus; 3y &le; 12</td></tr>"+
    "<tr><td>Best corner</td><td>380 at (2, 4)</td><td>&minus;300 at (6, 0)</td></tr>"+
    "<tr><td>Half plane tested</td><td>50x + 70y &lt; 380, i.e. 5x + 7y &lt; 38</td><td>&minus;50x + 20y &lt; &minus;300, i.e. &minus;5x + 2y &lt; &minus;30</td></tr>"+
    "<tr><td>Common points?</td><td>None</td><td>Yes</td></tr>"+
    "<tr><td>Conclusion</td><td>Minimum Z = 380 at (2, 4)</td><td>Z has <b>no minimum value</b></td></tr></table></div>"+
    "<div class='box warning'><h5>Why this is worth marks</h5><p>Both problems look identical up to the corner table. The candidate who writes &lsquo;minimum = &minus;300&rsquo; for Example 4 has done all the arithmetic correctly and still has the wrong answer. Stating &lsquo;the region is unbounded, so I must check&rsquo; is the step being examined.</p></div>",

    "<h4>Arithmetic in M</h4><p>Every entry of the first Z&#8341; row is a multiple of M, and each C&#8341; &minus; Z&#8341; is a number-plus-M expression like <span class='mono'>7 &minus; 5M</span> or <span class='mono'>15 &minus; 13M</span>. To compare them, treat M as arbitrarily large — the M term dominates. Among 7 &minus; 5M, 15 &minus; 13M and 20 &minus; 12M the most negative is <b>15 &minus; 13M</b>, because 13M is the biggest M-coefficient being subtracted.</p>"+
    "<div class='box tip'><h5>The comparison shortcut</h5><p>Compare the coefficients of M first. Only if two entries have the same M-coefficient do you look at the constant terms.</p></div>"+
    "<h4>Once an artificial leaves</h4><p>It never comes back. Your notes mark its column with <span class='mono'>**</span> from that point on and stop maintaining it, which keeps the table narrower.</p>"+
    "<h4>Reading the outcome</h4><ul>"+
    "<li>All artificials at zero at optimality → a genuine optimal solution.</li>"+
    "<li>An artificial still basic at a positive value at optimality → the original problem has <b>no feasible solution</b>.</li></ul>",

  practice:[
    {id:"m1t15p1", d:"moderate", q:"In the initial Big M table for Min Z = 7x₁ + 15x₂ + 20x₃, the Cⱼ − Zⱼ row is (7 − 5M, 15 − 13M, 20 − 12M, M, M, 0, 0). Which variable enters, and why is it not x₃ despite 20 being the largest cost?",
     hint:"For a minimisation you want the most negative entry, and M dominates every constant.",
     a:"<p><b>x₂ enters.</b> For a minimisation in the Cⱼ − Zⱼ convention we choose the most negative entry. Since M is arbitrarily large, the entry with the largest coefficient of M subtracted is the most negative: comparing 5M, 13M and 12M, the largest is 13M, so 15 − 13M is the most negative.</p><p>The constant 20 in the x₃ column is irrelevant — 20 − 12M is still far above 15 − 13M for large M, because the difference is (20 − 12M) − (15 − 13M) = 5 + M, which is positive. This is why the comparison rule is 'M-coefficients first, constants only to break a tie'.</p>"},
    {id:"m1t15p2", d:"moderate", q:"How do you tell from a final Big M table that the original problem has no feasible solution?",
     hint:"Look at what is still in the basis when the index row says stop.",
     a:"<p>Run the method to optimality — every Cⱼ − Zⱼ satisfies the sign rule and no further pivot is available. Then look at the basis. If <b>any artificial variable is still basic at a strictly positive value</b>, the original problem has <b>no feasible solution</b>.</p><p>The reason: an artificial variable is not part of the original problem. It was added purely to supply a starting basis. A solution that keeps an artificial at a positive level is satisfying the <i>augmented</i> constraint a₁ &gt; 0, not the original one. Since the M penalty makes such a solution as expensive as possible and the optimizer <i>still</i> could not drive it out, no point satisfies all the original constraints simultaneously.</p><p>By contrast, if all artificials have left the basis (or sit at zero), the remaining solution satisfies the original constraints and is genuinely optimal.</p>"},
    {id:"m1t15p3", d:"hard", q:"Solve by Big M: Min Z = 12x₁ + 16x₂ subject to 10x₁ + 20x₂ ≥ 120, 8x₁ + 8x₂ ≥ 80, x₁, x₂ ≥ 0. (Your notes present this as the ≥ mirror of the standard simplex example.)",
     hint:"Both constraints are ≥. Simplify them first: 10x₁ + 20x₂ ≥ 120 divides by 10.",
     a:"<p><b>Simplify:</b> x₁ + 2x₂ &ge; 12 and x₁ + x₂ &ge; 10.</p><p><b>Standard form:</b> x₁ + 2x₂ &minus; s₁ + a₁ = 12, x₁ + x₂ &minus; s₂ + a₂ = 10, with Min Z = 12x₁ + 16x₂ + 0s₁ + 0s₂ + Ma₁ + Ma₂.</p><p><b>Candidate corners</b> of the feasible region: the intersection of x₁ + 2x₂ = 12 and x₁ + x₂ = 10 gives x₂ = 2 and x₁ = 8, so (8, 2) with Z = 96 + 32 = 128. On the axes: (12, 0) satisfies x₁ + x₂ = 12 &ge; 10 ✓, giving Z = 144. And (0, 12) satisfies x₁ + x₂ = 12 &ge; 10 ✓, giving Z = 192.</p><p><b>Minimum Z = 128 at x₁ = 8, x₂ = 2</b> — the same point as the maximisation version of this problem, which is the point of your notes presenting the pair side by side: reversing the inequality signs turns a maximisation whose optimum lies where the resources run out into a minimisation whose optimum lies where the requirements are just met, and here that is the same vertex.</p><p>Running Big M reaches the same table: a₁ and a₂ leave, x₁ and x₂ enter, and the final Cⱼ &minus; Zⱼ row is non-negative throughout.</p>"}
  ],

{
  id:"m1t16", m:"m1", type:"problem-solving", priority:"medium", los:[1],
  title:"Two-phase method",
  summary:"Drive the artificials out in Phase 1 with a substitute objective, then restore the real one in Phase 2.",
  whatIs:"<p>Two-phase does the same job as Big M without ever writing M. Phase 1 minimises the sum of the artificials; Phase 2 continues from the resulting table with the real objective.</p>",
  concept:"<h4>The rules from your notes</h4><ul>"+
    "<li>For &le; constraints, add slack variables. For &ge; constraints, subtract surplus variables and add artificial variables.</li>"+
    "<li><b>The two-phase method is meant only for minimisation problems.</b> If you are given a maximisation, convert it to a minimisation by changing the sign.</li></ul>"+
    "<h4>Phase 1</h4><ol>"+
    "<li>Keep the constraints <b>as is</b>, with their slack and artificial variables.</li>"+
    "<li>Form a <b>revised objective function</b> taking <i>only</i> the artificial variables: <span class='mono'>Min Z = a&#8321; + a&#8322;</span>. Every other variable gets coefficient 0.</li>"+
    "<li>Run simplex on that.</li>"+
    "<li>At the optimal table, check the objective function value. <b>If it is zero, go to Phase 2. Otherwise conclude that the problem does not have an optimal solution.</b></li></ol>"+
    "<h4>Phase 2</h4><p>Continue with the optimal table from Phase 1 and <b>replace the objective function with the original one</b>. Re-price the C<sub>Bi</sub> column with the real coefficients, recompute Z&#8341; and C&#8341; &minus; Z&#8341;, and iterate on as usual.</p>"+
    "<div class='box tip'><h5>Choosing between Big M and two-phase</h5><p>They reach the same answer. Big M is one continuous table but carries M-arithmetic in every entry. Two-phase avoids M entirely at the cost of re-pricing once. If the question names a method, use it; if not, two-phase is less error-prone under time pressure.</p></div>",
  needToKnow:[
    "Build the revised Phase 1 objective from the artificials only.",
    "Apply the zero test at the end of Phase 1 and say what a non-zero value means.",
    "Re-price the C_Bi column correctly when Phase 2 starts.",
    "Convert a maximisation to a minimisation before starting."
  ],

    wording:["Solve by the two-phase method.","Explain the two-phase method with an example.","What is the purpose of Phase 1 in the two-phase simplex method?"],

      "Third table: x₂ = (0, 1, 1/2, −3/4, −1/4 | 5/4) and x₁ = (1, 0, −1/2, 1/4, −1/4 | 1/4), with Cⱼ − Zⱼ = (0, 0, 0, 0, 0). The Phase 1 objective value is now 0, so Phase 1 has succeeded and we go to Phase 2.",

  practice:[
    {id:"m1t16p1", d:"easy", q:"What exactly is tested at the end of Phase 1, and what are the two possible conclusions?",
     hint:"One number decides everything.",
     a:"<p>At the end of Phase 1 you check the <b>value of the (revised) objective function in the optimal table</b>. The revised objective is Min Z = a₁ + a₂ + …, the sum of the artificial variables.</p><p><b>If it is zero:</b> every artificial has been driven to zero, so the current basic feasible solution satisfies all the original constraints. Go to Phase 2.</p><p><b>If it is not zero:</b> the smallest achievable sum of artificials is still positive, which means no point satisfies all the original constraints. Conclude that the problem <b>does not have an optimal solution</b> — it is infeasible. This is the exact counterpart of a positive artificial surviving in a Big M table.</p>"},
    {id:"m1t16p2", d:"moderate", q:"Compare Big M and two-phase: what does each do about artificial variables, and what is the practical cost of each?",
     hint:"Both must remove the artificials; they differ in when and how.",
     a:"<p><b>Big M</b> removes artificials by pricing them at ±M in the <i>original</i> objective, so the whole problem is solved in one continuous sequence of tables. The cost is that every entry of the index row is an expression in M, and comparisons must be made on the M-coefficients — arithmetic that is easy to get wrong under time pressure.</p><p><b>Two-phase</b> removes artificials in a separate Phase 1 that ignores the real costs entirely and minimises only their sum. All the numbers stay ordinary. The cost is that you must re-price the C<sub>Bi</sub> column at the start of Phase 2 and recompute Zⱼ and Cⱼ − Zⱼ from scratch.</p><p>Both reach the same optimum. Both detect infeasibility, one by a surviving positive artificial and the other by a non-zero Phase 1 objective. Your notes add one restriction that Big M does not have: the two-phase method is meant only for minimisation, so a maximisation must be converted first by changing the sign.</p>"}

  title:"Constructing the dual of a given primal",
  summary:"Standardise the constraint directions first, then transpose. The most common 5-mark duality question.",
  whatIs:"<p>Writing the dual is a mechanical transposition — but only after every constraint points the right way. The standardisation step is where the marks are lost.</p>",
  concept:"<h4>Step 0 — standardise</h4><p>Your notes state the rule: in case the constraints are mixed (&le; and &ge;), convert them as per the requirement of the problem, i.e. <b>for a maximisation all constraints should be &le;</b>, and <b>for a minimisation all constraints should be &ge;</b>. To flip a constraint, multiply both sides by &minus;1 and reverse the inequality.</p>"+
    "<h4>Step 1 — transpose</h4><ol>"+
    "<li>Flip the sense: Max &rarr; Min, or Min &rarr; Max.</li>"+
    "<li>The primal's <b>right-hand sides</b> become the dual's <b>objective coefficients</b>.</li>"+
    "<li>The primal's <b>objective coefficients</b> become the dual's <b>right-hand sides</b>.</li>"+
    "<li>The primal's <b>constraint matrix is transposed</b> — the coefficients of x&#8321; read down the primal's constraints become the coefficients of the dual's first constraint.</li>"+
    "<li>Flip the constraint direction: &le; &rarr; &ge;, or &ge; &rarr; &le;.</li>"+
    "<li>Dual variables are non-negative.</li></ol>"+
    "<h4>Equality constraints</h4><p>Your notes handle an equality by splitting it into the two inequalities that together mean the same thing. In the worked example, <span class='mono'>x&#8321; + x&#8322; = 50</span> is standardised as <span class='mono'>x&#8321; + x&#8322; &ge; 50</span> in a minimisation, and <span class='mono'>x&#8322; &le; 40</span> is flipped to <span class='mono'>&minus;x&#8322; &ge; &minus;40</span> so that every constraint points the same way.</p>",

  practice:[
    {id:"m1t17p1", d:"moderate", q:"Standardise and write the dual of: Min Z = 25x₁ + 10x₂ subject to x₁ + x₂ = 50, x₁ ≥ 20, x₂ ≤ 40, x₁, x₂ ≥ 0.",
     hint:"A minimisation needs every constraint as ≥. Two of these do not comply.",
     a:"<p><b>Standardise.</b> A minimisation requires all constraints as &ge;. The equality is written as x₁ + x₂ &ge; 50 for this purpose. The second is already x₁ + 0x₂ &ge; 20. The third, x₂ &le; 40, is multiplied by &minus;1 to give 0x₁ &minus; x₂ &ge; &minus;40.</p><p><b>Standardised primal:</b> Min Z = 25x₁ + 10x₂ subject to x₁ + x₂ &ge; 50, x₁ + 0x₂ &ge; 20, 0x₁ &minus; x₂ &ge; &minus;40.</p><p><b>Size:</b> n = 2, m = 3, so the dual has 3 variables and 2 constraints, and is a maximisation.</p><p><b>Dual:</b> Max W = 50y₁ + 20y₂ &minus; 40y₃ subject to y₁ + y₂ + 0y₃ &le; 25 (from the x₁ column 1, 1, 0), y₁ + 0y₂ &minus; y₃ &le; 10 (from the x₂ column 1, 0, &minus;1), y₁, y₂, y₃ &ge; 0.</p><p>The &minus;40 in the dual objective comes straight from the standardised right-hand side &minus;40 — a negative objective coefficient is perfectly legal.</p>"},

     hint:"Two rules do all the work here.",
     a:"<p>By the sense rule, the dual is a <b>maximisation</b>. By the size rule (n variables and m constraints become m variables and n constraints), the dual has <b>2 variables and 6 constraints</b>.</p><p>The primal's minimisation would have all &ge; constraints after standardisation, so the dual's 6 constraints are all &le;, with non-negative dual variables. The dual's 2 objective coefficients are the primal's 2 right-hand sides, and the dual's 6 right-hand sides are the primal's 6 objective coefficients.</p><p>This is exactly the situation your notes describe as the practical motivation for duality: a 6-variable, 2-constraint primal is awkward, while a 2-variable, 6-constraint dual can be solved graphically.</p>"}

  title:"Solving through the dual and recovering the primal",
  summary:"Solve the easier of the pair, then read the other's answer off the slack columns of the final table.",
  whatIs:"<p>Because primal and dual share an optimal value, you may solve whichever is smaller. The final table then carries <i>both</i> answers — one in the Solution column and one in the index row.</p>",
  concept:"<h4>Why bother</h4><p>Your notes give the motivation: the dual simplex approach is useful for solving complex problems with more than two constraints. Converting a primal with many constraints and few variables into a dual with few constraints and many variables shrinks the table dramatically, because the number of <i>rows</i> is set by the number of constraints.</p>"+
    "<h4>The recovery rule</h4><p>In the optimal table of one problem, the <b>magnitudes of the C&#8341; &minus; Z&#8341; entries under the slack columns</b> give the optimal values of the <i>other</i> problem's variables, in order.</p>"+
    "<div class='box tip'><h5>Seen in your own example</h5><p>The dual's final table has C&#8341; &minus; Z&#8341; = (0, 0, &minus;10, <b>&minus;20</b>, <b>&minus;30</b>), where the last two entries sit under s&#8321; and s&#8322;. Their magnitudes, 20 and 30, are exactly the primal optimum x&#8321; = 20 and x&#8322; = 30. And both problems close at <b>800</b>.</p></div>"+
    "<h4>Which value belongs to which</h4><p>The Solution column of the table you actually solved gives that problem's variables. The slack-column index entries give the partner problem's variables. Confusing the two is the single biggest risk in this question type.</p>",

    "Decide which of the pair is cheaper to solve, by counting constraints.",

    "Read the partner's solution from the index-row entries under the slack columns.",

     hint:"One entry per primal variable, plus one theorem.",
     a:"<p><b>Primal variable values:</b> the magnitudes of the slack-column index entries give x₁ = 20 and x₂ = 30, in the order the slacks appear.</p><p><b>Primal optimal value:</b> by strong duality the primal's optimum equals the dual's, so Z = 800. This can be verified directly: 25(20) + 10(30) = 800.</p><p><b>Which constraints bind:</b> both dual slacks are non-basic (their index entries are non-zero), which means both dual constraints are tight, which by complementary slackness corresponds to both primal variables being strictly positive — consistent with x₁ = 20 and x₂ = 30 both being non-zero.</p><p>What you cannot conclude: nothing about the dual's own variable values from these entries. Those come from the dual's Solution column.</p>"},

     hint:"Rows in a simplex table come from constraints.",
     a:"<p>Solve the <b>dual</b>. The primal has m = 5 constraints, so its simplex table would have 5 constraint rows plus 5 slack/surplus columns on top of its 2 decision variables — a table at least 5 rows by 8 columns.</p><p>By the size rule the dual has 2 constraints and 5 variables, so its table has only <b>2 constraint rows</b>, with 5 decision variables and 2 slacks — roughly 2 rows by 8 columns. The number of pivots is bounded by the number of rows, so the dual takes at most two iterations where the primal could take five.</p><p>This is precisely the reason your notes give: the dual approach is useful for solving complex problems with more than two constraints. Having solved the dual, recover the primal's two variables from the index entries under the dual's two slack columns.</p>"}

{
  id:"m1t19", m:"m1", type:"problem-solving", priority:"medium", los:[1],
  title:"Special cases in the simplex table",
  summary:"Alternate optima, degeneracy and an unbounded ratio — how each one shows up in the table.",
  whatIs:"<p>Three situations look like errors but are not. Recognising them in the table, and saying so, is what the mark is for.</p>",
  concept:"<div class='tw'><table><tr><th>Situation</th><th>What you see in the table</th><th>What to write</th></tr>"+
    "<tr><td><b>Alternate optima</b></td><td>At optimality, a <b>non-basic</b> variable has C&#8341; &minus; Z&#8341; = 0</td><td>More than one optimal solution exists with the same value of Z; every point on the segment joining them is optimal</td></tr>"+
    "<tr><td><b>Degeneracy</b></td><td>A tie in the minimum ratio test, producing a <b>basic variable at value 0</b> in the next table</td><td>The basic feasible solution is degenerate; break the tie arbitrarily and continue</td></tr>"+
    "<tr><td><b>Unbounded ratio</b></td><td>A key-column entry is 0 or negative, so that row's ratio is written &infin; (your notes write &lsquo;Infy&rsquo;) or is negative</td><td>That row does not compete in the ratio test. If <i>every</i> entry in the key column is &le; 0, the solution is unbounded</td></tr></table></div>"+
    "<h4>Where each one appears in your folder</h4><ul>"+
    "<li><b>Alternate optima:</b> the Big M example closes with C&#8341; &minus; Z&#8341; = (0, 0, 0, 3, 1/3) — a zero under the non-basic x&#8321;. And graphically, Example 3 attains its maximum of 180 at <i>both</i> (15, 15) and (0, 20).</li>"+
    "<li><b>Degeneracy:</b> in the three-variable example, the first ratio test ties at 5 and 5; after the pivot S&#8323; sits in the basis at value 0, and its row's ratio in the next test is 0/2 = 0.</li>"+
    "<li><b>Unbounded ratio:</b> the same example writes &lsquo;Infy&rsquo; against the x&#8321; row, whose key-column entry is 0, and has a negative ratio 15/(&minus;2) that also does not compete.</li></ul>"+
    "<div class='box warning'><h5>The rule to remember</h5><p>Only <b>strictly positive</b> key-column entries generate a competing ratio. Zero gives &infin;, negative gives a negative ratio, and neither can limit how far the entering variable may increase.</p></div>",
  needToKnow:[
    "Spot a zero Cⱼ − Zⱼ under a non-basic column and name it as alternate optima.",
    "Spot a tie in the ratio test and name the resulting degeneracy.",
    "Exclude non-positive ratios from the leaving-variable choice.",
    "Recognise an unbounded solution when every key-column entry is ≤ 0."

  recognition:{

    "Treating a zero Cⱼ − Zⱼ under a <i>basic</i> variable as alternate optima. Basic variables always have zero there; only a non-basic zero is meaningful.",

  examples:[
    {id:"m1t19e1", title:"Alternate optima, spotted two ways",
     q:"The Big M example ends with Cⱼ − Zⱼ = (0, 0, 0, 3, 1/3) over (x₁, x₂, x₃, s₁, s₂), with basis x₃ = 16/5, x₂ = 6/5 and Z = 82. What does the zero under x₁ tell you?",
     steps:[
      "Identify which variables are basic: x₂ and x₃. So x₁, s₁ and s₂ are non-basic.",
      "Basic variables always show Cⱼ − Zⱼ = 0, so the zeros under x₂ and x₃ carry no information.",
      "The zero under x₁ is different — x₁ is non-basic, and a non-basic variable with a zero index entry can be brought into the basis without changing Z.",

      "Verify it: 2(6) + 4(0) + 6(2) = 12 + 12 = 24 ≥ 24 ✓ and 3(6) + 9(0) + 6(2) = 18 + 12 = 30 ≥ 30 ✓, with Z = 7(6) + 20(2) = 42 + 40 = 82 ✓ — the same optimal value.",
      "Both are optimal, and so is every point on the line segment joining them."],

      "First table: two rows tie at 5. The tie is broken arbitrarily — your notes take the S₁ row — and either choice is valid.",
      "The consequence of the tie: after the pivot, the other tied row's basic variable enters the next table at value 0. Here S₃ sits in the basis with Solution 0. This is a degenerate basic feasible solution.",

      "Only the S₃ row competes, with ratio 0/2 = 0. It becomes the key row, and the pivot brings x₃ in at value 0 — a degenerate pivot that changes the basis without changing Z."],

  practice:[
    {id:"m1t19p1", d:"moderate", q:"How would you recognise an unbounded solution from a simplex table, and how does that differ from an infeasible problem?",
     hint:"One is diagnosed from a column, the other from the basis.",
     a:"<p><b>Unbounded:</b> a variable qualifies to enter (its index entry says it improves Z), but <i>every</i> entry in its key column is zero or negative. No row can limit how far it increases, so there is no leaving variable and Z can be improved without bound. Conclude: the LPP has an <b>unbounded solution</b>. Note that feasible solutions exist in abundance — it is the optimum that does not.</p><p><b>Infeasible:</b> diagnosed only in problems that used artificial variables. The method runs to optimality by the index-row rule, but an <b>artificial variable remains basic at a positive value</b> (or, in two-phase, the Phase 1 objective does not reach zero). Conclude: the problem has <b>no feasible solution</b> — no point satisfies all the constraints at once.</p><p>They are opposites: unbounded means too much freedom, infeasible means none.</p>"},
    {id:"m1t19p2", d:"easy", q:"Graphically, Example 3 attains its maximum of 180 at both (15, 15) and (0, 20). What is the full set of optimal solutions?",
     hint:"The objective is constant along a line here.",
     a:"<p>Every point on the <b>line segment joining (15, 15) and (0, 20)</b> is optimal. That segment is an edge of the feasible region, and along it the objective Z = 3x + 9y is constant at 180 — check the midpoint (7.5, 17.5): Z = 22.5 + 157.5 = 180 ✓.</p><p>This happens when the objective function line is <b>parallel to a constraint edge</b>. Here the objective 3x + 9y is a multiple of the constraint x + 3y ≤ 60, so the objective contour and that edge have the same slope, and sliding the contour outwards makes it land on the whole edge at once rather than on a single corner.</p><p>This is the graphical face of the same phenomenon that shows in the simplex table as a zero Cⱼ − Zⱼ under a non-basic variable.</p>"}
  ],

{
  id:"m5t8", m:"m5", type:"problem-solving", priority:"high", los:[8],
  title:"Mixed strategy for 2×2 games",
  summary:"No saddle point in a 2×2 — set the two expected gains equal and solve for the probabilities.",
  whatIs:"<p>When there is no saddle point, each player plays each strategy a certain percentage of the time. The goal is for a player to randomise so that the expected value of the game does not depend on what the opponent does.</p>",
  concept:"<h4>The idea, in your notes' words</h4><p>The most common way to solve a mixed strategy game is the <b>expected gain or loss approach</b>. The goal is for a player to play each strategy a particular percentage of the time so that the expected value of the game does not depend upon what the opponent does. This will only occur if the expected value of each strategy is the same.</p>"+
    "<h4>Setting it up</h4><p>For the matrix with rows X&#8321;, X&#8322; and columns Y&#8321;, Y&#8322;, let <b>P</b> be the fraction of the time Y plays Y&#8321; and <b>Q</b> the fraction of the time X plays X&#8321;. Write the expected gain for each row and each column, then set each pair equal.</p>"+
    "<div class='box'><h5>The closed formulas</h5><p>For the matrix <span class='mono'>[[a, b], [c, d]]</span> with denominator <span class='mono'>D = a + d &minus; b &minus; c</span>:</p>"+
    "<p class='mono blk'>p  (A plays row 1)   = (d − c) / D\n1 − p (A plays row 2)   = (a − b) / D\nr  (B plays col 1)   = (d − b) / D\n1 − r (B plays col 2)   = (a − c) / D\nV  (value of game)   = (ad − bc) / D</p>"+
    "<p>These are the algebraic result of the equal-expected-value equations, and they agree with every answer key in your folder.</p></div>"+
    "<h4>Checks that catch errors</h4><ul>"+
    "<li>p and 1 &minus; p must both be between 0 and 1, and must sum to 1.</li>"+
    "<li>V must lie strictly between the maximin and the minimax.</li>"+
    "<li>Compute V twice, once from each player's side. They must agree.</li></ul>",
  needToKnow:[
    "Confirm there is no saddle point before using any of this.",
    "Set up and solve the equal-expected-gain equations, or apply the formulas.",
    "Compute V and verify it from both players' sides.",
    "Check the probabilities are legal and lie between the two margins."
  ],

  examples:[
    {id:"m5t8e1", title:"The full expected-gain method — the textbook example",
     q:"Solve the mixed strategy game with X₁ = (4, 2) and X₂ = (1, 10).",
     steps:[
      "Saddle-point check first. Row minima: 2 and 1, so maximin = 2. Column maxima: 4 and 10, so minimax = 4. They differ, so there is no saddle point and this is a mixed game.",
      "Let P be the fraction of the time player Y plays Y₁, so 1 − P is the fraction for Y₂. Write X's expected gain under each of X's own strategies. If X plays X₁: 4P + 2(1 − P). If X plays X₂: 1P + 10(1 − P).",
      "Set them equal so that X's expectation does not depend on which row X uses: 4P + 2(1 − P) = 1P + 10(1 − P).",
      "Expand: 4P + 2 − 2P = P + 10 − 10P, so 2P + 2 = −9P + 10, giving 11P = 8 and P = 8/11, with 1 − P = 3/11.",
      "Now let Q be the fraction of the time X plays X₁. Y's expected loss under Y₁ is 4Q + 1(1 − Q) and under Y₂ is 2Q + 10(1 − Q). Setting these equal: 4Q + 1 − Q = 2Q + 10 − 10Q, so 3Q + 1 = −8Q + 10, giving 11Q = 9 and Q = 9/11, with 1 − Q = 2/11.",
      "Compute the value using P: 1P + 10(1 − P) = 1(8/11) + 10(3/11) = 8/11 + 30/11 = 38/11.",
      "Verify from the other side using Q: 4Q + 1(1 − Q) = 4(9/11) + 1(2/11) = 36/11 + 2/11 = 38/11 ✓. The two agree.",
      "Sanity check: 38/11 ≈ 3.45 lies between the maximin 2 and the minimax 4 ✓."],
     answer:"<b>Y plays Y₁ 8/11 of the time and Y₂ 3/11; X plays X₁ 9/11 of the time and X₂ 2/11. V = 38/11 ≈ 3.45.</b>",
     trap:"Your notes round 38/11 to 3.46; the exact value is 38/11 = 3.4545…, so 3.45 to two decimals. Leave the answer as the fraction 38/11 and no rounding question arises."},
    {id:"m5t8e2", title:"The same method on [[4, 2], [0, 10]]",
     q:"Using the solution procedure for a mixed strategy game, solve the game with X₁ = (4, 2) and X₂ = (0, 10).",
     steps:[
      "Saddle-point check: row minima 2 and 0 give maximin = 2; column maxima 4 and 10 give minimax = 4. No saddle point.",
      "The equations for Q, from the two columns: 4Q + 0(1 − Q) = 2Q + 10(1 − Q).",
      "Expand: 4Q = 2Q + 10 − 10Q, so 4Q = −8Q + 10 and 12Q = 10, giving Q = 10/12 = 5/6 and 1 − Q = 2/12 = 1/6.",
      "The equations for P, from the two rows: 4P + 2(1 − P) = 0P + 10(1 − P).",
      "Expand: 4P + 2 − 2P = 10 − 10P, so 2P + 2 = −10P + 10 and 12P = 8, giving P = 8/12 = 2/3 and 1 − P = 4/12 = 1/3.",
      "Value: using Q, V = 4(10/12) + 0(2/12) = 40/12 = 10/3 ≈ 3.33. Check with the other column: 2(10/12) + 10(2/12) = 20/12 + 20/12 = 40/12 ✓.",
      "Cross-check against the formulas: D = 4 + 10 − 2 − 0 = 12; p = (10 − 0)/12 = 10/12 ✓; r = (10 − 2)/12 = 8/12 ✓; V = (40 − 0)/12 = 10/3 ✓."],
     answer:"<b>X plays X₁ 10/12 = 5/6 of the time; Y plays Y₁ 8/12 = 2/3 of the time; V = 10/3.</b>",
     trap:"Your notes present this problem twice, once headed 'Using the solution procedure for a mixed strategy game' and once headed 'By Using Oddments', but both slides show the same matrix and the deck does not set out a separate oddments procedure. Solve it by the expected-gain method above."}

  practice:[
    {id:"m5t8p1", d:"easy", q:"Solve the game [[12, 4], [3, 7]].",
     hint:"D = a + d − b − c. Check for a saddle point first.",
     a:"<p><b>Saddle-point check:</b> row minima 4 and 3, so maximin = 4. Column maxima 12 and 7, so minimax = 7. Not equal, so no saddle point.</p><p><b>D</b> = 12 + 7 &minus; 4 &minus; 3 = 12.</p><p><b>p</b> = (d &minus; c)/D = (7 &minus; 3)/12 = 4/12 = <b>1/3</b>, so 1 &minus; p = 2/3.<br><b>r</b> = (d &minus; b)/D = (7 &minus; 4)/12 = 3/12 = <b>1/4</b>, so 1 &minus; r = 3/4.<br><b>V</b> = (ad &minus; bc)/D = (84 &minus; 12)/12 = 72/12 = <b>6</b>.</p><p>Check: V = 6 lies between the maximin 4 and the minimax 7 ✓.</p>"},
    {id:"m5t8p2", d:"moderate", q:"Solve the game [[5, −4], [−9, 3]].",
     hint:"Two negative entries. Watch the signs when computing D.",
     a:"<p><b>Saddle-point check:</b> row minima &minus;4 and &minus;9, so maximin = &minus;4. Column maxima 5 and 3, so minimax = 3. Not equal, so no saddle point.</p><p><b>D</b> = 5 + 3 &minus; (&minus;4) &minus; (&minus;9) = 8 + 4 + 9 = 21.</p><p><b>p</b> = (3 &minus; (&minus;9))/21 = 12/21 = <b>4/7</b>, so 1 &minus; p = 3/7.<br><b>r</b> = (3 &minus; (&minus;4))/21 = 7/21 = <b>1/3</b>, so 1 &minus; r = 2/3.<br><b>V</b> = (5&times;3 &minus; (&minus;4)&times;(&minus;9))/21 = (15 &minus; 36)/21 = &minus;21/21 = <b>&minus;1</b>.</p><p>Check: &minus;1 lies between &minus;4 and 3 ✓. Since V is negative the game is favourable to player Y.</p>"},
    {id:"m5t8p3", d:"easy", q:"Solve the game [[10, 4], [6, 8]].",
     hint:"All positive; D is small.",
     a:"<p><b>Saddle-point check:</b> row minima 4 and 6, maximin = 6. Column maxima 10 and 8, minimax = 8. Not equal, no saddle point.</p><p><b>D</b> = 10 + 8 &minus; 4 &minus; 6 = 8.</p><p><b>p</b> = (8 &minus; 6)/8 = 2/8 = <b>1/4</b>, 1 &minus; p = 3/4.<br><b>r</b> = (8 &minus; 4)/8 = 4/8 = <b>1/2</b>, 1 &minus; r = 1/2.<br><b>V</b> = (80 &minus; 24)/8 = 56/8 = <b>7</b>.</p><p>Check: 7 lies between 6 and 8 ✓.</p>"},
    {id:"m5t8p4", d:"moderate", q:"Solve the game [[20, 8], [−2, 10]].",
     hint:"One negative entry in the second row.",
     a:"<p><b>Saddle-point check:</b> row minima 8 and &minus;2, maximin = 8. Column maxima 20 and 10, minimax = 10. Not equal, no saddle point.</p><p><b>D</b> = 20 + 10 &minus; 8 &minus; (&minus;2) = 30 &minus; 8 + 2 = 24.</p><p><b>p</b> = (10 &minus; (&minus;2))/24 = 12/24 = <b>1/2</b>, 1 &minus; p = 1/2.<br><b>r</b> = (10 &minus; 8)/24 = 2/24 = <b>1/12</b>, 1 &minus; r = 11/12.<br><b>V</b> = (200 &minus; (8)(&minus;2))/24 = (200 + 16)/24 = 216/24 = <b>9</b>.</p><p>Check: 9 lies between 8 and 10 ✓. The game strongly favours player X.</p>"},
    {id:"m5t8p5", d:"moderate", q:"Set up the equal-expected-gain equations for [[3, 5], [4, 2]] from first principles, without using the formulas.",
     hint:"Let Q be the probability that A plays row 1, and equate A's expectation under each of B's columns.",
     a:"<p><b>No saddle point:</b> row minima 3 and 2 give maximin = 3; column maxima 4 and 5 give minimax = 4. Not equal.</p><p><b>For A.</b> Let Q be the probability A plays row 1. If B plays column 1, A's expected gain is 3Q + 4(1 &minus; Q). If B plays column 2, it is 5Q + 2(1 &minus; Q). Setting these equal so A's expectation is independent of B's choice: 3Q + 4 &minus; 4Q = 5Q + 2 &minus; 2Q &rArr; &minus;Q + 4 = 3Q + 2 &rArr; 4Q = 2 &rArr; <b>Q = 1/2</b>.</p><p><b>For B.</b> Let P be the probability B plays column 1. Against row 1, B's expected loss is 3P + 5(1 &minus; P); against row 2 it is 4P + 2(1 &minus; P). Equating: 3P + 5 &minus; 5P = 4P + 2 &minus; 2P &rArr; &minus;2P + 5 = 2P + 2 &rArr; 4P = 3 &rArr; <b>P = 3/4</b>.</p><p><b>Value:</b> V = 3(1/2) + 4(1/2) = 3.5 from B's first column; check with the second: 5(1/2) + 2(1/2) = 3.5 ✓. So <b>V = 7/2</b>, which lies between 3 and 4 ✓.</p>"}

{
  id:"m5t9", m:"m5", type:"problem-solving", priority:"high", los:[7],
  title:"The principle of dominance",
  summary:"Delete rows and columns a player would never use. Rows compare one way, columns the other.",
  whatIs:"<p>A strategy is dominated if the player can always do as well or better by playing another one. Dominated strategies can be deleted without changing the solution.</p>",
  concept:"<h4>The two rules, exactly as your notes state them</h4>"+
    "<div class='box'><p><b>Step 1 (columns).</b> If all the elements of Column&#8209;i are <b>greater than or equal to</b> the corresponding elements of any other Column&#8209;j, then Column&#8209;i is dominated by Column&#8209;j and it is removed from the matrix. <i>Example: if Column&#8209;2 &ge; Column&#8209;4, remove Column&#8209;2.</i></p>"+
    "<p><b>Step 2 (rows).</b> If all the elements of a Row&#8209;i are <b>less than or equal to</b> the corresponding elements of any other Row&#8209;j, then Row&#8209;i is dominated by Row&#8209;j and it is removed from the matrix. <i>Example: if Row&#8209;3 &le; Row&#8209;4, remove Row&#8209;3.</i></p>"+
    "<p><b>Step 3.</b> Repeat steps 1 and 2 if any row or column is dominated; otherwise stop.</p></div>"+
    "<h4>Why the directions differ</h4><p>The matrix holds payoffs to the row player. The row player <b>maximises</b>, so a row that is smaller everywhere is never worth playing — delete the <i>smaller</i> row. The column player <b>minimises</b> the same numbers, so a column that is larger everywhere costs more — delete the <i>larger</i> column.</p>"+
    "<div class='box tip'><h5>One sentence that fixes it forever</h5><p><b>Delete the small row and the big column.</b></p></div>"+
    "<h4>Comparison must be elementwise</h4><p>Every single position must satisfy the inequality. Row 3 = (2, 1, 4, 0) is dominated by Row 4 = (3, 3, 5, 2) because 2&le;3, 1&le;3, 4&le;5 and 0&le;2 — all four. If even one position fails, there is no dominance.</p>"+
    "<h4>What dominance is for</h4><p>Your notes state it plainly: the principle of dominance can be used to <b>reduce the size of games</b> by eliminating strategies that would never be played. It is the bridge from an m&times;n game to a 2&times;2 one you can solve.</p>",
  needToKnow:[
    "State both rules with the correct inequality direction.",
    "Apply the comparison elementwise across every position.",
    "Alternate between rows and columns until no further reduction is possible.",
    "Explain why rows and columns compare in opposite directions."
  ],

    wording:["Solve the game by the principle of dominance.","Using dominance, reduce the size of the following game.","Find the solution of the game theory problem using dominance method."],

  examples:[
    {id:"m5t9e1", title:"Two clean reductions from your notes",

     steps:[
      "(a) Compare the rows. X₃ = (1, 1). Against X₁ = (4, 3): 1 ≤ 4 and 1 ≤ 3, so X₃ ≤ X₁ elementwise and X₃ is dominated.",
      "In your notes' words: X₃ will never be played because X can always do better by playing X₁ or X₂. Delete it. The new game is [[4, 3], [2, 20]].",
      "(b) Compare the columns of the second game. Y₂ = (4, 6) against Y₁ = (−5, −2): 4 ≥ −5 and 6 ≥ −2, so Y₂ ≥ Y₁ and Y₂ is dominated. Y₃ = (6, 2) against Y₁ = (−5, −2): 6 ≥ −5 and 2 ≥ −2, so Y₃ is dominated too.",
      "In your notes' words: Y would never play Y₂ and Y₃ because Y could always do better playing Y₁ or Y₄. Delete both.",
      "The new game is [[−5, −3], [−2, −20]] — reduced from 2×4 to 2×2 in one pass."],

    {id:"m5t9e2", title:"A four-step reduction with the justifications written out",
     q:"Reduce by dominance: A's rows against B's B1–B4 are (3, 5, 4, 2), (5, 6, 2, 4), (2, 1, 4, 0), (3, 3, 5, 2).",
     steps:[
      "Row comparison. A3 = (2, 1, 4, 0) against A4 = (3, 3, 5, 2): 2≤3, 1≤3, 4≤5, 0≤2 — all four hold, so Row-3 ≤ Row-4 and Row 3 is removed.",
      "Remaining rows A1, A2, A4. Column comparison: B2 = (5, 6, 3) against B4 = (2, 4, 2): 5≥2, 6≥4, 3≥2 — all hold, so Column-2 ≥ Column-4 and Column 2 is removed.",
      "Remaining columns B1, B3, B4. Compare B1 = (3, 5, 3) against B4 = (2, 4, 2): 3≥2, 5≥4, 3≥2 — all hold, so Column 1 is dominated by Column 4 and is removed.",

      "Row comparison again: A1 = (4, 2) against A4 = (5, 2): 4≤5 and 2≤2 — both hold, so Row 1 is dominated by Row 4 (this is what the notes record as 'Row-1 ≤ Row-3, so remove Row-1', numbering the third surviving row).",
      "The game reduces to A2 = (2, 4) and A4 = (5, 2) on columns B3 and B4 — a 2×2 game."],
     answer:"Reduces to [[2, 4], [5, 2]] on rows A2, A4 and columns B3, B4. Applying the 2×2 formulas: D = 2 + 2 − 4 − 5 = −5, so p(A2) = (2 − 5)/(−5) = 3/5, r(B3) = (2 − 4)/(−5) = 2/5, and V = (4 − 20)/(−5) = 16/5.",
     trap:"<b>The notes justify the third deletion as 'Column-1 ≥ Column-3', but at that stage Column-1 = (3, 5, 3) and Column-3 = (4, 2, 5), and 3 &lt; 4 — the comparison that actually holds is Column-1 ≥ Column-4.</b> The deletion itself is correct and matches the reduced matrix the notes show next; only the label is off. Write the comparison you can verify."}

  practice:[
    {id:"m5t9p1", d:"easy", q:"State both dominance rules with their inequality directions, and explain in one line why they point opposite ways.",
     hint:"Whose payoffs are in the matrix?",
     a:"<p><b>Column rule:</b> if all the elements of Column-i are greater than or equal to the corresponding elements of any other Column-j, then Column-i is dominated by Column-j and is removed.</p><p><b>Row rule:</b> if all the elements of Row-i are less than or equal to the corresponding elements of any other Row-j, then Row-i is dominated by Row-j and is removed.</p><p><b>Why they differ:</b> the matrix records payoffs <i>to the row player</i>. The row player maximises those numbers, so a row that is everywhere smaller can never be worth playing and is deleted. The column player is paying those same numbers and therefore minimises them, so a column that is everywhere larger is more expensive and is deleted. In short: <b>delete the small row and the big column</b>.</p>"},
    {id:"m5t9p2", d:"moderate", q:"In the matrix [[4, 2, 3, 6], [3, 4, 7, 5], [6, 3, 5, 4]], show why column III is deleted and column II is not.",
     hint:"Compare column III against column II position by position.",
     a:"<p><b>Column III = (3, 7, 5) and Column II = (2, 4, 3).</b> Compare elementwise: 3&ge;2 ✓, 7&ge;4 ✓, 5&ge;3 ✓. Every element of Column III is greater than or equal to the corresponding element of Column II, so <b>Column III is dominated by Column II</b> and player B discards strategy 3 — B would always rather pay the smaller amounts in Column II.</p><p><b>Column II is not deleted</b> because nothing dominates it. Against Column I = (4, 3, 6): 2&le;4, 4&ge;3 — the comparison fails at the second position, so neither dominates the other. Against Column IV = (6, 5, 4): 2&le;6, 4&le;5, 3&le;4 — here Column II is smaller everywhere, which means Column II <i>dominates</i> Column IV, so IV goes next, not II.</p><p>Dominance is a one-way relation, and the smaller column is the survivor.</p>"}
