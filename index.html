var QUIZ = [
{t:"m1t1", stage:"concept", q:"Which definition of OR is attributed to H. A. Taha?",
 o:["The scientific knowledge through interdisciplinary team effort for the purpose of determining the best utilization of limited resources",
    "The art of giving bad answers to problems to which otherwise worse answers are given",
    "A scientific method of providing executive departments with a quantitative basis for decisions",
    "A scientific approach to problem solving for executive management"], a:0,
 e:"Taha's definition is the interdisciplinary-team-and-limited-resources one. The second is Saaty (1958), the third is Morse and Kimball (1946), and the fourth is H. M. Wagner. Attribution is what earns the mark in this question type."},
{t:"m1t1", stage:"concept", q:"Your notes give two modern synonyms for Operations Research. They are:",
 o:["Management Science and Decision Science","Systems Analysis and Cybernetics","Applied Statistics and Econometrics","Optimisation Theory and Numerical Analysis"], a:0,
 e:"The notes list Management Science and Decision Science as modern synonyms, and add the nickname 'the Science of Better'. The other options are related fields but are not given as synonyms anywhere in the material."},
{t:"m1t2", stage:"concept", q:"Operations Research was named during:",
 o:["World War II, by scientists in the United Kingdom","World War I, by scientists in France","the 1952 medical studies in England","the industrial revolution"], a:0,
 e:"UK scientists studied the strategic and tactical problems of air and land defence in WWII, aiming at effective utilization of limited military resources, and the technique was named operations research. The 1952 medical thread (Norman Bailey) came later and is a separate development."},
{t:"m1t3", stage:"concept", q:"'OR is system-oriented' means that:",
 o:["a result optimal for one part of the system can be unfavourable for another part",
    "OR can only be applied to computer systems",
    "OR requires a systematic step-by-step procedure",
    "OR always produces a single optimal answer"], a:0,
 e:"The notes define system-orientation as scrutinising the problem from an organization's perspective, with the explicit consequence that results optimal for one part can be unfavourable for another. Option C describes the methodology, not this feature; option D is simply false."},
{t:"m1t4", stage:"concept", q:"Which is NOT one of the five limitations of OR listed in your notes?",
 o:["Mathematical incorrectness of the optimisation algorithms","Magnitude of computation","Intangible factors","Communication gap"], a:0,
 e:"The five limitations are magnitude of computation, intangible factors, communication gap, time and money factors, and the human factor. All are practical or organizational; the notes explicitly frame them as problems of model building, time and money, never as flaws in the mathematics."},
{t:"m1t4", stage:"concept", q:"The 'communication gap' limitation refers to a gap between:",
 o:["the expectations of managers and the aim of research professionals",
    "the model and the data available",
    "two departments of the same organization",
    "the optimal solution and the implemented solution"], a:0,
 e:"The notes state it as a wide gap between the expectations of managers and the aim of research professionals. Option D describes the human factor, which is a separate limitation about implementation and behaviour."},
{t:"m1t5", stage:"concept", q:"The five-step OR methodology in your notes runs:",
 o:["Problem Definition → Model Construction → Model Solution → Model Validation → Result Implementation",
    "Problem Definition → Model Construction → Model Validation → Model Solution → Result Implementation",
    "Model Construction → Problem Definition → Model Solution → Result Implementation → Model Validation",
    "Problem Definition → Model Solution → Model Construction → Model Validation → Result Implementation"], a:0,
 e:"Validation comes after solution and before implementation — you must have an answer before you can test whether it is trustworthy, and you must trust it before you act on it. Dropping or misplacing validation is the usual error."},
{t:"m1t6", stage:"concept", q:"Which is NOT one of the four components of a mathematical model in OR?",
 o:["The ratio test","Decision variables","Objective function","Non-negativity condition"], a:0,
 e:"The four components are decision variables, objective function, constraints and the non-negativity condition. The ratio test is a step inside the simplex algorithm, not a component of a model."},
{t:"m1t7", stage:"concept", q:"A feasible solution of an LPP consists of points:",
 o:["within and on the boundary of the feasible region","strictly inside the feasible region","only at the corner points","anywhere satisfying the objective function"], a:0,
 e:"The notes are explicit that points within and on the boundary of the feasible region represent feasible solutions. The boundary matters, because the optimum is almost always on it — usually at a corner. Option C confuses feasible solutions with the corner points you evaluate."},
{t:"m1t7", stage:"recognise", q:"In the furniture dealer problem (5x + y ≤ 100, x + y ≤ 60), the point (25, 40) is:",
 o:["infeasible, because 5(25) + 40 = 165 > 100","feasible but not optimal","the optimal solution","on the boundary of the feasible region"], a:0,
 e:"It satisfies x + y = 65 — no, in fact it fails that one too. The decisive failure is the first constraint: 5(25) + 40 = 165, far above 100. The notes name (25, 40) as their example of an infeasible solution. Test every constraint before declaring a point feasible."},
{t:"m1t8", stage:"select", q:"The constraint 3x₁ + 9x₂ ≥ 30 is converted to standard form as:",
 o:["3x₁ + 9x₂ − s + a = 30","3x₁ + 9x₂ + s = 30","3x₁ + 9x₂ + s + a = 30","3x₁ + 9x₂ − s = 30"], a:0,
 e:"A ≥ constraint needs the surplus subtracted (it measures the excess above the requirement) and then an artificial added to supply an identity column for the starting basis. Option B is the ≤ treatment; option D omits the artificial and leaves no starting basis."},
{t:"m1t8", stage:"concept", q:"In a MAXIMISATION problem solved by Big M, the artificial variable appears in the objective function with coefficient:",
 o:["−M","+M","0","+1"], a:0,
 e:"The penalty must make the artificial unattractive. In a maximisation, subtracting M does that; in a minimisation, adding M does. Your handwritten notes write Max Z = 3x₁ − x₂ + 0S₁ + 0S₂ + 0S₃ − MA₁. Using +M in a maximisation rewards keeping the artificial and breaks the method."},
{t:"m1t8", stage:"concept", q:"A slack variable represents:",
 o:["unused resource","excess above a requirement","an infeasible direction","the shadow price of a constraint"], a:0,
 e:"The notes define slack as indicating unused resources, and surplus as representing an excess above a constraint requirement level. Both contribute nothing to the objective function value, which is why their coefficients are zero."},
{t:"m1t9", stage:"concept", q:"If a primal has 3 variables and 5 constraints, its dual has:",
 o:["5 variables and 3 constraints","3 variables and 5 constraints","5 variables and 5 constraints","8 variables and 8 constraints"], a:0,
 e:"The rule in your notes: if the primal has n variables and m constraints, the dual has m variables and n constraints. The shape transposes. This is also why the dual is worth solving here — 3 constraint rows instead of 5."},
{t:"m1t9", stage:"concept", q:"Strong duality states that:",
 o:["the optimal values of the primal and the dual are equal","the primal and the dual have the same solution vector","the dual is always easier to solve","every primal has exactly one dual"], a:0,
 e:"The optimal values coincide — both 800 in your worked pair — but the solution vectors differ: the primal optimum is (20, 30) while the dual's is (10, 15, 0). Option B is the classic confusion. Option C is a practical tendency, not a theorem."},
{t:"m1t10", stage:"recognise", q:"'The mixture must contain at least 8 units of vitamin A' becomes:",
 o:["2x + y ≥ 8","2x + y ≤ 8","2x + y = 8","2x + y < 8"], a:0,
 e:"'At least' is a minimum requirement, so the constraint is ≥. Words giving resources — 'has', 'at most', 'available', 'capacity' — give ≤. Diet and mixture problems are built almost entirely from ≥ constraints, which is why their feasible regions are unbounded."},
{t:"m1t10", stage:"solve", q:"A dealer has Rs 50,000; a table costs Rs 2500 and a chair Rs 500. The simplified money constraint is:",
 o:["5x + y ≤ 100","2500x + 500y ≥ 50000","5x + y = 100","x + y ≤ 100"], a:0,
 e:"2500x + 500y ≤ 50000, divided through by 500, gives 5x + y ≤ 100. Simplifying matters: every later corner-point calculation is easier with small coefficients. The direction is ≤ because he cannot spend more than he has."},
{t:"m1t11", stage:"solve", q:"For Max Z = 4x + y with corners (0,0), (30,0), (20,30) and (0,50), the maximum is:",
 o:["120 at (30, 0)","110 at (20, 30)","50 at (0, 50)","180 at (20, 30)"], a:0,
 e:"Z(30,0) = 120; Z(20,30) = 80 + 30 = 110; Z(0,50) = 50; Z(0,0) = 0. The largest is 120. Note that the interior intersection (20, 30) does not win here — with the objective heavily weighted towards x, the x-axis corner beats it. Never assume the intersection is optimal."},
{t:"m1t11", stage:"solve", q:"The corner where x + y = 50 meets 3x + y = 90 is:",
 o:["(20, 30)","(30, 20)","(25, 25)","(50, 0)"], a:0,
 e:"Subtracting the first from the second gives 2x = 40, so x = 20 and then y = 30. Getting this the wrong way round — (30, 20) — is easy under pressure; substitute back to check: 20 + 30 = 50 ✓ and 3(20) + 30 = 90 ✓."},
{t:"m1t11", stage:"concept", q:"When a maximum is attained at two adjacent corner points, the correct statement is:",
 o:["every point on the segment joining them is also optimal","you may choose either corner arbitrarily","the problem is degenerate","the problem has no optimal solution"], a:0,
 e:"This is alternate optima. In Example 3 the maximum 180 occurs at both (15, 15) and (0, 20), and the whole edge between them is optimal because the objective contour is parallel to that constraint edge. Saying so is what earns the mark; 'choose either' does not."},
{t:"m1t12", stage:"recognise", q:"The extra check for an unbounded feasible region in a MINIMISATION is:",
 o:["graph ax + by < m and see whether it meets the feasible region","graph ax + by > m and see whether it meets the feasible region","check that all corner values are positive","verify the region is convex"], a:0,
 e:"For a minimum you test the open half plane strictly below the candidate: ax + by < m. If it has no point in common with the region, m is the minimum; if it does, Z has no minimum value. The > version is the maximisation test. The inequality must be strict."},
{t:"m1t12", stage:"solve", q:"In Example 4 the smallest corner value is −300 at (6, 0) but the region is unbounded. The correct conclusion is:",
 o:["Z has no minimum value","the minimum is −300 at (6, 0)","the problem is infeasible","the minimum is 0 at the origin"], a:0,
 e:"The half plane −50x + 20y < −300 does have points in common with the feasible region — (12, 4) is feasible and gives Z = −520 — so by the rule no minimum exists. The problem has plenty of feasible solutions; it is the optimum that fails to exist, which is why 'infeasible' is wrong."},
{t:"m1t13", stage:"select", q:"In a maximisation simplex table, the key column is chosen as the column with:",
 o:["the most positive Cⱼ − Zⱼ","the most negative Cⱼ − Zⱼ","the largest Solution value","the smallest ratio"], a:0,
 e:"Most positive Cⱼ − Zⱼ for a maximisation (most negative for a minimisation). The smallest ratio identifies the key <i>row</i>, not the column — mixing these two up is the commonest structural error in the method."},
{t:"m1t13", stage:"solve", q:"With Solution values 120 and 80 and key column entries 20 and 8, the key row is:",
 o:["the first row, ratio 6","the second row, ratio 10","the second row, because 80 < 120","neither — both ratios are valid"], a:0,
 e:"Ratios are 120/20 = 6 and 80/8 = 10. The least positive is 6, so the first row leaves. Choosing by the Solution column instead of the ratio would pick the wrong row and drive a basic variable negative — that is, out of the feasible region."},
{t:"m1t13", stage:"solve", q:"Max Z = 12x₁ + 16x₂ with 10x₁ + 20x₂ ≤ 120 and 8x₁ + 8x₂ ≤ 80 has optimum:",
 o:["x₁ = 8, x₂ = 2, Z = 128","x₁ = 2, x₂ = 8, Z = 152","x₁ = 12, x₂ = 0, Z = 144","x₁ = 0, x₂ = 6, Z = 96"], a:0,
 e:"Check the answer against both constraints: 10(8) + 20(2) = 120 ✓ and 8(8) + 8(2) = 80 ✓ — both tight, which is what you expect at an interior corner. Z = 96 + 32 = 128. Option B fails the second constraint: 8(2) + 8(8) = 80 is fine, but 10(2) + 20(8) = 180 > 120."},
{t:"m1t13", stage:"concept", q:"In the initial simplex table of a maximisation with all ≤ constraints, every Zⱼ equals:",
 o:["0, because every C_Bi is 0","Cⱼ","the Solution value","1"], a:0,
 e:"The starting basis is all slack variables, each with objective coefficient 0, so the C_Bi column is all zeros and every dot product with it is zero. Consequently Cⱼ − Zⱼ = Cⱼ, and the first entering variable is simply the one with the largest objective coefficient."},
{t:"m1t14", stage:"concept", q:"A MINIMISATION is optimal in the Cⱼ − Zⱼ convention when:",
 o:["all Cⱼ − Zⱼ ≥ 0","all Cⱼ − Zⱼ ≤ 0","all Zⱼ − Cⱼ ≥ 0","all Cⱼ − Zⱼ = 0"], a:0,
 e:"Minimisation with Cⱼ − Zⱼ needs all entries ≥ 0; maximisation needs all ≤ 0. Option C is the correct condition for a <i>maximisation</i> in the mirror convention, so it is right about a different case. Declare your convention at the top of the answer and these follow mechanically."},
{t:"m1t14", stage:"concept", q:"Zⱼ for a column is computed as:",
 o:["the dot product of the C_Bi column with that variable's column","the sum of that column's entries","Cⱼ minus the Solution value","the product of the key element and the ratio"], a:0,
 e:"Zⱼ = Σ (C_Bi × column entry), taken down the C_Bi column on the left, not across the Cⱼ row on top. Applying the same dot product to the Solution column gives the current value of Z."},
{t:"m1t14", stage:"recognise", q:"Your handwritten notes end with 'All Zⱼ − Cⱼ ≥ 0, optimal solution is reached'. That problem was:",
 o:["a maximisation","a minimisation","a two-phase Phase 1","a duality problem"], a:0,
 e:"In the Zⱼ − Cⱼ convention, all entries ≥ 0 is the optimality condition for a maximisation. Both handwritten problems are maximisations (Max Z = 3x₁ + 2x₂ and Max Z = 3x₁ − x₂), and both close with this line."},
{t:"m1t15", stage:"solve", q:"Among the Cⱼ − Zⱼ entries 7 − 5M, 15 − 13M and 20 − 12M in a minimisation, the entering variable is the one with:",
 o:["15 − 13M, the largest M-coefficient subtracted","7 − 5M, the smallest constant","20 − 12M, the largest constant","none — all are positive"], a:0,
 e:"For a minimisation we want the most negative. With M arbitrarily large the M term dominates, so compare M-coefficients first: 13 > 12 > 5, making 15 − 13M the most negative. The constants 7, 15 and 20 only matter as a tie-break between equal M-coefficients."},
{t:"m1t15", stage:"concept", q:"An artificial variable remaining basic at a positive value in the final table means:",
 o:["the original problem has no feasible solution","the solution is unbounded","the solution is degenerate","alternate optima exist"], a:0,
 e:"The artificial is not part of the original problem. Keeping it at a positive value means the original constraints cannot all be satisfied at once — infeasibility. Unbounded is the opposite situation, diagnosed from a key column of non-positive entries."},
{t:"m1t15", stage:"solve", q:"Min Z = 7x₁ + 15x₂ + 20x₃ with 2x₁+4x₂+6x₃ ≥ 24 and 3x₁+9x₂+6x₃ ≥ 30 has optimal value:",
 o:["82","54","100","24"], a:0,
 e:"At x₂ = 6/5 and x₃ = 16/5, Z = 15(6/5) + 20(16/5) = 18 + 64 = 82, and both constraints hold with equality. The alternate optimum (6, 0, 2) gives 7(6) + 20(2) = 42 + 40 = 82 as well — the zero under x₁ in the final index row is what signals this."},
{t:"m1t16", stage:"concept", q:"The revised objective function in Phase 1 of the two-phase method is:",
 o:["Min Z = a₁ + a₂ (the artificial variables only)","the original objective with M penalties","Max Z = a₁ + a₂","the original objective with zero coefficients"], a:0,
 e:"Phase 1 ignores the real costs entirely and minimises only the sum of the artificials. Every other variable is priced at 0. Option B is the Big M method, which achieves the same goal in a single continuous table."},
{t:"m1t16", stage:"concept", q:"If the Phase 1 objective value is NOT zero at the end of Phase 1, you should:",
 o:["conclude the problem does not have an optimal solution and stop","proceed to Phase 2 anyway","restart Phase 1 with a different entering variable","switch to the Big M method"], a:0,
 e:"A non-zero Phase 1 objective means the artificials cannot all be driven out, so no point satisfies the original constraints — the problem is infeasible. Switching methods would not help: Big M would end with a surviving positive artificial, reporting the same thing."},
{t:"m1t16", stage:"concept", q:"Your notes state that the two-phase method is meant only for:",
 o:["minimisation problems","maximisation problems","problems with only ≤ constraints","problems with two variables"], a:0,
 e:"The notes say so directly, and add the remedy: if you are given a maximisation, convert it into a minimisation by changing the sign. Big M has no such restriction, which is one reason to know both."},
{t:"m1t17", stage:"solve", q:"The dual of Max Z = 4x₁ + 5x₂ subject to 3x₁ + x₂ ≤ 15, x₁ + 2x₂ ≤ 10, 5x₁ + 2x₂ ≤ 20 begins:",
 o:["Min W = 15y₁ + 10y₂ + 20y₃","Max W = 15y₁ + 10y₂ + 20y₃","Min W = 4y₁ + 5y₂","Min W = 15y₁ + 10y₂"], a:0,
 e:"Max becomes Min, and the primal's right-hand sides 15, 10 and 20 become the dual's objective coefficients. There are three of them because the primal has three constraints, so the dual has three variables. Option C swaps the roles of the objective coefficients and the right-hand sides."},
{t:"m1t17", stage:"select", q:"Before writing the dual of a maximisation with a mixed set of constraints, you must:",
 o:["convert every constraint to ≤ by multiplying the offenders by −1","convert every constraint to ≥","remove the non-negativity conditions","solve the primal first"], a:0,
 e:"For a maximisation all constraints should be ≤; for a minimisation all should be ≥. Multiplying by −1 reverses the inequality and negates every term including the right-hand side. Transposing straight from mixed directions produces a dual that is not the dual."},
{t:"m1t18", stage:"concept", q:"In the dual's optimal table, the primal's variable values are found:",
 o:["as the magnitudes of Cⱼ − Zⱼ under the slack columns","in the dual's Solution column","in the dual's C_Bi column","by re-solving the primal from scratch"], a:0,
 e:"The final table carries both solutions. The dual's own variables are in its Solution column; the primal's are the magnitudes of the index-row entries under the slack columns — 20 and 30 in your worked example, which is exactly the primal optimum (20, 30)."},
{t:"m1t18", stage:"recognise", q:"A primal with 2 variables and 5 constraints is best solved by:",
 o:["constructing and solving the dual, which has 2 constraints","the primal directly, since it has few variables","the graphical method","the two-phase method"], a:0,
 e:"Rows in a simplex table come from constraints, and the number of pivots is bounded by the number of rows. The dual would have 5 variables and only 2 constraints — a two-row table instead of a five-row one. This is exactly the motivation your notes give for the dual approach."},
{t:"m1t19", stage:"recognise", q:"At optimality, a variable that is NOT in the basis has Cⱼ − Zⱼ = 0. This indicates:",
 o:["alternate optimal solutions","degeneracy","an unbounded solution","an infeasible problem"], a:0,
 e:"A non-basic variable with a zero index entry can enter the basis without changing Z, so a second optimal solution exists — and so does every point on the segment between them. Note the qualifier: basic variables always show zero there and carry no information."},
{t:"m1t19", stage:"recognise", q:"A tie for the smallest ratio in the minimum ratio test leads to:",
 o:["degeneracy — a basic variable at value 0 in the next table","an unbounded solution","infeasibility","alternate optima"], a:0,
 e:"When two rows tie, one leaves and the other's basic variable enters the next table at value 0 — a degenerate basic feasible solution. Break the tie arbitrarily and continue; a degenerate pivot leaves Z unchanged, which is normal and not a sign of error."},
{t:"m1t19", stage:"concept", q:"A row whose key column entry is 0 has its ratio written as ∞. That row:",
 o:["does not compete in the ratio test","is automatically the key row","makes the problem unbounded","must be deleted"], a:0,
 e:"Only strictly positive key column entries generate a competing ratio. Zero gives ∞ and a negative entry gives a negative ratio; neither limits how far the entering variable can increase. Only if <i>every</i> entry in the key column is ≤ 0 is the problem unbounded."},
{t:"m1t20", stage:"recognise", q:"A square cost matrix with people down the side and jobs across, one job per person, signals:",
 o:["an assignment problem","a transportation problem","a game theory problem","a linear programming formulation"], a:0,
 e:"Assignment is strictly one-to-one and its matrix is square. Transportation moves divisible quantities against supplies and demands and its matrix is generally rectangular. A game matrix has two players' strategies, not people and jobs."},

{t:"m5t1", stage:"concept", q:"The value of the game is defined as:",
 o:["the expected winnings if the game is played a large number of times","the largest payoff in the matrix","the payoff of a single play","the sum of all payoffs"], a:0,
 e:"Your notes define it twice as an expectation — 'the expected winnings of the game if the game is played a large number of times' and 'the average or expected game outcome if the game is played an infinite number of times'. In a mixed game the value need not even appear in the matrix: 38/11 is not one of 4, 2, 1, 10."},
{t:"m5t1", stage:"concept", q:"A game is one of pure strategy when:",
 o:["each player can identify one and only one strategy as optimal in each play",
    "each player has exactly one strategy available",
    "the payoff matrix contains only positive numbers",
    "both players randomise their choices"], a:0,
 e:"The notes define pure strategy by one strategy being identifiably optimal each play — not by there being only one strategy available, which is option B's confusion. Option D describes a mixed strategy game."},
{t:"m5t1", stage:"concept", q:"Game theory dates from the 1944 book Theory of Games and Economic Behavior by:",
 o:["von Neumann and Morgenstern","Nash and Selten","Harsanyi and Nash","Morse and Kimball"], a:0,
 e:"Von Neumann and Morgenstern founded the subject in 1944. Harsanyi, Nash and Selten shared the 1994 Nobel Prize for noncooperative game theory, which came later. Morse and Kimball belong to Operations Research generally, not to game theory."},
{t:"m5t2", stage:"concept", q:"'Zero-sum' means that:",
 o:["one player's gain exactly equals the other player's loss in every outcome",
    "the entries of the payoff matrix add up to zero",
    "the value of the game is zero",
    "neither player can win"], a:0,
 e:"Zero-sum is a per-outcome condition: for each cell, X's gain plus Y's loss is zero. The matrix entries need not sum to zero — the advertising matrix's entries sum to 7. A value of zero is a <i>fair</i> game, which is a different property."},
{t:"m5t2", stage:"recognise", q:"Why is the prisoner's dilemma NOT a two-person zero-sum game?",
 o:["both prisoners can be worse off at once, which zero-sum forbids",
    "it has three players",
    "the payoffs are years rather than money",
    "there is no payoff matrix"], a:0,
 e:"In the 'both confess' cell both get 20 years, worse than the 1 year each from 'neither talks'. A jointly bad outcome cannot exist in a zero-sum game, where one player's loss is necessarily the other's gain. The notes use it to introduce Nash equilibrium, not as a solvable example."},
{t:"m5t3", stage:"select", q:"For a 2×2 matrix with maximin = 6 and minimax = 6, the correct next step is:",
 o:["stop — a saddle point exists and V = 6","apply the mixed strategy formulas","apply dominance","compute D = a + d − b − c"], a:0,
 e:"Equal margins mean a saddle point, pure strategies, and the answer is already complete. Running the mixed formulas on a game with a saddle point produces meaningless probabilities. Size alone never decides the method — the saddle-point test does."},
{t:"m5t3", stage:"select", q:"A 3×4 matrix has maximin = 3 and minimax = 4. The route is:",
 o:["dominance to reduce to 2×2, then the mixed strategy formulas","the mixed formulas applied directly","a pure strategy answer","no solution exists"], a:0,
 e:"Unequal margins mean no saddle point, so mixed strategies are needed — but the formulas only apply to a 2×2, so dominance must reduce it first. Your notes stop at 2×2 by hand; anything dominance cannot reduce needs a computer solution."},
{t:"m5t4", stage:"recognise", q:"Which of these is a managerial application of game theory listed in your notes?",

{t:"m5t4", stage:"concept", q:"Which application fits the two-person zero-sum structure most cleanly?",

{t:"m5t5", stage:"concept", q:"A Nash equilibrium is a state in which:",

{t:"m5t8", stage:"solve", q:"For the game [[12, 4], [3, 7]], the denominator D = a + d − b − c equals:",

/* ===== 15 · progress model ===== */
var KEY = "or_mse_study_v1";
var THEME_KEY = "or_mse_theme_v1";
var storageOK = true;

function blankProgress(){
  return { examples:{}, practice:{}, quizTopic:{}, quizStage:{},
           lastStudied:null, streak:0, lastVisit:null, firstVisit:null };
}
var P = blankProgress();

function loadProgress(){
  try {
    var raw = window.localStorage.getItem(KEY);
    if (!raw) return blankProgress();
    var v = validateProgress(JSON.parse(raw));
    return v.ok ? v.data : blankProgress();
  } catch(e){ storageOK = false; return blankProgress(); }
}
function saveProgress(){
  try { window.localStorage.setItem(KEY, JSON.stringify(P)); return true; }
  catch(e){ storageOK = false; return false; }
}
function loadTheme(){
  try { return window.localStorage.getItem(THEME_KEY) || "system"; }
  catch(e){ storageOK = false; return "system"; }
}
function saveTheme(t){
  try { window.localStorage.setItem(THEME_KEY, t); } catch(e){ storageOK = false; }
}

/* --- import validation --- */
function isObj(o){ return o !== null && typeof o === "object" && !Array.isArray(o); }

function validateProgress(o){
  if (!isObj(o)) return {ok:false};
  var hasMarker = o._app === "or_mse_study";
  var hasShape = ["examples","practice","quizTopic","quizStage"].some(function(k){ return isObj(o[k]); });
  if (!hasMarker && !hasShape) return {ok:false};

  var d = blankProgress();
  var exIds = {}, prIds = {}, tIds = {};
  TOPICS.forEach(function(t){
    tIds[t.id] = 1;
    (t.examples||[]).forEach(function(e){ exIds[e.id] = 1; });
    (t.practice||[]).forEach(function(p){ prIds[p.id] = 1; });
  });

  if (isObj(o.examples)) Object.keys(o.examples).forEach(function(k){
    if (exIds[k] && o.examples[k] === true) d.examples[k] = true;
  });
  if (isObj(o.practice)) Object.keys(o.practice).forEach(function(k){
    if (prIds[k] && o.practice[k] === true) d.practice[k] = true;
  });
  if (isObj(o.quizTopic)) Object.keys(o.quizTopic).forEach(function(k){
    var s = o.quizTopic[k];
    if (!tIds[k] || !isObj(s)) return;
    var n = s.n, c = s.c;
    if (typeof n !== "number" || typeof c !== "number") return;
    if (!isFinite(n) || !isFinite(c)) return;
    if (n <= 0 || c < 0 || c > n) return;
    d.quizTopic[k] = {n: Math.floor(n), c: Math.floor(c)};
  });
  if (isObj(o.quizStage)) Object.keys(o.quizStage).forEach(function(k){
    var s = o.quizStage[k];
    if (STAGES.indexOf(k) < 0 || !isObj(s)) return;
    var n = s.n, c = s.c;
    if (typeof n !== "number" || typeof c !== "number") return;
    if (!isFinite(n) || !isFinite(c)) return;
    if (n <= 0 || c < 0 || c > n) return;
    d.quizStage[k] = {n: Math.floor(n), c: Math.floor(c)};
  });
  ["lastStudied","lastVisit","firstVisit"].forEach(function(k){
    if (typeof o[k] === "string" && o[k].length && o[k].length < 40) d[k] = o[k];
  });
  if (typeof o.streak === "number" && isFinite(o.streak))
    d.streak = Math.max(0, Math.min(3650, Math.floor(o.streak)));
  return {ok:true, data:d};
}

var STAGES = ["recognise","select","solve","concept"];

function today(){ return new Date().toISOString().slice(0,10); }
function touchVisit(){
  var t = today();
  if (!P.firstVisit) P.firstVisit = t;
  if (P.lastVisit !== t){
    var y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    P.streak = (P.lastVisit === y) ? (P.streak || 0) + 1 : 1;
    P.lastVisit = t;
    saveProgress();
  }
}
/* ===== 16 · derived progress — nothing here is stored ===== */
function qIdsOf(t){
  var ids = [];
  (t.examples||[]).forEach(function(e){ ids.push(["e", e.id]); });
  (t.practice||[]).forEach(function(p){ ids.push(["p", p.id]); });
  return ids;
}
function isDone(kind, id){
  return (kind === "e" ? P.examples : P.practice)[id] === true;
}
function topicProgress(t){
  var ids = qIdsOf(t), done = 0;
  ids.forEach(function(x){ if (isDone(x[0], x[1])) done++; });
  return { done:done, total:ids.length, pct: ids.length ? Math.round(done*100/ids.length) : 0 };
}
function topicStatus(id){
  var t = TBYID[id]; if (!t) return "none";
  var p = topicProgress(t);
  if (!p.total) return "none";
  if (p.done === 0) return "none";
  return p.done === p.total ? "done" : "progress";
}
function progressOf(list){
  var done = 0, total = 0;
  list.forEach(function(t){ var p = topicProgress(t); done += p.done; total += p.total; });
  return { done:done, total:total, pct: total ? Math.round(done*100/total) : 0 };
}
function overallProgress(){ return progressOf(TOPICS); }
function moduleProgress(m){ return progressOf(topicsOf(m)); }
function trackProgress(track){
  return progressOf(TOPICS.filter(function(t){ return t.type === track; }));
}
function moduleTrackProgress(m, track){
  return progressOf(TOPICS.filter(function(t){ return t.m === m && t.type === track; }));
}
function topicsFinished(m){
  var ts = topicsOf(m), n = 0;
  ts.forEach(function(t){ if (topicStatus(t.id) === "done") n++; });
  return { done:n, total:ts.length };
}
function quizAccuracy(){
  var n = 0, c = 0;
  Object.keys(P.quizTopic).forEach(function(k){ n += P.quizTopic[k].n; c += P.quizTopic[k].c; });
  return { n:n, c:c, pct: n ? Math.round(c*100/n) : 0 };
}
function weakTopics(){
  var out = [];
  Object.keys(P.quizTopic).forEach(function(k){
    var s = P.quizTopic[k];
    if (!TBYID[k] || s.n < 2) return;
    var pct = Math.round(s.c*100/s.n);
    if (pct < 60) out.push({ id:k, pct:pct, n:s.n });
  });
  out.sort(function(a,b){ return a.pct - b.pct; });
  return out;
}
function band(pct){ return pct < 34 ? "b-bad" : (pct < 67 ? "b-warn" : ""); }

/* Study-next: first match wins. Deterministic and stated on the Dashboard. */
function studyNext(){
  var w = weakTopics();
  if (w.length) return { t: TBYID[w[0].id], why:"weakest quiz topic" };

  var started = TOPICS.filter(function(t){
    return t.priority === "high" && topicStatus(t.id) === "progress";
  });
  if (started.length) return { t: started[0], why:"high-priority topic already started" };

  var order = ["problem-solving","theory"];
  for (var i = 0; i < order.length; i++){
    var un = TOPICS.filter(function(t){
      return t.priority === "high" && t.type === order[i] && topicStatus(t.id) === "none"
             && topicProgress(t).total > 0;
    });
    if (un.length) return { t: un[0], why:"unstarted high-priority topic" };
  }
  var any = TOPICS.filter(function(t){
    var p = topicProgress(t); return p.total > 0 && p.done < p.total;
  });
  if (any.length) return { t: any[0], why:"topic with unfinished questions" };

  if (quizAccuracy().n === 0) return { quiz:true, why:"every question is marked — take the quiz" };
  return { exam:true, why:"everything is marked — open Exam Mode" };
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");

var quizState = null;

function buildQuiz(n){
  var pool = QUIZ.slice();
  for (var i = pool.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var qs = pool.slice(0, Math.min(n, pool.length)).map(function(q){
    var idx = q.o.map(function(_, k){ return k; });
    for (var i = idx.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    return { q:q, order:idx, sel:null, checked:false };
  });
  quizState = { qs:qs, i:0, correct:0 };
}

function recordQuiz(q, ok){
  var a = P.quizTopic[q.t] || {n:0, c:0};
  a.n++; if (ok) a.c++;
  P.quizTopic[q.t] = a;
  var b = P.quizStage[q.stage] || {n:0, c:0};
  b.n++; if (ok) b.c++;
  P.quizStage[q.stage] = b;

var INDEX = null;
function buildIndex(){
  if (INDEX) return INDEX;
  var ix = [];
  TOPICS.forEach(function(t){
    var crumb = moduleName(t.m)+" · "+(t.type === "theory" ? "Theory" : "Numericals");
    ix.push({kind:"Topic", title:t.title, snip:t.summary, crumb:crumb, go:"topic", id:t.id});
    (t.examples||[]).forEach(function(e){
      ix.push({kind:"Worked example", title:e.title, snip:stripTags(e.q),
               crumb:crumb+" · "+t.title, go:"topic", id:t.id, anchor:e.id});
    });
    (t.practice||[]).forEach(function(p){
      ix.push({kind:"Practice question", title:stripTags(p.q), snip:stripTags(p.hint),
               crumb:crumb+" · "+t.title, go:"topic", id:t.id, anchor:p.id});
    });
    (t.questions||[]).forEach(function(q){
      ix.push({kind:"Likely question", title:q.q,
               snip:q.marks+" marks · "+(q.source === "source" ? "From source material" : "Likely exam pattern"),
               crumb:crumb+" · "+t.title, go:"topic", id:t.id});
    });
    t.recognition.clues.forEach(function(c){
      ix.push({kind:"Recognition clue", title:stripTags(c), snip:stripTags(t.recognition.firstMove),
               crumb:crumb+" · "+t.title, go:"topic", id:t.id});
    });
    t.recognition.wording.forEach(function(w){
      ix.push({kind:"Exam wording", title:w, snip:t.title, crumb:crumb, go:"topic", id:t.id});
    });
  });
  FORMULAE.forEach(function(g){
    g.items.forEach(function(it){
      ix.push({kind:"Formula", title:it.f, snip:it.m+" — "+it.w, crumb:"Formulae · "+g.g, go:"formulae"});
    });
  });
  Object.keys(REVIEW).forEach(function(m){
    REVIEW[m].forEach(function(c){
      ix.push({kind:"Quick review", title:c.t, snip:stripTags(c.b),
               crumb:moduleName(m)+" · Quick Review", go:"mod", m:m, sub:"review"});
    });
  });
  QUIZ.forEach(function(q){
    ix.push({kind:"Quiz question", title:q.q, snip:stripTags(q.e).slice(0,140),
             crumb:"Quiz · "+q.stage, go:"quiz"});
  });
  INDEX = ix;
  return ix;
}

}
function hl(text, q){
  var s = esc(text), i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return s;   /* normalised-only match: show the text unhighlighted */
  return s.slice(0, i)+"<b>"+s.slice(i, i + q.length)+"</b>"+s.slice(i + q.length);
}
function runSearch(qs){
  var q = qs.trim();
  if (q.length < 2){ app.innerHTML = '<h1>Search</h1><p class="lead">Type at least two characters.</p>'; return; }
  var lq = q.toLowerCase();
  var nq = norm(q);
  var hits = buildIndex().filter(function(r){
    var hay = r.title+" "+r.snip+" "+r.crumb;
    return hay.toLowerCase().indexOf(lq) >= 0 || norm(hay).indexOf(nq) >= 0;
  }).slice(0, 60);
  var h = '<h1>Search</h1><p class="lead">'+hits.length+' result'+(hits.length === 1 ? "" : "s")+' for &ldquo;'+esc(q)+'&rdquo;.</p>';
  if (!hits.length) h += '<div class="card"><p style="margin:0">Nothing matched. Try a method name, a formula symbol, or a phrase from a question.</p></div>';
  hits.forEach(function(r, i){
    h += '<button class="sres" data-sr="'+i+'"><span class="crumb">'+esc(r.kind)+' &middot; '+esc(r.crumb)+'</span>'+
         '<b style="color:var(--text)">'+hl(r.title, q)+'</b><br><span class="muted">'+hl(r.snip.slice(0,160), q)+'</span></button>';
  });
  app.innerHTML = h;
  app._hits = hits;
}
/* ===== 26 · Settings ===== */
function viewSettings(){
  var o = overallProgress(), acc = quizAccuracy(), w = weakTopics();
  var h = '<h1>Settings</h1><h2>Progress</h2><div class="tw"><table>'+
    '<tr><th>Measure</th><th>Value</th></tr>'+
    '<tr><td>Overall</td><td>'+o.pct+'% ('+o.done+' of '+o.total+' questions)</td></tr>';
  TRACKS.forEach(function(tr){
    var p = trackProgress(tr.id);
    h += '<tr><td>'+esc(tr.label)+'</td><td>'+p.pct+'% ('+p.done+' of '+p.total+')</td></tr>';
  });
  MODULES.forEach(function(m){
    var p = moduleProgress(m.id);
    h += '<tr><td>'+esc(m.n)+'</td><td>'+(p.total ? p.pct+'% ('+p.done+' of '+p.total+')' : 'no material') +'</td></tr>';
  });
  h += '<tr><td>Quiz accuracy</td><td>'+(acc.n ? acc.pct+'% over '+acc.n+' answers' : 'not attempted')+'</td></tr>'+
    '<tr><td>Weak topics</td><td>'+(w.length ? w.length+' below 60%' : 'none')+'</td></tr>'+
    '<tr><td>First visit</td><td>'+esc(P.firstVisit || "today")+'</td></tr>'+
    '<tr><td>Streak</td><td>'+(P.streak || 0)+' day'+((P.streak || 0) === 1 ? "" : "s")+'</td></tr>'+
    '</table></div>';
  if (!storageOK) h += '<div class="box warning"><h5>Storage unavailable</h5><p>This browser is blocking local storage, so nothing is being saved. The site works normally otherwise.</p></div>';

  h += '<h2>Your data</h2><div class="card">'+
    '<div class="btnrow"><button class="btn" data-act="export">Export</button>'+
    '<button class="btn" data-act="import">Import</button>'+
    '<button class="btn" data-act="reset">Reset</button></div>'+
    '<p class="small muted" style="margin:9px 0 0">Export downloads a JSON file. Import replaces what is in this browser. '+
    'Reset clears this browser only &mdash; no other device is affected.</p>'+
    '<input type="file" id="impfile" accept="application/json,.json" hidden></div>';

  var th = loadTheme();
  h += '<h2>Theme</h2><div class="card"><div class="btnrow">'+
    ['light','dark','system'].map(function(k){
      return '<button class="btn'+(th === k ? " on" : "")+'" data-theme="'+k+'">'+
             (k === "system" ? "Match system" : k.charAt(0).toUpperCase()+k.slice(1))+'</button>';
    }).join('')+'</div></div>';

  h += '<h2>About</h2><div class="card">'+
    '<p><b>'+esc(META.code)+' &middot; '+esc(META.course)+'</b><br>'+
    esc(META.exam)+' &middot; '+META.marks+' marks &middot; '+(META.minutes/60)+' hours &middot; '+esc(META.scope)+'.<br>'+
    '<span class="muted">'+esc(META.scopeNote)+'</span></p>'+
    '<p><b>There is no previous-year MSE paper in this folder.</b> A past <i>Internal Assessment I</i> paper with '+
    'solutions has since been added (Module 1 folder, <span class="mono">T13_IA_QP_3CO_solution.docx</span>), but that is a '+
    'different assessment &mdash; 20 marks in 1 hour, against this exam&rsquo;s 30 marks in 1.5 hours &mdash; and no question on '+
    'this site is drawn from it. Nothing here is labelled &lsquo;previous year&rsquo; and nothing is described as guaranteed. '+
    'Questions carry one of two labels: <i>From source material</i> means the question appears in a file in the folder; '+
    '<i>Likely exam pattern</i> means it was written to match the pattern of those questions.</p>'+
    '<p><b>Priority is derived, not chosen.</b> A topic is <i>high</i> if it appears in a teacher-stated focus list, '+
    'serves two or more learning outcomes, has three or more worked examples in the source, or is explicitly weighted. '+
    'It is <i>medium</i> if it is a syllabus topic with real teaching material behind it, and <i>low</i> if it appears '+
    'in a single slide or is background.</p>'+
    '<p><b>Progress model.</b> Only marking an individual question moves a percentage. Opening a page marks nothing. '+
    'A topic counts as finished when all of its questions are marked. Every percentage on this site is computed at '+
    'render time from this browser’s own storage, so a new browser opens at 0%.</p>'+
    '<h4>Built from these files</h4><ul class="small">';
  SOURCES.forEach(function(s){ h += '<li>'+esc(s)+'</li>'; });
  h += '</ul><h4>Learning outcomes</h4><ol class="small">';
  LOS.forEach(function(l){
    h += '<li>'+esc(l.t)+' <span class="muted">('+(l.src === "syllabus" ? "syllabus course outcome" : "Module 5 deck objective")+')</span></li>';
  });
  h += '</ol>'+
    '<h4>Where the material does not match the scope</h4>'+
    '<p class="small">The stated scope is Modules 1, 2 and 5. This site was built when the folder held material for '+
    'Modules 1 and 5 only. Since then the folder has been reorganised into module folders and more material has arrived '+
    '&mdash; queuing, transportation, assignment, sequencing, travelling salesman and integer programming. '+
    '<b>Topic pages have not been written for any of it</b>, so it contributes nothing to the readiness percentages; '+
    'the Module 1 and Module 2 tabs say what is there and where to find it. Eight Module 1 syllabus headings still have '+
    'no material anywhere and are listed at the foot of the Module 1 tab. The full audit is in '+
    '<span class="mono">_ORGANISATION-gaps.md</span>.</p>'+
    '<h4>In the folder, not yet on this site</h4><ul class="small">'+
    LATER_MATERIAL.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'+
    '<h4>Discrepancies found in the source material</h4>'+
    '<p class="small">Four were found and are noted on the relevant topic pages, with the teacher’s figures presented as authoritative:</p>'+
    '<ul class="small">'+
    '<li>The three-variable simplex example prints &ldquo;x&#8321; = 2, x&#8323; = 2&rdquo; in its summary while its own final table reads x&#8321; = 5, x&#8323; = 0. Z = 10 is correct either way.</li>'+
    '<li>A dominance problem prints X = (3/4, 1/4, 0, 0) &mdash; four entries for a three-strategy player. V = 15/4 is correct.</li>'+
    '<li>A second dominance problem gives V = 5 correctly but prints player A’s and player B’s probability vectors swapped.</li>'+
    '<li>One answer key prints V = 11/5 where the value is negative, &minus;11/5; the row minima and column maxima bracket the value below zero.</li>'+
    '</ul>'+
    '<p class="small">Three more were found in the past Internal Assessment paper added later: Q2(b) states &ldquo;the solution '+
    'is unbounded&rdquo; and then gives F* = 3.4 at (0.4, 1.8) &mdash; recomputation confirms the problem is <b>bounded</b> and '+
    'F* = 3.4 is right, so the &ldquo;unbounded&rdquo; conclusion is wrong; Q3(a) gives both 1525 and 1510 as the total cost; '+
    'and Q3(b) says the solution is degenerate and then that it is non-degenerate. Its Q2(a) and Q1(e) answers both verify exactly.</p></div>';
  app.innerHTML = h;
}

function doExport(){
  var data = JSON.parse(JSON.stringify(P));
  data._app = "or_mse_study";
  data._course = META.code+" "+META.course;
  data._exportedAt = new Date().toISOString();
  try {
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "or-mse-progress.json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("Progress exported");
  } catch(e){ toast("Export is not available in this browser"); }
}
function doImport(file){
  var r = new FileReader();
  r.onload = function(){
    var parsed;
    try { parsed = JSON.parse(r.result); }
    catch(e){ toast("That file is not valid JSON"); return; }
    var v = validateProgress(parsed);
    if (!v.ok){ toast("That is not a progress file — nothing was changed"); return; }
    P = v.data;
    saveProgress();
    render();
    toast("Progress imported");
  };
  r.onerror = function(){ toast("Could not read that file"); };
  r.readAsText(file);
}
function doReset(){
  var o = overallProgress();
  var msg = "This clears all progress in this browser: "+o.done+" marked question"+(o.done === 1 ? "" : "s")+
            ", your quiz record and your streak. Other devices are not affected. This cannot be undone.";
  if (!window.confirm(msg)) return;
  P = blankProgress();
  try { window.localStorage.removeItem(KEY); } catch(e){ storageOK = false; }
  view = {name:"dash"};
  render();
  toast("You are back at 0%");
}
/* ===== 27 · router, nav, events, boot ===== */
var view = {name:"dash"};
var tabsEl = document.getElementById("tabs");
var searchWrap = document.getElementById("searchwrap");
var qEl = document.getElementById("q");

var NAV = [{k:"dash", label:"Dashboard"}]
  .concat(MODULES.map(function(m){ return {k:"mod", m:m.id, label:m.n}; }))
  .concat([{k:"recog", label:"Recognition"}, {k:"quiz", label:"Quiz"},
           {k:"formulae", label:"Formulae"}, {k:"exam", label:"Exam Mode"}]);

function activeKey(){
  if (view.name === "topic"){ var t = TBYID[view.id]; return t ? "mod:"+t.m : "dash"; }
  if (view.name === "mod") return "mod:"+view.m;
  if (view.name === "search" || view.name === "settings") return "";
  return view.name;
}
function renderTabs(){
  var ak = activeKey();
  tabsEl.innerHTML = NAV.map(function(n){
    var key = n.k === "mod" ? "mod:"+n.m : n.k;
    var attrs = 'data-go="'+n.k+'"'+(n.m ? ' data-m="'+n.m+'"' : '');
    return '<button class="tab'+(key === ak ? " on" : "")+'" role="tab" aria-selected="'+(key === ak)+'" '+attrs+'>'+
           esc(n.label)+'</button>';
  }).join('');
}
function applyTheme(t){
  var root = document.documentElement;
  if (t === "light" || t === "dark") root.setAttribute("data-theme", t);
  else root.removeAttribute("data-theme");
}
function render(){
  renderTabs();
  switch (view.name){
    case "mod":      viewModule(view.m); break;
    case "topic":    viewTopic(view.id); break;
    case "recog":    viewRecog(); break;
    case "quiz":     viewQuiz(); break;
    case "formulae": viewFormulae(); break;
    case "exam":     viewExam(); break;
    case "settings": viewSettings(); break;
    case "search":   runSearch(view.q || ""); break;
    default:         viewDash();
  }
}
function go(v, keepScroll){
  view = v;
  if (keepScroll) scrollKeep(render);
  else { render(); try { window.scrollTo(0, 0); } catch(e){} }
}

document.addEventListener("click", function(ev){
  var el = ev.target;
  while (el && el !== document && !(el.dataset && Object.keys(el.dataset).length)) el = el.parentNode;
  if (!el || el === document) return;
  var d = el.dataset;

  if (d.go){
    if (d.go === "topic") go({name:"topic", id:d.id});
    else if (d.go === "mod"){
      if (d.sub) subTab[d.m] = d.sub;
      go({name:"mod", m:d.m});
    }
    else go({name:d.go});
    return;
  }
  if (d.sub){ subTab[d.m] = d.sub; go({name:"mod", m:d.m}, true); return; }
  if (d.rev){ revealed[d.rev] = !revealed[d.rev]; scrollKeep(render); return; }
  if (d.hint){ revealed[d.hint+"_h"] = !revealed[d.hint+"_h"]; scrollKeep(render); return; }
  if (d.mark){
    var map = d.mark === "e" ? P.examples : P.practice;
    if (map[d.id]) delete map[d.id]; else map[d.id] = true;
    P.lastStudied = today();
    if (!saveProgress()) toast("Progress could not be saved in this browser");
    scrollKeep(render);
    return;
  }
  if (d.act === "search"){
    searchWrap.classList.toggle("on");
    if (searchWrap.classList.contains("on")) qEl.focus();
    return;
  }
  if (d.act === "theme"){
    var cur = loadTheme();
    var next = cur === "system" ? "light" : (cur === "light" ? "dark" : "system");
    saveTheme(next); applyTheme(next);
    toast("Theme: "+(next === "system" ? "match system" : next));
    if (view.name === "settings") scrollKeep(render);
    return;
  }
  if (d.theme){ saveTheme(d.theme); applyTheme(d.theme); scrollKeep(render); return; }
  if (d.act === "export"){ doExport(); return; }
  if (d.act === "import"){ var f = document.getElementById("impfile"); if (f) f.click(); return; }
  if (d.act === "reset"){ doReset(); return; }

  if (d.quiz === "start"){ buildQuiz(parseInt(d.n, 10)); go({name:"quiz"}); return; }
  if (d.quiz === "reset"){ quizState = null; go({name:"quiz"}); return; }
  if (d.quiz === "check"){
    var c = quizState.qs[quizState.i];
    if (c.sel === null){ toast("Choose an answer first"); return; }
    c.checked = true;
    var ok = c.sel === c.q.a;
    if (ok) quizState.correct++;
    recordQuiz(c.q, ok);
    scrollKeep(render);
    return;
  }
  if (d.quiz === "next"){ quizState.i++; go({name:"quiz"}); return; }
  if (d.opt !== undefined && quizState){
    var cq = quizState.qs[quizState.i];
    if (cq && !cq.checked){ cq.sel = cq.order[parseInt(d.opt, 10)]; scrollKeep(render); }
    return;
  }
  if (d.sr !== undefined){
    var r = (app._hits || [])[parseInt(d.sr, 10)];
    if (!r) return;
    if (r.go === "topic"){
      go({name:"topic", id:r.id});
      if (r.anchor) setTimeout(function(){
        var n = document.getElementById(r.anchor);
        if (n && n.scrollIntoView) n.scrollIntoView();
      }, 0);
    } else if (r.go === "mod"){
      if (r.sub) subTab[r.m] = r.sub;
      go({name:"mod", m:r.m});
    } else go({name:r.go});
    return;
  }
}, false);

document.addEventListener("change", function(ev){
  if (ev.target && ev.target.id === "impfile" && ev.target.files && ev.target.files[0]){
    doImport(ev.target.files[0]);
    ev.target.value = "";
  }
}, false);

document.addEventListener("input", function(ev){
  if (ev.target && ev.target.id === "q"){
    var v = ev.target.value;
    if (!v.trim()){ if (view.name === "search") go({name:"dash"}); return; }
    view = {name:"search", q:v};
    renderTabs();
    runSearch(v);
  }
}, false);

document.addEventListener("keydown", function(ev){
  if (ev.key === "/" && document.activeElement !== qEl){
    ev.preventDefault();
    searchWrap.classList.add("on");
    qEl.focus();
  }
}, false);

/* boot */
applyTheme(loadTheme());
P = loadProgress();
touchVisit();
render();
</script>
